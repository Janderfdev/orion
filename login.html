<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<script src="standby.js"></script>
<title>ORION AI — Entrar</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--font:'Sora',-apple-system,'Helvetica Neue',sans-serif;--font-mono:'Space Grotesk','Inter',sans-serif;
  --bg:#000000;--surface:#0D1020;--blue-dark:#080912;--active:#2D2A5E;--line:#29243A;--accent:#7770B8;--accent-rgb:119,112,184;}
html,body{width:100vw;min-height:100dvh;overflow:hidden;background:var(--bg);color:#F4F2FF;font-family:var(--font);-webkit-font-smoothing:antialiased;}
body.is-standby{background:#030406;}
#cosmos{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none;background:var(--bg);}
#cosmos::before,#cosmos::after{content:"";position:absolute;left:50%;top:45%;border:1px solid rgba(var(--accent-rgb),.10);border-radius:50%;width:min(1200px,130vw);height:min(1200px,130vw);transform:translate(-50%,-50%) rotate(-24deg) scaleY(.78);}
#cosmos::after{width:min(800px,90vw);height:min(800px,90vw);border-color:rgba(var(--accent-rgb),.07);transform:translate(-50%,-50%) rotate(18deg) scaleY(.7);}
#cosmos.on{opacity:1;}
.view{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-y:auto;padding:24px 16px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.2s ease,visibility 0s linear 1.2s;}
.view.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 1.2s ease,visibility 0s;}
#standby{padding:0;overflow:hidden;}
#standby img{width:min(100vw,100dvh);height:min(100vw,100dvh);object-fit:contain;}
.back{position:absolute;top:16px;left:16px;height:40px;padding:0 16px 0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;text-decoration:none;font:500 12px var(--font);letter-spacing:.08em;color:rgba(245,247,250,.7);background:rgba(13,16,32,.6);border:1px solid var(--line);transition:color .2s ease,border-color .2s ease,background .2s ease;}
.back:hover{color:#fff;border-color:rgba(var(--accent-rgb),.5);background:rgba(45,42,94,.5);}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
.panel{width:min(400px,100%);margin:auto;padding:34px 30px 28px;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:28px;background:rgba(13,16,32,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);}
.login-logo{width:clamp(48px,8vmin,64px);height:auto;filter:drop-shadow(0 0 20px rgba(var(--accent-rgb),.35));}
.login-word{margin-top:16px;width:min(250px,70%);height:auto;filter:drop-shadow(0 0 14px rgba(var(--accent-rgb),.22));}
.login-sub{margin-top:10px;font-size:12px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:rgba(245,247,250,.55);}
#loginForm{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:12px;}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.6);}
.tab{flex:1;height:36px;border-radius:999px;border:0;background:transparent;color:rgba(245,247,250,.55);font:600 11px var(--font);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background .2s ease,color .2s ease;}
.tab:hover{color:#fff;}
.tab.on{background:var(--active);color:#fff;}
.field{width:100%;height:50px;border-radius:999px;padding:0 22px;font:500 14px var(--font);color:#fff;background:rgba(0,0,0,.65);border:1px solid var(--line);outline:none;transition:border-color .2s ease,box-shadow .2s ease;}
.field::placeholder{color:rgba(245,247,250,.42);}
.field:focus{border-color:rgba(var(--accent-rgb),.75);box-shadow:0 0 0 3px rgba(45,42,94,.6);}
.btn{height:50px;border-radius:999px;cursor:pointer;font:600 12px var(--font);letter-spacing:.2em;text-transform:uppercase;color:#fff;background:var(--active);border:1px solid rgba(var(--accent-rgb),.45);transition:background .2s ease,border-color .2s ease,opacity .2s ease;}
.btn:hover{background:#383472;border-color:rgba(var(--accent-rgb),.7);}
.btn:active{background:#0C0D1C;}
.btn:disabled{opacity:.55;cursor:default;}
.btn-g{display:flex;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.65);border-color:var(--line);letter-spacing:.06em;text-transform:none;font-weight:500;font-size:13px;}
.btn-g:hover{background:var(--blue-dark);border-color:rgba(var(--accent-rgb),.45);}
.sep{display:flex;align-items:center;gap:12px;font-size:10px;font-weight:500;letter-spacing:.3em;color:rgba(245,247,250,.42);}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1);}
.link{align-self:center;background:none;border:0;cursor:pointer;color:rgba(245,247,250,.6);font:500 12px var(--font);padding:4px 8px;transition:color .2s ease;}
.link:hover{color:#fff;}
.btn:focus-visible,.field:focus-visible,.tab:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
.err{min-height:18px;font-size:12px;font-weight:500;line-height:1.6;text-align:center;color:#F87171;opacity:0;transition:opacity .3s ease;}
.err.show{opacity:1;}.err.ok{color:#A9A6C9;}
#loginForm.shake{animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}55%{transform:translateX(4px);}80%{transform:translateX(-2px);}}
#enterOverlay{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:all;transition:opacity .45s ease;}
#enterOverlay.on{opacity:1;}
.boot-word{width:min(190px,56vw);height:auto;margin-bottom:24px;filter:drop-shadow(0 0 14px rgba(var(--accent-rgb),.22));}
.boot-ring-wrap{position:relative;width:76px;height:76px;margin-bottom:46px;}
.boot-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.18);border-top-color:rgba(var(--accent-rgb),.75);animation:bootspin 1.1s linear infinite;}
.boot-ring:nth-child(2){inset:14px;border-top-color:rgba(var(--accent-rgb),.45);animation-duration:1.6s;animation-direction:reverse;}
@keyframes bootspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){.boot-ring{animation:none;}#enterOverlay{transition:none;}#loginForm.shake{animation:none;}}
</style>
</head>
<body>

<div id="cosmos"></div>

<section class="view" id="standby" aria-label="Standby">
  <img src="assets/standby.png" alt="ORION AI — please stand by">
</section>

<section class="view" id="login" aria-label="Login">
  <a class="back" href="index.html" aria-label="Voltar" title="Voltar">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Voltar
  </a>
  <div class="panel">
  <img class="login-logo" src="assets/orion_ai_logo.png" alt="">
  <img class="login-word" src="assets/orion_ai_wordmark.png" alt="ORION AI">
  <p class="login-sub">Acesse sua conta</p>
  <form id="loginForm" novalidate>
    <div class="tabs" role="tablist">
      <button type="button" class="tab on" id="tabIn" role="tab">Entrar</button>
      <button type="button" class="tab" id="tabUp" role="tab">Criar conta</button>
    </div>
    <input class="field" id="email" type="email" placeholder="e-mail" autocomplete="email" autocapitalize="none" spellcheck="false" aria-label="E-mail">
    <input class="field" id="pass" type="password" placeholder="senha" autocomplete="current-password" aria-label="Senha">
    <input class="field" id="pass2" type="password" placeholder="confirmar senha" autocomplete="new-password" aria-label="Confirmar senha" hidden>
    <button class="btn" id="submitBtn" type="submit">Entrar</button>
    <button class="link" id="forgot" type="button">Esqueci minha senha</button>
    <div class="sep">OU</div>
    <button class="btn btn-g" id="googleBtn" type="button">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.2 5.4-4.7 7.1l7.6 5.9c4.4-4.1 6.9-10.1 6.9-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Continuar com Google
    </button>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
  </div>
</section>

<script>
/* ORION AI — entrada: STANDBY → LOGIN → pages/orion.html (estado sempre derivado do relógio) */

/* A janela do standby (datas, relógio de teste e liberação do dono) fica em standby.js, igual para index, login e orion.
   Se o arquivo não carregar, o login fica preso no standby. */
const S = window.ORION_STANDBY || { phase: () => 'released', nowMs: () => Date.now() };
const { phase, nowMs } = S;
window.__orionPhase = () => phase(nowMs());

const $ = id => document.getElementById(id);
const views = { standby: $('standby'), login: $('login') };
let current = null, flowStarted = false, flowTimer = null;

function show(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle('on', k === name));
  current = name;
}
function startLogin() {
  if (flowStarted) return;
  flowStarted = true;
  document.body.classList.remove('is-standby');
  if (window.__orionUser && window.__orionEnter) { window.__orionEnter(); return; }   // já logado: entra direto
  $('cosmos').classList.add('on');
  show('login');
  flowTimer = setTimeout(() => $('email').focus(), 1300);
}
function enterStandby() {
  clearTimeout(flowTimer);
  flowStarted = false;
  $('cosmos').classList.remove('on');
  document.body.classList.add('is-standby');
  show('standby');
}
function endStandby() {
  if (flowStarted) return;
  views.standby.classList.remove('on');
  setTimeout(startLogin, 1400);
}
function tick() {
  const p = phase(nowMs());
  if (p === 'released' && current === 'standby') endStandby();
  else if (p === 'standby' && current !== 'standby') enterStandby();
}
setInterval(tick, 500);
document.addEventListener('visibilitychange', tick);
addEventListener('focus', tick);
addEventListener('pageshow', tick);

(function boot() {
  if (phase(nowMs()) === 'standby') requestAnimationFrame(enterStandby);
  else requestAnimationFrame(startLogin);
})();

setTimeout(() => {
  if (!window.__orionReady) {
    const e = $('err'); e.classList.remove('ok');
    e.textContent = 'Não foi possível carregar o login. Verifique sua conexão.';
    e.classList.add('show');
  }
}, 8000);
</script>

<script type="module">
/* LOGIN REAL — Firebase Authentication (e-mail/senha + Google).
   A configuração abaixo é pública por design no Firebase; o backend valida o token em cada pergunta. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signInWithPopup, GoogleAuthProvider, sendPasswordResetEmail,
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyBpYSGxHqD_XbZszZiF5HbN-pIZOaveh9s",
  authDomain: "orion-ai-b8d39.firebaseapp.com",
  projectId: "orion-ai-b8d39",
  storageBucket: "orion-ai-b8d39.firebasestorage.app",
  messagingSenderId: "1087684319550",
  appId: "1:1087684319550:web:d5b20c93c2e3179de5f46f",
});
const auth = getAuth(app);
auth.languageCode = 'pt-BR';
window.__orionReady = true;

const $ = id => document.getElementById(id);
let mode = 'in', busy = false, entering = false;

/* V5.0: ao entrar, a tela escurece e mostra o nome e os círculos (os mesmos da entrada do orion.html), depois abre o app */
function enter() {
  if (entering) return;
  entering = true;
  const o = document.createElement('div');
  o.id = 'enterOverlay';
  o.innerHTML = '<img class="boot-word" src="assets/orion_ai_wordmark.png" alt="ORION AI"><div class="boot-ring-wrap"><div class="boot-ring"></div><div class="boot-ring"></div></div>';
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add('on'));
  setTimeout(() => { location.href = 'pages/orion.html'; }, 900);
}
window.__orionEnter = enter;

// dispara no login novo E quando a sessão anterior é restaurada (durante o standby espera)
onAuthStateChanged(auth, user => {
  window.__orionUser = user;
  if (user && window.__orionPhase() !== 'standby') enter();
});

const MSG = {
  'auth/invalid-credential': 'E-mail ou senha incorretos.',
  'auth/wrong-password': 'E-mail ou senha incorretos.',
  'auth/user-not-found': 'E-mail ou senha incorretos.',
  'auth/invalid-email': 'E-mail inválido.',
  'auth/missing-password': 'Digite a senha.',
  'auth/email-already-in-use': 'Este e-mail já tem uma conta. Use Entrar.',
  'auth/weak-password': 'Senha fraca: use pelo menos 6 caracteres.',
  'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco.',
  'auth/network-request-failed': 'Sem conexão com a internet.',
  'auth/popup-blocked': 'Permita pop-ups para entrar com Google.',
  'auth/unauthorized-domain': 'Domínio não autorizado no Firebase.',
  'auth/operation-not-allowed': 'Este método de login não está ativado.',
};
const SILENT = ['auth/popup-closed-by-user', 'auth/cancelled-popup-request'];

function say(text, ok = false) {
  const e = $('err');
  e.classList.toggle('ok', ok);
  e.textContent = text;
  e.classList.toggle('show', !!text);
}
function fail(err) {
  if (SILENT.includes(err.code)) return say('');
  say(MSG[err.code] || ('Não foi possível entrar. (' + (err.code || 'erro') + ')'));
  const f = $('loginForm');
  f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake');
}
function setBusy(on) {
  busy = on;
  ['submitBtn', 'googleBtn'].forEach(id => { $(id).disabled = on; });
}
function setMode(m) {
  mode = m;
  $('tabIn').classList.toggle('on', m === 'in');
  $('tabUp').classList.toggle('on', m === 'up');
  $('pass2').hidden = m === 'in';
  $('forgot').hidden = m === 'up';
  $('submitBtn').textContent = m === 'in' ? 'Entrar' : 'Criar conta';
  $('pass').autocomplete = m === 'in' ? 'current-password' : 'new-password';
  say('');
}
$('tabIn').addEventListener('click', () => setMode('in'));
$('tabUp').addEventListener('click', () => setMode('up'));

// o botão "Criar conta" da página de apresentação abre direto a aba de cadastro
if (new URLSearchParams(location.search).get('criar') === '1') setMode('up');

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (busy) return;
  const email = $('email').value.trim(), pass = $('pass').value;
  if (!email || !pass) return say('Preencha e-mail e senha.');
  if (mode === 'up' && pass !== $('pass2').value) return say('As senhas não coincidem.');
  setBusy(true); say('');
  try {
    if (mode === 'in') await signInWithEmailAndPassword(auth, email, pass);
    else await createUserWithEmailAndPassword(auth, email, pass);
  } catch (err) { fail(err); }
  setBusy(false);
});

$('googleBtn').addEventListener('click', async () => {
  if (busy) return;
  setBusy(true); say('');
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (err) { fail(err); }
  setBusy(false);
});

$('forgot').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!email) return say('Digite seu e-mail acima para receber o link.');
  try {
    await sendPasswordResetEmail(auth, email);
    say('Se este e-mail tiver conta, enviamos um link para redefinir a senha.', true);
  } catch (err) { fail(err); }
});

['email', 'pass', 'pass2'].forEach(id => $(id).addEventListener('input', () => say('')));
</script>
</body>
</html>
