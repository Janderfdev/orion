<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --font:'Inter',-apple-system,'Helvetica Neue',sans-serif;
  --font-mono:'Space Grotesk','Inter',sans-serif;
  --violet:#a78bfa; --violet-d:#6d28d9; --blue:#60a5fa; --blue-d:#1d4ed8;
}
html,body{width:100vw;height:100dvh;overflow:hidden;background:#000;color:#fff;font-family:var(--font);-webkit-font-smoothing:antialiased;}
body.is-standby{background:#030406;}

/* ═══ camada cósmica compartilhada (V4.0.0 + login) — mesmo preto/violeta da Orb ═══ */
#cosmos{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.4s ease;pointer-events:none;
  background:radial-gradient(circle at 50% 54%, rgba(109,40,217,.10) 0%, transparent 42%),#000;}
#cosmos.on{opacity:1;}

/* ═══ views ═══ */
.view{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.2s ease,visibility 0s linear 1.2s;}
.view.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 1.2s ease,visibility 0s;}

/* STANDBY */
#standby img{width:min(100vw,100dvh);height:min(100vw,100dvh);object-fit:contain;}

/* LOGIN */
.login-logo{width:clamp(64px,10vmin,92px);height:auto;filter:drop-shadow(0 0 22px rgba(96,80,255,.5));}
.login-word{margin-top:26px;width:min(330px,74vw);height:auto;filter:drop-shadow(0 0 16px rgba(120,100,255,.28));}
.login-sub{margin-top:14px;font-size:11px;font-weight:300;letter-spacing:.22em;color:rgba(255,255,255,.4);}
#loginForm{margin-top:42px;width:min(320px,82vw);display:flex;flex-direction:column;gap:14px;}
.field{width:100%;height:50px;border-radius:25px;padding:0 24px;font:300 13px var(--font);letter-spacing:.16em;color:#fff;
  background:rgba(8,8,18,.62);border:1px solid rgba(139,120,255,.30);outline:none;text-align:center;
  transition:border-color .3s ease,box-shadow .3s ease;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
.field::placeholder{color:rgba(255,255,255,.3);letter-spacing:.2em;}
.field:focus{border-color:rgba(167,139,250,.75);box-shadow:0 0 22px rgba(109,40,217,.28);}
.btn{margin-top:6px;height:50px;border-radius:25px;cursor:pointer;font:400 12px var(--font);letter-spacing:.34em;text-indent:.34em;color:#fff;
  background:linear-gradient(135deg,rgba(29,78,216,.22),rgba(109,40,217,.26));border:1px solid rgba(139,120,255,.6);
  box-shadow:0 0 26px rgba(109,40,217,.22);transition:box-shadow .3s ease,filter .3s ease;}
.btn:hover{box-shadow:0 0 40px rgba(109,40,217,.42);filter:brightness(1.15);}
.btn:focus-visible,.field:focus-visible{outline:1px solid var(--violet);outline-offset:3px;}
.err{height:16px;margin-top:2px;font-size:10px;font-weight:300;letter-spacing:.2em;text-align:center;color:#f87171;opacity:0;transition:opacity .4s ease;}
.err.show{opacity:.9;}
#loginForm.shake{animation:shake .42s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-7px);}55%{transform:translateX(6px);}80%{transform:translateX(-3px);}}

.version-tag{position:fixed;left:18px;bottom:16px;z-index:5;font-family:var(--font-mono);font-size:9px;font-weight:300;letter-spacing:.22em;color:rgba(255,255,255,.16);user-select:none;pointer-events:none;opacity:0;transition:opacity 1.2s ease;}
.version-tag.on{opacity:1;}

</style>
</head>
<body>

<div id="cosmos"></div>

<!-- STANDBY -->
<section class="view" id="standby" aria-label="Standby">
  <img src="assets/standby.png" alt="ORION AI — please stand by">
</section>

<!-- LOGIN -->
<section class="view" id="login" aria-label="Login">
  <img class="login-logo" src="assets/orion_ai_logo.png" alt="">
  <img class="login-word" src="assets/orion_ai_wordmark.png" alt="ORION AI">
  <p class="login-sub">Acesse sua conta</p>
  <form id="loginForm" autocomplete="off" novalidate>
    <input class="field" id="user" name="user" type="text" placeholder="usuário" autocomplete="username" autocapitalize="none" spellcheck="false" aria-label="Usuário">
    <input class="field" id="pass" name="pass" type="password" placeholder="senha" autocomplete="current-password" aria-label="Senha">
    <button class="btn" type="submit">Entrar</button>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
</section>


<script>
/* ═══════════════════════════════════════════════════════════════
   ORION AI — entrada (standby → login)
   Fluxo: STANDBY → LOGIN → pages/orion.html

   O estado é SEMPRE derivado da data/hora atual (relógio do
   sistema), nunca de variáveis temporárias do navegador. Recarregar,
   fechar e reabrir ou deixar a aba aberta dá sempre o mesmo resultado.
   Horários em UTC-3 (Brasília/Fortaleza), fixos no código.
   ═══════════════════════════════════════════════════════════════ */
const STANDBY_START = new Date('2026-10-02T08:00:00-03:00').getTime();
const STANDBY_END   = new Date('2026-10-03T08:00:00-03:00').getTime();

/* Teste local: abra index.html?simular=2026-10-03T07:59:30-03:00
   (só funciona em localhost / file://; o relógio simulado continua correndo). */
const DEV = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname) || location.protocol === 'file:';
const simParam = DEV ? new URLSearchParams(location.search).get('simular') : null;
const clockOffset = simParam && !isNaN(Date.parse(simParam)) ? Date.parse(simParam) - Date.now() : 0;
const nowMs = () => Date.now() + clockOffset;

function phase(t) {
  if (t < STANDBY_START) return 'before';   // antes do standby: login
  if (t < STANDBY_END)   return 'standby';
  return 'released';                         // V4.0.0 + login
}

const $ = id => document.getElementById(id);
const views = { standby: $('standby'), login: $('login') };
let current = null;
let flowStarted = false;
let flowTimer = null;

function show(name) {
  Object.entries(views).forEach(([k, el]) => el.classList.toggle('on', k === name));
  current = name;
}

/* ── abre direto no login ── */
function startV4Flow() {
  if (flowStarted) return;
  flowStarted = true;
  document.body.classList.remove('is-standby');
  $('cosmos').classList.add('on');
  show('login');
  flowTimer = setTimeout(() => $('user').focus(), 1300);
}

/* entra no standby (carregamento dentro da janela, ou janela começou com a página aberta) */
function enterStandby() {
  clearTimeout(flowTimer);
  flowStarted = false;
  $('cosmos').classList.remove('on');
  document.body.classList.add('is-standby');
  show('standby');
}

/* standby terminou com a página aberta: fade-out do standby e entrada do login */
function endStandby() {
  if (flowStarted) return;
  views.standby.classList.remove('on');           // fade-out (1.2s)
  setTimeout(startV4Flow, 1400);
}

/* ── verificação por relógio (não depende de um único setTimeout) ── */
function tick() {
  const p = phase(nowMs());
  if (p === 'released' && current === 'standby') endStandby();
  else if (p === 'standby' && current !== 'standby') enterStandby();
}
setInterval(tick, 500);
document.addEventListener('visibilitychange', tick);
addEventListener('focus', tick);
addEventListener('pageshow', tick);

/* ── boot ── */
(function boot() {
  const p = phase(nowMs());
  // standby só dentro da janela; fora dela (antes ou depois) abre direto no login
  if (p === 'standby') requestAnimationFrame(enterStandby);
  else requestAnimationFrame(startV4Flow);
})();

/* ═══════════════════════════════════════════════════════════════
   LOGIN — PROTÓTIPO DA V4.0
   ATENÇÃO: estas credenciais ficam visíveis no código do navegador
   e NÃO são segurança real. Futuramente serão substituídas por
   autenticação real no backend (Python). Sem banco de dados nesta etapa.
   ═══════════════════════════════════════════════════════════════ */
const PROTO_USER = 'ORION AI'; // comparado sem diferenciar maiúsculas/minúsculas
const PROTO_PASS = '230526'; // 23/05/2026 — início do projeto

$('loginForm').addEventListener('submit', e => {
  e.preventDefault();
  const u = $('user').value.trim(), p = $('pass').value;
  const err = $('err'), form = $('loginForm');
  if (u.replace(/\s+/g, ' ').toUpperCase() === PROTO_USER && p === PROTO_PASS) {
    err.classList.remove('show');
    // marca a sessão como autenticada (protótipo) e entra na IA
    try { sessionStorage.setItem('orion_auth', '1'); } catch (_) {}
    document.body.style.transition = 'opacity .9s ease';
    document.body.style.opacity = '0';
    setTimeout(() => { location.href = 'pages/orion.html'; }, 900);
  } else {
    err.textContent = 'Usuário ou senha incorretos.';
    err.classList.add('show');
    form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    $('pass').value = ''; $('pass').focus();
  }
});
$('user').addEventListener('input', () => $('err').classList.remove('show'));
$('pass').addEventListener('input', () => $('err').classList.remove('show'));
</script>
</body>
</html>
