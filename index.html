<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--font:'Inter',-apple-system,sans-serif;--mono:'Space Grotesk','Inter',sans-serif;--core-a:#6d28d9;--core-b:#4c1d95;--core-c:#a78bfa}
html,body{width:100vw;height:100dvh;overflow:hidden;background:#000;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased}
#boot{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease}
#boot.out{opacity:0;pointer-events:none}
.boot-mark{font-family:var(--mono);font-size:11px;font-weight:300;letter-spacing:.62em;text-indent:.62em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:56px}
.boot-rings{position:relative;width:76px;height:76px;margin-bottom:46px}
.boot-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(167,139,250,.18);border-top-color:rgba(167,139,250,.75);animation:spin 1.1s linear infinite}
.boot-ring:nth-child(2){inset:14px;border-top-color:rgba(196,181,253,.45);animation-duration:1.6s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-status{font-size:9px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.3);transition:opacity .35s}
#app{position:fixed;inset:0;z-index:2;opacity:0;transition:opacity 1.1s ease}
#app.on{opacity:1}
.header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;padding-top:clamp(24px,5vh,48px);pointer-events:none;z-index:3}
.dot{width:3px;height:3px;border-radius:50%;background:var(--core-c);box-shadow:0 0 8px var(--core-c)}
.word{font-size:11px;font-weight:200;letter-spacing:.74em;text-indent:.74em;text-transform:uppercase;color:rgba(255,255,255,.82)}
#zone{position:absolute;inset:0;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%}
.status{position:absolute;left:0;right:0;bottom:clamp(120px,20vh,180px);display:flex;justify-content:center;pointer-events:none;z-index:3}
.status-text{font-size:10px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.6);opacity:0;transform:translateY(4px);transition:opacity .6s,transform .6s;white-space:nowrap}
.status-text.show{opacity:1;transform:none}
.hint{position:absolute;left:0;right:0;bottom:clamp(96px,16vh,140px);display:flex;justify-content:center;pointer-events:none;z-index:3}
.hint-text{font-size:9px;font-weight:200;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.2);transition:opacity 1s}
.dock{position:absolute;left:0;right:0;bottom:clamp(24px,5vh,44px);display:flex;justify-content:center;align-items:center;gap:22px;z-index:4}
.dock button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);background:none;border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:7px 14px;cursor:pointer;transition:all .25s}
.dock button:hover,.dock button:focus-visible{color:#fff;border-color:var(--core-c);outline:none}
.dock .mic{width:52px;height:52px;padding:0;border-radius:50%;border-color:var(--core-c);color:var(--core-c);display:grid;place-items:center;box-shadow:0 0 22px color-mix(in srgb,var(--core-a) 45%,transparent)}
.mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5}
.ver{position:fixed;left:18px;bottom:16px;z-index:40;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.2);pointer-events:none}
#settings{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
#settings.open{opacity:1;pointer-events:auto}
.card{width:min(300px,86vw);padding:26px;border:1px solid rgba(167,139,250,.22);border-radius:14px;background:rgba(8,8,14,.94)}
.card h2{font-size:10px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:18px;text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:300;color:rgba(255,255,255,.78);padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.tg{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a78bfa;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);border-radius:20px;padding:5px 12px;cursor:pointer}
.card p{margin-top:16px;text-align:center;font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.28)}
.hc .status-text,.hc .hint-text,.hc .ver{color:#fff}.hc .dock button{color:#fff;border-color:#fff}
@media (prefers-reduced-motion:reduce){.boot-ring{animation:none}}
</style>
</head>
<body>
<script src="/orion-config.js"></script>
<div id="boot"><p class="boot-mark">ORION AI</p><div class="boot-rings"><div class="boot-ring"></div><div class="boot-ring"></div></div><p class="boot-status" id="bootStatus">initializing</p></div>
<div id="app">
  <div class="header"><i class="dot"></i><span class="word">ORION AI</span><i class="dot"></i></div>
  <div id="zone"><canvas id="cv"></canvas></div>
  <div class="status" aria-live="polite"><span class="status-text" id="statusText"></span></div>
  <div class="hint"><span class="hint-text" id="hintText"></span></div>
  <div class="dock">
    <button id="btnLang" aria-label="Language"></button>
    <button class="mic" id="btnMic" aria-label="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button id="btnSet" aria-label="Settings">···</button>
  </div>
</div>
<div class="ver" id="ver"></div>

<script>
const ORION_VERSION = '10.0 BETA';
const BOOT_LINES = ['initializing', 'connecting to core', 'systems online']; // fixed in English

/* ── config: public only, never keys ── */
const CONFIG = Object.assign({ endpoint: '', defaultProvider: 'local', routes: {}, models: {}, timeoutMs: 15000 }, window.ORION_CONFIG || {});

/* ── logger: no raw text or secrets outside dev ── */
const LOGGER = (() => {
  const DEV = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname) || location.protocol === 'file:';
  const SENS = /(key|token|secret|authorization|text|content)/i; let seq = 0;
  const clean = d => Object.fromEntries(Object.entries(d).filter(([k]) => DEV || !SENS.test(k)));
  const log = (l, ev, d = {}) => (l === 'error' ? console.error : l === 'warn' ? console.warn : console.log)('[ORION]', { t: new Date().toISOString(), l, ev, ...clean(d) });
  return { newId: () => 'req_' + (++seq), info: (e, d) => log('info', e, d), warn: (e, d) => log('warn', e, d), error: (e, d) => log('error', e, d) };
})();

/* ── i18n: new language = new pack ── */
const I18N = (() => {
  const PACKS = {
    'pt-BR': { label: 'PT', speech: 'pt-BR',
      system: 'Você é o ORION V10, assistente de voz criado por Jander. Suas respostas serão FALADAS: frases curtas e naturais, sem markdown, listas, emojis ou símbolos. Tom elegante, calmo e sutilmente espirituoso. Responda primeiro, detalhe só se pedirem. Se não souber ou não puder, diga em uma frase. Responda sempre em português do Brasil.',
      ui: { online: 'ORION ONLINE', hint: 'toque para falar', standby: 'ORION online.', listening: 'Ouvindo…', thinking: 'Pensando…', responding: 'Respondendo…',
        settings: 'Configurações', voice: 'Voz', sound: 'Sons', hands: 'Mãos-livres', reduce: 'Reduzir animações', contrast: 'Alto contraste', captions: 'Legendas',
        on: 'Ligado', off: 'Desligado', close: 'Ctrl + , para fechar', version: 'VERSÃO V' },
      err: { mic_unavailable: 'Microfone indisponível.', stt_unavailable: 'Reconhecimento de voz indisponível neste navegador.', model_unavailable: 'Não consegui acessar o modelo.', timeout: 'A resposta demorou demais.', api_error: 'Falha ao comunicar com o serviço.', invalid_response: 'Recebi uma resposta inválida.', tool_unavailable: 'Essa ferramenta ainda não está disponível.', offline: 'Sem conexão com a internet.', unexpected_input: 'Não entendi o que foi dito.', voice_disabled: 'Voz desativada nas configurações.', unknown: 'Não consegui processar.' },
      tools: { time: n => `São ${n.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}.`, date: n => `Hoje é ${n.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}.`, calc: v => `Resultado: ${v}.`, timerSet: (n, u) => `Timer de ${n} ${u}${n > 1 ? 's' : ''} ativado.`, timerDone: (n, u) => `Seu timer de ${n} ${u}${n > 1 ? 's' : ''} terminou.` },
      route: { timer: /(?:timer|temporizador|cron[ôo]metro)\D*?(\d+)\s*(segundo|minuto|hora)/i, time: /que horas|que hora/i, date: /que dia|data de hoje/i, code: /\b(código|programar|função|script|bug)\b/i, creative: /\b(poema|história|crie|escreva)\b/i },
      patterns: [
        { re: /\b(olá|oi|bom dia|boa tarde|boa noite|hello)\b/i, r: ['Sistemas operacionais. Como posso auxiliá-lo?', 'Pronto. O que precisa?', 'Online e a postos.'] },
        { re: /quem\s+(é\s+)?(você|vc)/i, r: ['Sou o ORION, uma presença digital criada por Jander para observar, responder e auxiliar.'] },
        { re: /\b(obrigad[ao]|valeu)\b/i, r: ['Para isso estou aqui.', 'Sempre às ordens.'] },
        { re: /\b(tchau|até logo|adeus)\b/i, r: ['Retornando ao repouso. Até logo.'] },
        { re: /(versão|build)/i, r: ['ORION AI, versão ' + ORION_VERSION + '.'] },
        { re: /como (você\s+)?(está|vai)/i, r: ['Todos os sistemas estáveis.', 'Funcionando normalmente, obrigado por perguntar.'] } ],
      fallback: ['Ainda estou em fase Beta e não tenho uma resposta elaborada para isso.', 'Essa função ainda não está disponível nesta versão.', 'Registrei sua solicitação, mas ainda não sei responder a isso.'] },
    en: { label: 'EN', speech: 'en-US',
      system: 'You are ORION V10, a voice assistant built by Jander. Your replies will be SPOKEN: short, natural sentences with no markdown, lists, emojis or symbols. Tone: elegant, calm, subtly witty. Answer first, elaborate only if asked. If you cannot do something, say so in one sentence. Always reply in English.',
      ui: { online: 'ORION ONLINE', hint: 'tap to speak', standby: 'ORION online.', listening: 'Listening…', thinking: 'Thinking…', responding: 'Responding…',
        settings: 'Settings', voice: 'Voice', sound: 'Sounds', hands: 'Hands-free', reduce: 'Reduce motion', contrast: 'High contrast', captions: 'Captions',
        on: 'On', off: 'Off', close: 'Ctrl + , to close', version: 'VERSION V' },
      err: { mic_unavailable: 'Microphone unavailable.', stt_unavailable: 'Speech recognition is unavailable in this browser.', model_unavailable: "I couldn't reach the model.", timeout: 'The response took too long.', api_error: 'Failed to reach the service.', invalid_response: 'I received an invalid response.', tool_unavailable: "That tool isn't available yet.", offline: 'No internet connection.', unexpected_input: "I didn't understand that.", voice_disabled: 'Voice is disabled in settings.', unknown: "I couldn't process that." },
      tools: { time: n => `It is ${n.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}.`, date: n => `Today is ${n.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' })}.`, calc: v => `Result: ${v}.`, timerSet: (n, u) => `Timer set for ${n} ${u}${n > 1 ? 's' : ''}.`, timerDone: (n, u) => `Your ${n} ${u}${n > 1 ? 's' : ''} timer is done.` },
      route: { timer: /timer\D*?(\d+)\s*(second|minute|hour)/i, time: /what time/i, date: /what day|today'?s date|date today/i, code: /\b(code|program|function|script|bug)\b/i, creative: /\b(poem|story|write|create)\b/i },
      patterns: [
        { re: /\b(hello|hi|hey|good (morning|afternoon|evening))\b/i, r: ['Systems operational. How can I assist?', 'Ready. What do you need?', 'Online and standing by.'] },
        { re: /who\s+are\s+you/i, r: ['I am ORION, a digital presence built by Jander to observe, answer and assist.'] },
        { re: /\b(thanks|thank you)\b/i, r: ["That's what I'm here for.", 'Always at your service.'] },
        { re: /\b(bye|goodbye|see you)\b/i, r: ['Returning to rest. See you soon.'] },
        { re: /\b(version|build)\b/i, r: ['ORION AI, version ' + ORION_VERSION + '.'] },
        { re: /how are you/i, r: ['All systems stable.', 'Running normally, thanks for asking.'] } ],
      fallback: ["I'm still in Beta and don't have an elaborate answer for that.", "That feature isn't available in this version yet.", "I logged your request, but I don't know how to answer that yet."] },
  };
  let lang = (navigator.language || 'pt-BR').toLowerCase().startsWith('en') ? 'en' : 'pt-BR';
  try { const s = localStorage.getItem('orion.lang'); if (s && PACKS[s]) lang = s; } catch (e) {}
  const pack = () => PACKS[lang];
  return { packs: PACKS, list: () => Object.keys(PACKS), pack, get: () => lang,
    set(l) { if (!PACKS[l]) return; lang = l; document.documentElement.lang = l.toLowerCase(); try { localStorage.setItem('orion.lang', l); } catch (e) {} },
    t: k => pack().ui[k] ?? k, err: c => pack().err[c] || pack().err.unknown };
})();

/* ── visual state palette ── */
const VISUAL_STATE = (() => {
  const CFG = {
    standby:   { bright: 1,    color: { a: '#6d28d9', b: '#4c1d95', c: '#a78bfa' } },
    listening: { bright: 1.18, color: { a: '#1d4ed8', b: '#1e3a8a', c: '#60a5fa' } },
    thinking:  { bright: 1.05, color: { a: '#6d28d9', b: '#4c1d95', c: '#a78bfa' } },
    speaking:  { bright: 1.3,  color: { a: '#15803d', b: '#14532d', c: '#4ade80' } },
    error:     { bright: .62,  color: { a: '#b91c1c', b: '#7f1d1d', c: '#f87171' } },
  };
  return { config: n => CFG[n] || CFG.standby };
})();

/* ── permissions + tools (registry) ── */
const PERMISSIONS = (() => { const LEVEL = Object.freeze({ READ_ONLY: 'READ_ONLY', WRITE: 'WRITE', EXECUTE: 'EXECUTE', EXTERNAL_ACTION: 'EXTERNAL_ACTION' }); return { LEVEL, needsConfirmation: l => l !== LEVEL.READ_ONLY }; })();
const mkErr = (code, msg) => Object.assign(new Error(msg || code), { code });

function safeArithmetic(expr) {
  const clean = String(expr).trim();
  if (!/^[0-9+\-*/().,\s]+$/.test(clean)) throw mkErr('unexpected_input');
  const tokens = clean.replace(/,/g, '.').match(/(\d+\.?\d*|\.\d+|[+\-*/()])/g) || [];
  const out = [], ops = [], prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  tokens.forEach(tk => {
    if (/^[\d.]+$/.test(tk)) out.push(parseFloat(tk));
    else if (tk === '(') ops.push(tk);
    else if (tk === ')') { while (ops.length && ops[ops.length - 1] !== '(') out.push(ops.pop()); ops.pop(); }
    else { while (ops.length && prec[ops[ops.length - 1]] >= prec[tk]) out.push(ops.pop()); ops.push(tk); }
  });
  while (ops.length) out.push(ops.pop());
  const st = [];
  out.forEach(tk => { if (typeof tk === 'number') return st.push(tk); const b = st.pop(), a = st.pop(); st.push(tk === '+' ? a + b : tk === '-' ? a - b : tk === '*' ? a * b : a / b); });
  const r = st.pop();
  if (typeof r !== 'number' || !Number.isFinite(r)) throw mkErr('invalid_response');
  return r;
}

const TOOLS = (() => {
  const reg = {};
  const api = {
    register(name, def) { reg[name] = { permission: PERMISSIONS.LEVEL.READ_ONLY, description: '', ...def }; LOGGER.info('tool_registered', { name }); },
    has: n => Object.prototype.hasOwnProperty.call(reg, n),
    list: () => Object.entries(reg).map(([name, t]) => ({ name, permission: t.permission, description: t.description })),
    async run(name, args) {
      if (!api.has(name)) throw mkErr('tool_unavailable');
      if (PERMISSIONS.needsConfirmation(reg[name].permission)) throw mkErr('tool_unavailable', 'confirmation layer not implemented');
      return reg[name].run(args);
    },
  };
  return api;
})();
TOOLS.register('calculator', { description: 'Arithmetic.', run: ({ expression }) => I18N.pack().tools.calc(safeArithmetic(expression)) });
TOOLS.register('datetime', { description: 'Time or date.', run: ({ kind }) => I18N.pack().tools[kind](new Date()) });
TOOLS.register('timer', { description: 'Voice timer.', run: ({ n, unit }) => {
  const u = String(unit).toLowerCase()[0], ms = n * 1000 * (u === 'h' ? 3600 : u === 'm' ? 60 : 1);
  if (!(ms > 0 && ms <= 86400000)) throw mkErr('unexpected_input');
  setTimeout(() => window.dispatchEvent(new CustomEvent('orion-announce', { detail: I18N.pack().tools.timerDone(n, unit) })), ms);
  return I18N.pack().tools.timerSet(n, unit);
} });

/* ── providers: CORE only knows ModelProvider ── */
class ModelProvider { constructor(name) { this.name = name; } get available() { return true; } async generate() { throw mkErr('model_unavailable', 'generate() not implemented'); } }
class LocalProvider extends ModelProvider {
  constructor() { super('local'); }
  async generate({ text }) { const p = I18N.pack(), rand = a => a[Math.floor(Math.random() * a.length)], hit = p.patterns.find(x => x.re.test(text)); return rand(hit ? hit.r : p.fallback); }
}
class ProxyProvider extends ModelProvider { // keys live on the backend (env vars), never here
  get available() { return !!CONFIG.endpoint; }
  async generate({ system, messages, signal }) {
    let res;
    try { res = await fetch(CONFIG.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, signal, body: JSON.stringify({ provider: this.name, model: CONFIG.models[this.name], system, messages }) }); }
    catch (e) { throw e.name === 'AbortError' ? mkErr('timeout') : mkErr('api_error', e.message); }
    if (!res.ok) throw mkErr('api_error', 'HTTP ' + res.status);
    const data = await res.json().catch(() => null);
    return data && data.text;
  }
}
class OpenAIProvider extends ProxyProvider { constructor() { super('openai'); } }
class GeminiProvider extends ProxyProvider { constructor() { super('gemini'); } }
class ClaudeProvider extends ProxyProvider { constructor() { super('claude'); } }
const PROVIDERS = (() => {
  const map = {};
  const api = { register(p) { if (!(p instanceof ModelProvider)) throw new Error('Invalid provider'); map[p.name] = p; }, get: n => map[n],
    pick(task) { const want = CONFIG.routes[task] || CONFIG.defaultProvider; if (map[want] && map[want].available) return map[want]; return Object.values(map).find(p => p.name !== 'local' && p.available) || map.local; } };
  [new LocalProvider(), new OpenAIProvider(), new GeminiProvider(), new ClaudeProvider()].forEach(api.register);
  return api;
})();

/* ── context: structured session, no persistence ── */
class Session {
  constructor(max = 12) { this.max = max; this.items = []; }
  add(role, content, meta) { this.items.push({ role, content, ...meta }); if (this.items.length > this.max) this.items.shift(); }
  messages() { return this.items.map(i => ({ role: i.role === 'user' ? 'user' : 'assistant', content: i.role === 'tool' ? `[${i.tool}] ${i.content}` : i.content })); }
  system() { return I18N.pack().system; }
  reset() { this.items = []; }
}

/* ── router: tool OR provider by task ── */
const ROUTER = (() => {
  const MATH = /^\s*[0-9][0-9+\-*/().,\s]*[0-9)]\s*$/;
  return { route(text) {
    const t = text.trim(), r = I18N.pack().route;
    if (MATH.test(t) && /[+\-*/]/.test(t)) return { kind: 'tool', tool: 'calculator', args: { expression: t } };
    if (r.time.test(t)) return { kind: 'tool', tool: 'datetime', args: { kind: 'time' } };
    if (r.date.test(t)) return { kind: 'tool', tool: 'datetime', args: { kind: 'date' } };
    const tm = t.match(r.timer); if (tm) return { kind: 'tool', tool: 'timer', args: { n: +tm[1], unit: tm[2] } };
    const type = r.code.test(t) ? 'code' : r.creative.test(t) ? 'creative' : 'chat';
    return { kind: 'model', type, provider: PROVIDERS.pick(type) };
  } };
})();

/* ── voice: native STT/TTS behind a small interface ── */
const VOICE = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, synth = window.speechSynthesis;
  let rec = null, active = false;
  const MALE = ['antonio', 'antônio', 'daniel', 'fabio', 'felipe', 'ricardo', 'thiago', 'tiago', 'guy', 'david', 'mark', 'alex', 'male'];
  const FEMALE = ['female', 'feminin', 'francisca', 'luciana', 'maria', 'fernanda', 'joana', 'zira', 'samantha'];
  function pick(lang) {
    const vs = synth ? synth.getVoices() : [], pre = lang.slice(0, 2).toLowerCase(); let best = null, bs = -Infinity;
    vs.forEach(v => { const n = v.name.toLowerCase(), l = (v.lang || '').toLowerCase(); let s = 0;
      if (l === lang.toLowerCase()) s += 50; else if (l.startsWith(pre)) s += 30; else return;
      if (FEMALE.some(h => n.includes(h))) s -= 500; if (MALE.some(h => n.includes(h))) s += 100;
      if (['neural', 'natural', 'online'].some(h => n.includes(h))) s += 20; if (v.localService) s += 8;
      if (s > bs) { bs = s; best = v; } });
    return best;
  }
  return {
    available: !!SR,
    listen(lang, cb) {
      rec = new SR(); rec.lang = lang; rec.interimResults = false; rec.continuous = false;
      rec.onstart = () => { active = true; cb.onStart(); };
      rec.onerror = e => { active = false; cb.onError(e.error); };
      rec.onend = () => { if (active) { active = false; cb.onEnd(); } };
      rec.onresult = e => { let f = ''; for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) f += e.results[i][0].transcript; if (f.trim()) { active = false; cb.onResult(f.trim()); } };
      try { rec.start(); return true; } catch (e) { return false; }
    },
    stopListening() { if (rec && active) { active = false; rec.stop(); } },
    speak(text, lang, onEnd) {
      if (!synth) return onEnd(); synth.cancel();

/* ── CORE: single source of truth for states ── */
const CORE = (() => {
  const session = new Session(), subs = [];
  let cur = 'standby', gen = 0, voiceOn = true, hands = false;
  const on = fn => subs.push(fn);
  function setState(name, msg) { cur = name; gen++; subs.forEach(fn => { try { fn(name, msg); } catch (e) { LOGGER.error('subscriber_failed', { message: e.message }); } }); return gen; }
  function fail(err, stage) { // only path to ERROR; always recovers to STANDBY
    const code = err && err.code && I18N.pack().err[err.code] ? err.code : (!navigator.onLine ? 'offline' : 'unknown');
    LOGGER.error('error_handled', { stage, code, message: err && err.message });
    const my = setState('error', I18N.err(code));
    setTimeout(() => { if (gen === my && cur === 'error') setState('standby', ''); }, 2600);
  }
  const timeout = (p, ms, ctl) => new Promise((res, rej) => { const t = setTimeout(() => { ctl.abort(); rej(mkErr('timeout')); }, ms); p.then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); }); });
  async function think(text) {
    const id = LOGGER.newId(), t0 = performance.now(), r = ROUTER.route(text);
    LOGGER.info('request_started', { id, kind: r.kind, provider: r.provider && r.provider.name, tool: r.tool });
    session.add('user', text); let reply;
    if (r.kind === 'tool') { reply = String(await TOOLS.run(r.tool, r.args)); session.add('tool', reply, { tool: r.tool }); }
    else {
      if (r.provider.name !== 'local' && !navigator.onLine) throw mkErr('offline');
      const ctl = new AbortController();
      reply = await timeout(r.provider.generate({ text, system: session.system(), messages: session.messages(), signal: ctl.signal }), CONFIG.timeoutMs, ctl);
      session.add('assistant', reply);
    }
    if (typeof reply !== 'string' || !reply.trim()) throw mkErr('invalid_response');
    LOGGER.info('request_completed', { id, latencyMs: Math.round(performance.now() - t0) });
    return reply.trim();
  }
  async function submit(text) {
    if (!text || !text.trim()) return setState('standby');
    setState('thinking', I18N.t('thinking')); let reply;
    try { reply = await think(text); } catch (e) { return fail(e, 'pipeline'); }
    setState('speaking', voiceOn || reply.length > 46 ? I18N.t('responding') : reply);
    const done = () => { if (cur === 'speaking') { setState('standby', ''); if (hands) setTimeout(() => cur === 'standby' && toggle(), 500); } };
    if (!voiceOn) return setTimeout(done, 2400);
    VOICE.speak(reply, I18N.pack().speech, done);
  }
  function toggle() {
    if (cur === 'speaking') { VOICE.stopSpeaking(); return setState('standby', ''); }
    if (cur === 'listening') { VOICE.stopListening(); return setState('standby', ''); }
    if (cur !== 'standby') return;
    if (!voiceOn) return fail(mkErr('voice_disabled'), 'toggle');
    if (!VOICE.available) return fail(mkErr('stt_unavailable'), 'toggle');
    const ok = VOICE.listen(I18N.pack().speech, {
      onStart: () => setState('listening', I18N.t('listening')), onResult: submit,
      onError: c => c === 'no-speech' ? setState('standby', '') : fail(mkErr(c === 'not-allowed' ? 'mic_unavailable' : 'stt_unavailable', c), 'stt'),
      onEnd: () => setState('standby', ''),
    });
    if (!ok) fail(mkErr('mic_unavailable'), 'toggle');
  }
  function announce(text) {
    if (cur !== 'standby') return setTimeout(() => announce(text), 3000);
    setState('speaking', I18N.t('responding'));
    const end = () => cur === 'speaking' && setState('standby', '');
    voiceOn ? VOICE.speak(text, I18N.pack().speech, end) : setTimeout(end, 2400);
  }
  return { announce, on, submit, toggle, session, state: () => cur, setHands: v => { hands = v; }, setVoice: v => { voiceOn = v; }, onLangChange: () => session.reset() };
})();

/* ═══ UNIVERSE — V10 Beta: a living 3D universe with a large holographic HUD ═══

   Around it: concentric rings, tick scale and arcs that react to each state.

    thinking:  { speed: 1.3, spin: .85, radius: .95, turb: .04, wave: 0,  dir: 1,  sag: 0,  size: .95,  gain: 1.1,  voice: 0, gal: 1, link: 1,  zoom: 1.12, ring: 2.2, arc: 3.8, pulse: 0 },
    speaking:  { speed: 1,   spin: .2,  radius: .9,  turb: .08, wave: 1,  dir: 1,  sag: 0,  size: 1.2,  gain: 1.25, voice: 1, gal: 0, link: .55,zoom: 1.03, ring: 1.3, arc: 2.6, pulse: 1 },
    error:     { speed: 1.6, spin: -.3, radius: 1.05, turb: .5, wave: 0,  dir: 1,  sag: .5, size: .9,   gain: .55,  voice: 0, gal: 0, link: 0,  zoom: .95, ring: .2, arc: .4, pulse: 0 },

/* ── settings (Ctrl + ,) ── */

  let panel = null, open = false;

  function refresh() {

    panel.querySelector('h2').textContent = t('settings'); panel.querySelector('p').textContent = t('close');
    Object.keys(OPT).forEach(k => { panel.querySelector('#l_' + k).textContent = t(k); panel.querySelector('#t_' + k).textContent = OPT[k] ? t('on') : t('off'); });
  }

    panel.innerHTML = '<div class="card"><h2></h2>' + Object.keys(OPT).map(k => `<div class="row"><span id="l_${k}"></span><button class="tg" id="t_${k}"></button></div>`).join('') + '<p></p></div>';
    document.body.appendChild(panel);

/* ── app: UI shell, subscribes to CORE, no business logic ── */

    requestAnimationFrame(() => statusText.classList.add('show')); statusTimer = setTimeout(() => statusText.classList.remove('show'), ms);
  }
  CORE.on((state, msg) => {
    try { ORB.setState(state); } catch (e) { console.error('[ORION] ORB.setState', e); }
    const m = msg !== undefined ? msg : ({ standby: I18N.t('standby'), listening: I18N.t('listening'), thinking: I18N.t('thinking') })[state];
    if (m) flash(m, state === 'error' ? 2400 : 2400);
    if (soundOn) { try { ({ listening: SOUND.listen, speaking: SOUND.answer, error: SOUND.error })[state]?.(); } catch (e) {} }
  });
  function activate() {
    if (hintShown) { hintShown = false; hintText.style.opacity = '0'; }
    if (CORE.state() === 'standby') { ORB.pressEffect(); if (soundOn) try { SOUND.activate(); } catch (e) {} }
    CORE.toggle();
  }
  const zone = $('zone');
  zone.addEventListener('click', activate);
  zone.addEventListener('touchstart', e => { e.preventDefault(); activate(); }, { passive: false });
  zone.addEventListener('mouseenter', () => ORB.setHover(true)); zone.addEventListener('mouseleave', () => ORB.setHover(false));
  $('btnMic').onclick = activate; $('btnSet').onclick = () => SETTINGS.toggle();
  $('btnLang').onclick = () => { const l = I18N.list(); dispatchEvent(new CustomEvent('orion-setting', { detail: { key: 'lang', value: l[(l.indexOf(I18N.get()) + 1) % l.length] } })); };
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.target.matches('input,textarea,button')) { e.preventDefault(); activate(); }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 't') TESTS.run();
  });
  addEventListener('orion-setting', e => {
    const { key, value } = e.detail;
    if (key === 'voice') CORE.setVoice(value); if (key === 'sound') soundOn = value; if (key === 'hands') CORE.setHands(value);
    if (key === 'captions') captions = value; if (key === 'reduce') ORB.setReduce(value);
    if (key === 'contrast') document.body.classList.toggle('hc', value);
    if (key === 'lang') { I18N.set(value); CORE.onLangChange(); applyI18n(); flash(I18N.pack().label, 1800); }
  });
  addEventListener('orion-announce', e => CORE.announce(e.detail));
  LOGGER.info('session_started', { version: ORION_VERSION, stt: VOICE.available, lang: I18N.get(), remote: !!CONFIG.endpoint });
  try { ORB.init(); } catch (e) { console.error('[ORION] ORB.init', e); }
  try { SETTINGS.init(); } catch (e) { console.error('[ORION] SETTINGS.init', e); }
  if (/[?&]test=1/.test(location.search)) TESTS.run();
})();
</script>
