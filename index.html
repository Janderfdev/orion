<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --font:'Inter',-apple-system,'Helvetica Neue',sans-serif;
  --font-mono:'Space Grotesk','Inter',sans-serif;
  --orb:clamp(190px,32vmin,320px); --halo:calc(var(--orb)*1.9);
  --core-a:#6d28d9; --core-b:#4c1d95; --core-c:#a78bfa;
}
html,body{width:100vw;height:100dvh;overflow:hidden;background:#000;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased;}
.void{position:fixed;inset:0;background:#000;z-index:0;}
.orb-bleed{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 54%,color-mix(in srgb,var(--core-a) 10%,transparent) 0%,transparent 42%);}
/* BOOT */
#boot{position:fixed;inset:0;z-index:200;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s ease;}
#boot.out{opacity:0;pointer-events:none;}
.boot-mark{font-family:var(--font-mono);font-size:11px;font-weight:300;letter-spacing:.62em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:56px;text-indent:.62em;}
.boot-ring-wrap{position:relative;width:76px;height:76px;margin-bottom:46px;}
.boot-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(167,139,250,.18);border-top-color:rgba(167,139,250,.75);animation:bootspin 1.1s linear infinite;}
.boot-ring:nth-child(2){inset:14px;border-top-color:rgba(196,181,253,.45);animation-duration:1.6s;animation-direction:reverse;}
@keyframes bootspin{to{transform:rotate(360deg);}}
.boot-status{font-size:9px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.24);transition:opacity .35s ease;}
/* APP */
#app{position:fixed;inset:0;z-index:2;opacity:0;transition:opacity 1.1s ease;}
#app.on{opacity:1;}
.header{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:14px;padding-top:clamp(28px,6vh,56px);pointer-events:none;user-select:none;}
.header-dot{width:3px;height:3px;border-radius:50%;background:var(--core-c);box-shadow:0 0 8px var(--core-c);animation:dotbreathe 4s ease-in-out infinite;}
@keyframes dotbreathe{0%,100%{opacity:.35;}50%{opacity:1;}}
.header-word{font-size:11px;font-weight:200;letter-spacing:.74em;text-indent:.74em;text-transform:uppercase;color:rgba(255,255,255,.82);text-shadow:0 0 18px rgba(255,255,255,.1);}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.orb-zone{position:relative;width:var(--halo);height:var(--halo);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.halo{position:absolute;width:100%;height:100%;border-radius:50%;
  background:conic-gradient(from 0deg,transparent 0%,color-mix(in srgb,var(--core-a) 55%,transparent) 24%,color-mix(in srgb,var(--core-b) 40%,transparent) 50%,color-mix(in srgb,var(--core-a) 45%,transparent) 74%,transparent 92%);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 1px),#fff calc(100% - 1px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 1px),#fff calc(100% - 1px));
  animation:halospin 24s linear infinite;transition:opacity .8s ease,filter .6s ease;opacity:.55;}
.halo.fast{animation-duration:11s;opacity:.85;}
.orb-zone:hover .halo{animation-duration:16s;opacity:.72;filter:brightness(1.18);}
@keyframes halospin{to{transform:rotate(360deg);}}
.wave-ring{position:absolute;left:50%;top:50%;border-radius:50%;width:var(--orb);height:var(--orb);transform:translate(-50%,-50%);border:1px solid color-mix(in srgb,var(--core-c) 70%,transparent);opacity:0;pointer-events:none;}
.orb-zone.speaking .wave-ring{animation:wave-out 2.6s cubic-bezier(.2,.6,.3,1) infinite;}
.orb-zone.speaking .wave-ring:nth-child(2){animation-delay:.87s;}
.orb-zone.speaking .wave-ring:nth-child(3){animation-delay:1.74s;}
@keyframes wave-out{0%{transform:translate(-50%,-50%) scale(1);opacity:.55;}100%{transform:translate(-50%,-50%) scale(1.55);opacity:0;}}
.orb{position:relative;width:var(--orb);height:var(--orb);border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 34% 30%,color-mix(in srgb,var(--core-c) 16%,transparent) 0%,color-mix(in srgb,var(--core-a) 8%,transparent) 32%,rgba(2,2,8,.85) 68%,rgba(0,0,0,.94) 100%);
  border:1px solid color-mix(in srgb,var(--core-a) 30%,transparent);
  box-shadow:0 0 60px color-mix(in srgb,var(--core-a) 42%,transparent),0 0 130px color-mix(in srgb,var(--core-b) 30%,transparent),inset 0 0 70px rgba(0,0,0,.75),inset 0 0 22px color-mix(in srgb,var(--core-a) 18%,transparent),inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  animation:orbfloat 9s ease-in-out infinite,orbbreathe 4.6s ease-in-out infinite;
  transition:box-shadow 1.1s ease,filter .8s ease,transform .5s cubic-bezier(.2,.7,.3,1);will-change:transform;z-index:1;}
.orb-zone:hover .orb{filter:brightness(1.14);box-shadow:0 0 78px color-mix(in srgb,var(--core-a) 55%,transparent),0 0 150px color-mix(in srgb,var(--core-b) 38%,transparent),inset 0 0 70px rgba(0,0,0,.75),inset 0 0 26px color-mix(in srgb,var(--core-a) 24%,transparent),inset 0 1px 0 rgba(255,255,255,.14);}
.orb.pressed{transform:scale(1.08) !important;transition:transform .15s ease;}
@keyframes orbfloat{0%,100%{margin-top:0;}50%{margin-top:-14px;}}
@keyframes orbbreathe{0%,100%{transform:scale(1);}50%{transform:scale(1.035);}}
.orb.st-listening{filter:brightness(1.22);animation:orbfloat 9s ease-in-out infinite,orbbreathe 2.6s ease-in-out infinite;}
.orb.st-thinking{filter:brightness(1.1);animation:orbfloat 9s ease-in-out infinite,orbbreathe 1.3s ease-in-out infinite;}
.orb.st-speaking{filter:brightness(1.3);animation:orbfloat 9s ease-in-out infinite,orbbreathe 1.8s ease-in-out infinite;}
.orb.st-error{filter:brightness(.62);animation:orberr .5s ease;}
@keyframes orberr{0%{transform:translateX(0);}25%{transform:translateX(-7px);}55%{transform:translateX(6px);}80%{transform:translateX(-3px);}100%{transform:translateX(0);}}
.orb-canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;mix-blend-mode:screen;}
.glass-hi{position:absolute;top:6%;left:9%;width:44%;height:38%;border-radius:50%;background:radial-gradient(ellipse at 38% 32%,rgba(255,255,255,.24) 0%,rgba(255,255,255,.05) 46%,transparent 74%);transform:rotate(-22deg);pointer-events:none;z-index:2;}
.glass-rim{position:absolute;bottom:6%;right:8%;width:24%;height:12%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.08) 0%,transparent 72%);pointer-events:none;z-index:2;}
.status{position:absolute;left:0;right:0;top:calc(50% + var(--halo)/2 + 30px);display:flex;justify-content:center;pointer-events:none;}
.status-text{font-size:10px;font-weight:300;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.55);opacity:0;transform:translateY(4px);transition:opacity .6s ease,transform .6s ease;white-space:nowrap;}
.status-text.show{opacity:1;transform:translateY(0);}
.hint{position:absolute;left:0;right:0;bottom:clamp(30px,7vh,64px);display:flex;justify-content:center;pointer-events:none;}
.hint-text{font-size:9px;font-weight:200;letter-spacing:.4em;text-transform:uppercase;color:rgba(255,255,255,.14);transition:opacity 1s ease;}
.version-tag{position:fixed;left:18px;bottom:16px;z-index:40;font-family:var(--font-mono);font-size:9px;font-weight:300;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.16);user-select:none;pointer-events:none;}
/* SETTINGS (Ctrl + ,) */
#settingsPanel{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s ease;}
#settingsPanel.open{opacity:1;pointer-events:auto;}
.settings-card{width:min(280px,84vw);padding:28px 26px;border:1px solid rgba(167,139,250,.22);border-radius:14px;background:rgba(8,8,14,.92);box-shadow:0 0 60px rgba(109,40,217,.18);}
.settings-title{font-size:10px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:22px;text-align:center;}
.settings-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:300;color:rgba(255,255,255,.75);padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06);}
.settings-row:last-of-type{border-bottom:none;}
.settings-toggle{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#a78bfa;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);border-radius:20px;padding:5px 12px;cursor:pointer;transition:all .25s ease;}
.settings-toggle:hover{background:rgba(167,139,250,.18);}
.settings-hint{margin-top:20px;text-align:center;font-size:9px;font-weight:300;letter-spacing:.2em;color:rgba(255,255,255,.22);}
@media (prefers-reduced-motion:reduce){.orb,.halo,.boot-ring,.header-dot,.wave-ring{animation:none !important;}}
</style>
</head>
<body>
<div class="void"></div>
<div class="orb-bleed" id="bleed"></div>

<!-- Configuração pública gerada pelo servidor (sem segredos). Em file:// ela não carrega e o ORION usa só o provider local. -->
<script src="/orion-config.js"></script>

<div id="boot">
  <p class="boot-mark">ORION AI</p>
  <div class="boot-ring-wrap"><div class="boot-ring"></div><div class="boot-ring"></div></div>
  <p class="boot-status" id="bootStatus">inicializando</p>
</div>

<div id="app">
  <div class="header"><div class="header-dot"></div><span class="header-word">ORION AI</span><div class="header-dot"></div></div>
  <div class="stage">
    <div class="orb-zone" id="orbZone">
      <div class="wave-ring"></div><div class="wave-ring"></div><div class="wave-ring"></div>
      <div class="halo" id="halo"></div>
      <div class="orb" id="orb"><canvas class="orb-canvas" id="orbCanvas"></canvas><div class="glass-hi"></div><div class="glass-rim"></div></div>
    </div>
  </div>
  <div class="status"><span class="status-text" id="statusText"></span></div>
  <div class="hint"><span class="hint-text" id="hintText"></span></div>
</div>
<div class="version-tag" id="versionTag"></div>

<script>
const ORION_VERSION = '3.5.0';

/* ═══════════ config.js — só lê configuração pública; nunca guarda keys ═══════════ */
const CONFIG = Object.assign(
  { endpoint: '', defaultProvider: 'local', routes: {}, models: {}, timeoutMs: 15000 },
  window.ORION_CONFIG || {}
);

/* ═══════════ logger.js — sem texto bruto, sem chaves ═══════════ */
const LOGGER = (() => {
  const DEV = /^(localhost|127\.0\.0\.1|)$/.test(location.hostname) || location.protocol === 'file:';
  const sessionId = 'sess_' + Math.random().toString(36).slice(2, 10);
  let seq = 0;
  const SENSITIVE = /(key|token|secret|authorization|text|rawText|content)/i;
  const clean = d => Object.fromEntries(Object.entries(d).filter(([k]) => DEV || !SENSITIVE.test(k)));
  const log = (lvl, ev, d = {}) => {
    const fn = lvl === 'error' ? console.error : lvl === 'warn' ? console.warn : console.log;
    fn('[ORION]', { t: new Date().toISOString(), lvl, ev, sessionId, ...clean(d) });
  };
  return { sessionId, newId: () => 'req_' + (++seq) + '_' + Math.random().toString(36).slice(2, 6),
    info: (e, d) => log('info', e, d), warn: (e, d) => log('warn', e, d), error: (e, d) => log('error', e, d) };
})();

/* ═══════════ i18n.js — todo texto do usuário mora aqui. Novo idioma = novo pack ═══════════ */
const I18N = (() => {
  const PACKS = {
    'pt-BR': {
      label: 'Português', speech: 'pt-BR',
      system: 'Você é o ORION, uma inteligência criada por Jander. Responda em português do Brasil, de forma breve, clara e elegante.',
      ui: { boot: ['inicializando', 'conectando ao núcleo', 'sistemas online'], online: 'ORION ONLINE', hint: 'toque para falar',
        standby: 'ORION online.', listening: 'Ouvindo…', thinking: 'Pensando…', responding: 'Respondendo…',
        settings: 'Configurações', voice: 'Voz', sounds: 'Sons', language: 'Idioma', on: 'Ativada', off: 'Desativada', sOn: 'Ativados', sOff: 'Desativados',
        close: 'Ctrl + , para fechar', version: 'VERSÃO V' },
      err: { mic_unavailable: 'Microfone indisponível.', stt_unavailable: 'Reconhecimento de voz indisponível neste navegador.', model_unavailable: 'Não consegui acessar o modelo.',
        timeout: 'A resposta demorou demais.', api_error: 'Falha ao comunicar com o serviço.', invalid_response: 'Recebi uma resposta inválida.',
        tool_unavailable: 'Essa ferramenta ainda não está disponível.', offline: 'Sem conexão com a internet.', unexpected_input: 'Não entendi o que foi dito.',
        voice_disabled: 'Voz desativada nas configurações.', unknown: 'Não consegui processar.' },
      tools: { time: n => `São ${n.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}.`, date: n => `Hoje é ${n.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' })}.`, calc: v => `Resultado: ${v}.` },
      route: { time: /que horas|que hora/i, date: /que dia|data de hoje/i, code: /\b(código|programar|função|script|bug)\b/i, creative: /\b(poema|história|crie|escreva)\b/i },
      patterns: [
        { re: /\b(olá|oi|bom dia|boa tarde|boa noite|hello)\b/i, r: ['Sistemas operacionais. Como posso auxiliá-lo?', 'Pronto. O que precisa?', 'Online e a postos.'] },
        { re: /quem\s+(é\s+)?(você|vc)/i, r: ['Sou o ORION — uma inteligência construída por Jander para observar, responder e auxiliar.'] },
        { re: /\b(obrigad[ao]|valeu|thanks)\b/i, r: ['Para isso estou aqui.', 'Sempre às ordens.'] },
        { re: /\b(tchau|até logo|adeus|bye)\b/i, r: ['Retornando ao repouso. Até logo.'] },
        { re: /(versão|build|sistema)/i, r: ['ORION AI, versão ' + ORION_VERSION + '.'] },
        { re: /como (você\s+)?(está|vai)/i, r: ['Todos os sistemas estáveis.', 'Funcionando normalmente, obrigado por perguntar.'] },
      ],
      fallback: ['Ainda estou em fase Beta e não tenho uma resposta elaborada para isso.', 'Essa função ainda não está disponível nesta versão.', 'Registrei sua solicitação, mas ainda não sei responder a isso.'],
    },
    en: {
      label: 'English', speech: 'en-US',
      system: 'You are ORION, an intelligence built by Jander. Reply in English, briefly, clearly and with elegance.',
      ui: { boot: ['initializing', 'connecting to core', 'systems online'], online: 'ORION ONLINE', hint: 'tap to speak',
        standby: 'ORION online.', listening: 'Listening…', thinking: 'Thinking…', responding: 'Responding…',
        settings: 'Settings', voice: 'Voice', sounds: 'Sounds', language: 'Language', on: 'Enabled', off: 'Disabled', sOn: 'Enabled', sOff: 'Disabled',
        close: 'Ctrl + , to close', version: 'VERSION V' },
      err: { mic_unavailable: 'Microphone unavailable.', stt_unavailable: 'Speech recognition is unavailable in this browser.', model_unavailable: "I couldn't reach the model.",
        timeout: 'The response took too long.', api_error: 'Failed to reach the service.', invalid_response: 'I received an invalid response.',
        tool_unavailable: "That tool isn't available yet.", offline: 'No internet connection.', unexpected_input: "I didn't understand that.",
        voice_disabled: 'Voice is disabled in settings.', unknown: "I couldn't process that." },
      tools: { time: n => `It is ${n.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}.`, date: n => `Today is ${n.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' })}.`, calc: v => `Result: ${v}.` },
      route: { time: /what time/i, date: /what day|today'?s date|date today/i, code: /\b(code|program|function|script|bug)\b/i, creative: /\b(poem|story|write|create)\b/i },
      patterns: [
        { re: /\b(hello|hi|hey|good (morning|afternoon|evening))\b/i, r: ['Systems operational. How can I assist?', 'Ready. What do you need?', 'Online and standing by.'] },
        { re: /who\s+are\s+you/i, r: ['I am ORION — an intelligence built by Jander to observe, answer and assist.'] },
        { re: /\b(thanks|thank you)\b/i, r: ["That's what I'm here for.", 'Always at your service.'] },
        { re: /\b(bye|goodbye|see you)\b/i, r: ['Returning to rest. See you soon.'] },
        { re: /\b(version|build)\b/i, r: ['ORION AI, version ' + ORION_VERSION + '.'] },
        { re: /how are you/i, r: ['All systems stable.', 'Running normally, thanks for asking.'] },
      ],
      fallback: ["I'm still in Beta and don't have an elaborate answer for that.", "That feature isn't available in this version yet.", "I logged your request, but I don't know how to answer that yet."],
    },
  };
  const detect = () => { const n = (navigator.language || 'pt-BR').toLowerCase(); return n.startsWith('en') ? 'en' : 'pt-BR'; };
  let lang = detect();
  try { const s = localStorage.getItem('orion.lang'); if (s && PACKS[s]) lang = s; } catch (e) {}
  const pack = () => PACKS[lang];
  return {
    packs: PACKS, list: () => Object.keys(PACKS), pack, get: () => lang,
    set(l) { if (!PACKS[l]) return; lang = l; document.documentElement.lang = l.toLowerCase(); try { localStorage.setItem('orion.lang', l); } catch (e) {} },
    t: k => pack().ui[k] ?? k,
    err: c => pack().err[c] || pack().err.unknown,
  };
})();

/* ═══════════ visual-state.js — mesma paleta da V3.2 ═══════════ */
const VISUAL_STATE = (() => {
  const CFG = {
    standby:   { amp: 1.00, rot: 1.00, bright: 1.00, cls: '', color: { a: '#6d28d9', b: '#4c1d95', c: '#a78bfa' } },
    listening: { amp: 1.20, rot: 1.55, bright: 1.18, cls: 'st-listening', color: { a: '#1d4ed8', b: '#1e3a8a', c: '#60a5fa' } },
    thinking:  { amp: 1.14, rot: 2.10, bright: 1.05, cls: 'st-thinking', color: { a: '#6d28d9', b: '#4c1d95', c: '#a78bfa' } },
    speaking:  { amp: 1.26, rot: 1.70, bright: 1.30, cls: 'st-speaking', color: { a: '#15803d', b: '#14532d', c: '#4ade80' } },
    error:     { amp: 0.80, rot: 0.50, bright: 0.62, cls: 'st-error', color: { a: '#b91c1c', b: '#7f1d1d', c: '#f87171' } },
  };
  const config = n => CFG[n] || CFG.standby;
  return { config };
})();

/* ═══════════ tools — registro extensível com permissões ═══════════ */
const PERMISSIONS = (() => {
  const LEVEL = Object.freeze({ READ_ONLY: 'READ_ONLY', WRITE: 'WRITE', EXECUTE: 'EXECUTE', EXTERNAL_ACTION: 'EXTERNAL_ACTION' });
  return { LEVEL, needsConfirmation: l => l !== LEVEL.READ_ONLY };
})();

const mkErr = (code, msg) => Object.assign(new Error(msg || code), { code });

function safeArithmetic(expr) {
  const clean = String(expr).trim();
  if (!/^[0-9+\-*/().,\s]+$/.test(clean)) throw mkErr('unexpected_input');
  const tokens = clean.replace(/,/g, '.').match(/(\d+\.?\d*|\.\d+|[+\-*/()])/g) || [];
  const out = [], ops = [], prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
  tokens.forEach(tk => {
    if (/^[\d.]+$/.test(tk)) out.push(parseFloat(tk));
    else if (tk === '(') ops.push(tk);
    else if (tk === ')') { while (ops.length && ops[ops.length - 1] !== '(') out.push(ops.pop()); ops.pop(); }
    else { while (ops.length && prec[ops[ops.length - 1]] >= prec[tk]) out.push(ops.pop()); ops.push(tk); }
  });
  while (ops.length) out.push(ops.pop());
  const st = [];
  out.forEach(tk => {
    if (typeof tk === 'number') return st.push(tk);
    const b = st.pop(), a = st.pop();
    st.push(tk === '+' ? a + b : tk === '-' ? a - b : tk === '*' ? a * b : a / b);
  });
  const r = st.pop();
  if (typeof r !== 'number' || !Number.isFinite(r)) throw mkErr('invalid_response');
  return r;
}

const TOOLS = (() => {
  const reg = {};
  const api = {
    register(name, def) { reg[name] = { permission: PERMISSIONS.LEVEL.READ_ONLY, description: '', ...def }; LOGGER.info('tool_registered', { name }); },
    has: n => Object.prototype.hasOwnProperty.call(reg, n),
    list: () => Object.entries(reg).map(([name, t]) => ({ name, permission: t.permission, description: t.description })),
    async run(name, args) {
      if (!api.has(name)) throw mkErr('tool_unavailable');
      if (PERMISSIONS.needsConfirmation(reg[name].permission)) throw mkErr('tool_unavailable', 'confirmation layer not implemented');
      return reg[name].run(args);
    },
  };
  return api;
})();
TOOLS.register('calculator', { description: 'Arithmetic (+ - * / parentheses).', run: ({ expression }) => I18N.pack().tools.calc(safeArithmetic(expression)) });
TOOLS.register('datetime', { description: 'Current time or date.', run: ({ kind }) => I18N.pack().tools[kind](new Date()) });

/* ═══════════ providers — o CORE só conhece a interface ModelProvider ═══════════ */
class ModelProvider {
  constructor(name) { this.name = name; }
  get available() { return true; }
  async generate() { throw mkErr('model_unavailable', 'generate() not implemented'); }
}
class LocalProvider extends ModelProvider {
  constructor() { super('local'); }
  async generate({ text }) {
    const p = I18N.pack(), rand = a => a[Math.floor(Math.random() * a.length)];
    const hit = p.patterns.find(x => x.re.test(text));
    return rand(hit ? hit.r : p.fallback);
  }
}
// Fornecedores remotos falam com um proxy de backend (as keys ficam no servidor, via env vars).
class ProxyProvider extends ModelProvider {
  get available() { return !!CONFIG.endpoint; }
  async generate({ system, messages, signal }) {
    let res;
    try {

class OpenAIProvider extends ProxyProvider { constructor() { super('openai'); } }

const PROVIDERS = (() => {
  const map = {};
  const api = {
    register(p) { if (!(p instanceof ModelProvider)) throw new Error('Invalid provider'); map[p.name] = p; LOGGER.info('provider_registered', { name: p.name }); },
    get: n => map[n],

    pick(taskType) {
      const want = CONFIG.routes[taskType] || CONFIG.defaultProvider;

    },

/* ═══════════ context.js — sessão estruturada, sem persistência ═══════════ */
class Session {
  constructor(max = 12) { this.max = max; this.items = []; }
  add(role, content, meta) { this.items.push({ role, content, ...meta }); if (this.items.length > this.max) this.items.shift(); }
  // resultados de ferramenta entram no modelo como contexto do assistente
  messages() { return this.items.map(i => ({ role: i.role === 'user' ? 'user' : 'assistant', content: i.role === 'tool' ? `[${i.tool}] ${i.content}` : i.content })); }

  reset() { this.items = []; }

/* ═══════════ router.js — decide ferramenta OU provider conforme a tarefa ═══════════ */
const ROUTER = (() => {
  const MATH = /^\s*[0-9][0-9+\-*/().,\s]*[0-9)]\s*$/;
  function route(text) {
    const t = text.trim(), r = I18N.pack().route;
    if (MATH.test(t) && /[+\-*/]/.test(t)) return { kind: 'tool', tool: 'calculator', args: { expression: t } };
    if (r.time.test(t)) return { kind: 'tool', tool: 'datetime', args: { kind: 'time' } };
    if (r.date.test(t)) return { kind: 'tool', tool: 'datetime', args: { kind: 'date' } };
    const type = r.code.test(t) ? 'code' : r.creative.test(t) ? 'creative' : 'chat';
    return { kind: 'model', type, provider: PROVIDERS.pick(type) };
  }
  return { route };
})();

/* ═══════════ voice.js — STT e TTS nativos, atrás de uma interface simples ═══════════ */

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition, synth = window.speechSynthesis;
  let rec = null, active = false, cached = null;
  const MALE = ['antonio', 'antônio', 'daniel', 'fabio', 'felipe', 'ricardo', 'thiago', 'tiago', 'guy', 'david', 'mark', 'alex', 'male', 'masculin'];
  const FEMALE = ['female', 'feminin', 'francisca', 'luciana', 'maria', 'fernanda', 'joana', 'zira', 'samantha', 'google português', 'google us'];
  function pick(lang) {
    const vs = synth ? synth.getVoices() : []; const pre = lang.slice(0, 2).toLowerCase();
    let best = null, bs = -Infinity;
    vs.forEach(v => {
      const n = v.name.toLowerCase(), l = (v.lang || '').toLowerCase(); let s = 0;
      if (l === lang.toLowerCase()) s += 50; else if (l.startsWith(pre)) s += 30; else return;
      if (FEMALE.some(h => n.includes(h))) s -= 500;
      if (MALE.some(h => n.includes(h))) s += 100;
      if (['neural', 'natural', 'online'].some(h => n.includes(h))) s += 20;
      if (v.localService) s += 8;

    available: !!SR,
    listen(lang, cb) {

      rec.onerror = e => { active = false; cb.onError(e.error); };
      rec.onend = () => { if (active) { active = false; cb.onEnd(); } };
      rec.onresult = e => {

/* ═══════════ core.js — ORION CORE: única fonte de verdade dos estados ═══════════

    return gen;
  }

  function fail(err, stage) {
    const code = err && err.code && I18N.pack().err[err.code] ? err.code : (!navigator.onLine ? 'offline' : 'unknown');

      onError: c => c === 'no-speech' ? setState('standby', '') : fail(mkErr(c === 'not-allowed' ? 'mic_unavailable' : 'stt_unavailable', c), 'stt'),

})();

/* ═══════════ orb.js — mesma Orb, iluminação e profundidade refinadas ═══════════ */

    setTimeout(() => { bootEl.style.display = 'none'; appEl.classList.add('on'); setTimeout(() => flash(I18N.t('online'), 3200), 300); }, 1000);
  }, 2100);

  function flash(msg, ms = 2600) {
    clearTimeout(statusTimer); statusText.textContent = msg;
    requestAnimationFrame(() => statusText.classList.add('show'));
    statusTimer = setTimeout(() => statusText.classList.remove('show'), ms);
  }

  // a UI reflete exatamente os estados reais emitidos pelo CORE
  CORE.on((state, msg) => {
    try { ORB.setState(state); } catch (e) { console.error('[ORION] ORB.setState falhou:', e); }
    const m = msg !== undefined ? msg : ({ standby: I18N.t('standby'), listening: I18N.t('listening'), thinking: I18N.t('thinking') })[state];
    if (m) flash(m, state === 'error' ? 2200 : 2400);
    if (soundOn) { try { ({ listening: SOUND.listen, speaking: SOUND.answer, error: SOUND.error })[state]?.(); } catch (e) {} }
  });

  function activate() {
    if (hintShown) { hintShown = false; hintText.style.opacity = '0'; }
    if (CORE.state() === 'standby') { ORB.pressEffect(); if (soundOn) try { SOUND.activate(); } catch (e) {} }
    CORE.toggle();
  }

  const zone = $('orbZone');
  zone.addEventListener('click', activate);
  zone.addEventListener('touchstart', e => { e.preventDefault(); activate(); }, { passive: false });
  zone.addEventListener('mouseenter', () => ORB.setHover(true));
  zone.addEventListener('mouseleave', () => ORB.setHover(false));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.target.matches('input,textarea')) { e.preventDefault(); activate(); }
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 't') TESTS.run();
  });

  window.addEventListener('orion-setting', e => {
    const { key, value } = e.detail;
    if (key === 'voice') CORE.setVoice(value);
    if (key === 'sound') soundOn = value;
    if (key === 'lang') { I18N.set(value); CORE.onLangChange(); applyI18n(); flash(I18N.pack().label, 1800); }
  });

  LOGGER.info('session_started', { version: ORION_VERSION, sttAvailable: VOICE.available, lang: I18N.get(), remote: !!CONFIG.endpoint });
  try { ORB.init(); } catch (e) { console.error('[ORION] ORB.init falhou:', e); }
  try { SETTINGS.init(); } catch (e) { console.error('[ORION] SETTINGS.init falhou:', e); }
  if (/[?&]test=1/.test(location.search)) TESTS.run();
})();
</script>
</body>
</html>
