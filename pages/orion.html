<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --font:      'Sora', -apple-system, 'Helvetica Neue', sans-serif;
  --font-mono: 'Space Grotesk', 'Inter', sans-serif;
  --orb:  clamp(190px, 32vmin, 320px);
  --halo: calc(var(--orb) * 1.9);
  --panel-w: min(550px, 90vw);
  --panel-h: clamp(280px, 58vh, 400px);
  /* cor "ao vivo" da Orb — atualizada quadro a quadro por app.js (ORB) */
  --core-a: #5b21b6; --core-b: #2e1065; --core-c: #8b5cf6;
}

html,body{
  width:100vw; height:100dvh; overflow:hidden;
  background:#000; font-family:var(--font); color:#fff;
  -webkit-font-smoothing:antialiased;
}

.void{ position:fixed; inset:0; background:#000; z-index:0; }
.orb-bleed{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(circle at 50% 54%, color-mix(in srgb, var(--core-a) 10%, transparent) 0%, transparent 42%);
  transition: opacity 1.2s ease;
  opacity: var(--bleed-op, 1);
}

/* ═══════ BOOT ═══════ */
#boot{
  position:fixed; inset:0; z-index:200; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .67s ease;
}
#boot.out{ opacity:0; pointer-events:none; }
.boot-word{ width:min(190px, 56vw); height:auto; margin-bottom:24px; filter:drop-shadow(0 0 14px rgba(120,100,255,.28)); }
.boot-ring-wrap{ position:relative; width:76px; height:76px; margin-bottom:46px; }
.boot-ring{
  position:absolute; inset:0; border-radius:50%;
  border:1px solid rgba(167,139,250,0.18);
  border-top-color:rgba(167,139,250,0.75);
  animation:bootspin 1.1s linear infinite;
}
.boot-ring:nth-child(2){ inset:14px; border-top-color:rgba(196,181,253,0.45); animation-duration:1.6s; animation-direction:reverse; }
@keyframes bootspin{ to{ transform:rotate(360deg); } }
.boot-status{
  font-size:9px; font-weight:500; letter-spacing:0.34em; text-transform:uppercase;
  color:rgba(255,255,255,0.5); transition:opacity 0.2s ease;
}

/* ═══════ APP ═══════ */
#app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity .75s ease; }
#app.on{ opacity:1; }

.header{
  position:absolute; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding-top:clamp(28px, 6vh, 56px);
  pointer-events:none; user-select:none;
}
.header-dot{
  width:3px; height:3px; border-radius:50%;
  background:var(--core-c); box-shadow:0 0 8px var(--core-c);
  animation:dotbreathe 4s ease-in-out infinite;
}
@keyframes dotbreathe{ 0%,100%{opacity:0.35;} 50%{opacity:1;} }
.header-logo{ width:min(150px, 44vw); height:auto; filter:drop-shadow(0 0 12px rgba(120,100,255,.25)); }

/* ═══════ STAGE ═══════ */
.stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.orb-zone{
  position:relative; width:var(--halo); height:var(--halo);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}

.halo{
  position:absolute; width:100%; height:100%; border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0%, color-mix(in srgb, var(--core-a) 55%, transparent) 24%,
    color-mix(in srgb, var(--core-b) 40%, transparent) 50%,
    color-mix(in srgb, var(--core-a) 45%, transparent) 74%, transparent 92%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  transition:opacity 0.6s ease, filter 0.6s ease;
  opacity:0.45;
}
.halo.fast{ opacity:0.75; }
.orb-zone:hover .halo{ opacity:0.62; filter:brightness(1.1); }

/* anéis de energia — só aparecem enquanto o ORION fala (cor = estado atual) */
.wave-ring{
  position:absolute; left:50%; top:50%; border-radius:50%;
  width:var(--orb); height:var(--orb);
  transform:translate(-50%, calc(-50% + var(--orb-y, 0px))) scale(1);
  border:1px solid color-mix(in srgb, var(--core-c) 70%, transparent);
  opacity:0; pointer-events:none;
}
.orb-zone.speaking .wave-ring{ animation:wave-out 2.8s ease-out infinite; }
.orb-zone.speaking .wave-ring:nth-child(2){ animation-delay:0.93s; }
.orb-zone.speaking .wave-ring:nth-child(3){ animation-delay:1.86s; }
@keyframes wave-out{
  0%{ transform:translate(-50%, calc(-50% + var(--orb-y, 0px))) scale(1); opacity:0.45; }
  100%{ transform:translate(-50%, calc(-50% + var(--orb-y, 0px))) scale(1.55); opacity:0; }
}

.orb{
  position:relative; flex:none; width:var(--orb); height:var(--orb); border-radius:50%;
  overflow:hidden;
  background:radial-gradient(circle at 34% 30%,
    color-mix(in srgb, var(--core-c) 12%, transparent) 0%,
    color-mix(in srgb, var(--core-a) 6%, transparent) 32%,
    rgba(2,2,8,0.88) 68%, rgba(0,0,0,0.95) 100%);
  border:1px solid color-mix(in srgb, var(--core-a) 28%, transparent);
  box-shadow:
    0 0 60px color-mix(in srgb, var(--core-a) 30%, transparent),
    0 0 130px color-mix(in srgb, var(--core-b) 22%, transparent),
    inset 0 0 60px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.12);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  transform:translateY(var(--orb-y,0px)) scale(var(--orb-s,1));   /* respiração/flutuação/pulso: calculados por app.js, parados no standby */
  transition:box-shadow 0.9s ease, filter 0.6s ease, opacity .45s ease,
    width .55s cubic-bezier(.16,.9,.24,1), height .55s cubic-bezier(.16,.9,.24,1), border-radius .55s cubic-bezier(.16,.9,.24,1);
  will-change:transform;
  z-index:1;
}
.orb-zone:hover .orb{
  filter:brightness(1.06);
  box-shadow:
    0 0 78px color-mix(in srgb, var(--core-a) 40%, transparent),
    0 0 150px color-mix(in srgb, var(--core-b) 28%, transparent),
    inset 0 0 60px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.14);
}
.orb.st-listening{ filter:brightness(1.08); }
.orb.st-thinking{ filter:brightness(1.03); }
.orb.st-speaking{ filter:brightness(1.12); }
.orb.st-error{ filter:brightness(0.62); animation:orberr 0.42s ease; }
@keyframes orberr{ 0%{transform:translateX(0);} 25%{transform:translateX(-7px);} 55%{transform:translateX(6px);} 80%{transform:translateX(-3px);} 100%{transform:translateX(0);} }

.orb-canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; mix-blend-mode:screen; }
.glass-hi{ position:absolute; top:6%; left:9%; width:44%; height:38%; border-radius:50%;
  background:radial-gradient(ellipse at 38% 32%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 46%, transparent 74%);
  transform:rotate(-22deg); pointer-events:none; z-index:2; }
.glass-rim{ position:absolute; bottom:6%; right:8%; width:24%; height:12%; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,0.06) 0%, transparent 72%); pointer-events:none; z-index:2; }

.status{
  position:absolute; left:0; right:0;
  top:calc(50% + var(--halo)/2 + 30px);
  display:flex; justify-content:center; pointer-events:none;
}
.status-text{
  font-size:10px; font-weight:500; letter-spacing:0.28em; text-transform:uppercase;
  color:rgba(255,255,255,0.72); opacity:0; transform:translateY(4px);
  transition:opacity 0.5s ease, transform 0.5s ease;
  white-space:normal; text-align:center; max-width:min(520px, 90vw); line-height:1.7;
}
.status-text.show{ opacity:1; transform:translateY(0); }

.hint{
  position:absolute; left:0; right:0; bottom:clamp(30px, 7vh, 64px);
  display:flex; justify-content:center; pointer-events:none;
}
.hint-text{
  font-size:9px; font-weight:500; letter-spacing:0.4em; text-transform:uppercase;
  color:rgba(255,255,255,0.34); transition:opacity 1s ease; text-align:center; padding:0 16px; line-height:1.8;
}

.version-tag{
  position:fixed; left:18px; bottom:16px; z-index:40;
  font-family:var(--font-mono); font-size:9px; font-weight:500;
  letter-spacing:0.22em; text-transform:uppercase;
  color:rgba(255,255,255,0.30); user-select:none; pointer-events:none;
}

/* ═══════ SETTINGS (Ctrl + ,) ═══════ */
#settingsPanel{
  position:fixed; inset:0; z-index:150;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.72); backdrop-filter:blur(6px);
  opacity:0; pointer-events:none; transition:opacity 0.35s ease;
}
#settingsPanel.open{ opacity:1; pointer-events:auto; }
.settings-card{
  width:min(340px, 88vw); max-height:92dvh; overflow-y:auto; padding:28px 26px;
  border:1px solid rgba(167,139,250,0.22); border-radius:14px;
  background:rgba(8,8,14,0.92);
  box-shadow:0 0 60px rgba(91,33,182,0.18);
}
.settings-title{
  font-size:10px; font-weight:500; letter-spacing:0.34em; text-transform:uppercase;
  color:rgba(255,255,255,0.6); margin-bottom:22px; text-align:center;
}
.settings-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  font-size:13px; font-weight:500; color:rgba(255,255,255,0.82);
  padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06);
}
.settings-row:last-of-type{ border-bottom:none; }
.settings-toggle{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  color:#a78bfa; background:rgba(167,139,250,0.10); border:1px solid rgba(167,139,250,0.3);
  border-radius:20px; padding:5px 12px; cursor:pointer; transition:all 0.25s ease;
}
.settings-toggle:hover{ background:rgba(167,139,250,0.18); }
.settings-toggle:disabled{ opacity:.45; cursor:default; }
.settings-note{ padding:0 0 10px; font-size:10.5px; line-height:1.65; color:rgba(255,255,255,0.40); border-bottom:1px solid rgba(255,255,255,0.06); }
.settings-note.warn{ color:#fca5a5; }
.settings-note[hidden]{ display:none; }
.settings-hint{
  margin-top:20px; text-align:center; font-size:9px; font-weight:500;
  letter-spacing:0.2em; color:rgba(255,255,255,0.22);
}

.gear{
  position:fixed; right:16px; bottom:12px; z-index:40;
  width:40px; height:40px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,0.52); background:transparent; border:1px solid transparent;
  transition:color .3s ease, border-color .3s ease, transform .3s ease, background .3s ease;
}
.gear:hover{ color:rgba(255,255,255,0.85); border-color:rgba(167,139,250,0.3); background:rgba(167,139,250,0.08); transform:translateY(-2px); }
.gear:focus-visible{ outline:1px solid #a78bfa; outline-offset:3px; }
.settings-email{ font-size:11px; font-weight:500; color:rgba(255,255,255,0.5); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.settings-out{
  width:100%; margin-top:18px; height:40px; border-radius:20px; cursor:pointer;
  font:500 11px var(--font); letter-spacing:0.22em; text-transform:uppercase;
  color:#f87171; background:rgba(248,113,113,0.07); border:1px solid rgba(248,113,113,0.30);
  transition:background .25s ease;
}
.settings-out:hover{ background:rgba(248,113,113,0.15); }

/* ═══════ painel de resposta: a própria Orb vira o painel ═══════ */
.orb-zone{ transition:transform .9s cubic-bezier(.2,.7,.2,1); }
body.chat-open .orb-zone:not(.panel-open){ transform:scale(.78); }   /* com o campo de pergunta aberto, a Orb diminui um pouco */
.orb-zone.panel-open{ cursor:default; }
.orb-zone.panel-open .halo, .orb-zone.panel-open .wave-ring{ opacity:0 !important; }
.status{ transition:top .8s cubic-bezier(.16,.9,.24,1); }
body.panel-on .status{ top:calc(50% + var(--panel-h)/2 + 18px); }

.orb.panel{ width:var(--panel-w); height:var(--panel-h); border-radius:28px; animation:none !important; filter:none !important; cursor:default; }
.orb-canvas, .glass-hi, .glass-rim{ transition:opacity .45s ease; }
.orb.panel{ border-color:color-mix(in srgb, var(--core-c) 45%, transparent); }
.orb.panel .orb-canvas, .orb.panel .glass-hi, .orb.panel .glass-rim{ opacity:0; }
.panel-bg{ position:absolute; inset:0; z-index:1; background:rgba(7,7,15,.94); opacity:0; transition:opacity .35s ease; pointer-events:none; }
.orb.panel .panel-bg{ opacity:1; }

.panel-ui{
  position:absolute; inset:0; z-index:3; display:flex; flex-direction:column;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .25s ease, visibility 0s linear .25s;
}
.orb.panel .panel-ui{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .3s ease .3s, visibility 0s linear .3s; }

.answer-scroll{
  flex:1; min-height:0; overflow-y:auto; padding:26px 28px 10px; text-align:center;
  scrollbar-width:thin; scrollbar-color:rgba(167,139,250,.35) transparent;
}
.answer-scroll.scrolls{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
          mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
}
.response-text{
  font-size:clamp(14px, 2.1vmin, 17px); font-weight:600; line-height:1.75; letter-spacing:.02em;
  color:rgba(255,255,255,.92); text-shadow:0 0 22px color-mix(in srgb, var(--core-c) 38%, transparent);
}
.response-text .w{ display:inline-block; opacity:0; filter:blur(5px); animation:wordin .45s ease forwards; }
@keyframes wordin{ to{ opacity:1; filter:blur(0); } }
.orb.answer-error .response-text{ font-size:13px; letter-spacing:.06em; color:#fca5a5; text-shadow:0 0 18px rgba(248,113,113,.3); }

.answer-gallery{ display:flex; gap:10px; justify-content:center; margin:0 auto 14px; }
.answer-gallery[hidden]{ display:none; }
.answer-gallery img{
  flex:1 1 0; min-width:0; height:170px; object-fit:cover; border-radius:14px;
  border:1px solid color-mix(in srgb, var(--core-c) 30%, transparent);
  box-shadow:0 0 24px color-mix(in srgb, var(--core-a) 25%, transparent);
  opacity:0; transition:opacity .5s ease;
}
.answer-gallery img.loaded{ opacity:1; }
.answer-gallery img:only-child{ flex:none; height:auto; max-height:220px; max-width:100%; object-fit:contain; }
@media (max-width:520px){ .answer-gallery img{ height:120px; } }

.answer-source{
  flex:none; align-self:center; margin:0 0 8px; padding:6px 14px; border-radius:16px;
  font:500 10px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  color:color-mix(in srgb, var(--core-c) 85%, #fff); border:1px solid color-mix(in srgb, var(--core-c) 40%, transparent);
  background:color-mix(in srgb, var(--core-a) 14%, transparent); transition:background .25s ease;
}
.answer-source:hover{ background:color-mix(in srgb, var(--core-a) 30%, transparent); }
.answer-source[hidden]{ display:none; }

.ask{
  position:absolute; left:50%; z-index:5; bottom:16px;
  width:min(560px, 88vw); height:48px; padding:0 6px 0 22px;
  display:flex; align-items:center; gap:4px; border-radius:26px;
  background:rgba(8,8,18,.62); border:1px solid color-mix(in srgb, var(--core-a) 38%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translate(-50%, 70vh) scale(.92);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease, border-color .4s ease, box-shadow .4s ease, visibility 0s linear .9s;
}
.ask.open{
  opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%, 0) scale(1);
  box-shadow:0 0 34px color-mix(in srgb, var(--core-a) 28%, transparent);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease .08s, border-color .4s ease, box-shadow .4s ease, visibility 0s;
}
.ask:focus-within{ border-color:color-mix(in srgb, var(--core-c) 75%, transparent); box-shadow:0 0 38px color-mix(in srgb, var(--core-a) 40%, transparent); }
.ask-input{ flex:1; min-width:0; height:100%; background:none; border:0; outline:none; color:#fff; font:500 14px var(--font); letter-spacing:.04em; }
.ask-input::placeholder{ color:rgba(255,255,255,.3); letter-spacing:.06em; }
.ask-input:disabled{ opacity:.55; }
.ask-send, .ask-mic{
  width:36px; height:36px; border-radius:50%; border:0; cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; transition:filter .3s ease, opacity .3s ease, color .3s ease;
}
.ask-send{ color:#fff; background:color-mix(in srgb, var(--core-a) 50%, transparent); }
.ask-mic{ color:rgba(255,255,255,.55); background:transparent; }
.ask-mic:hover{ color:#fff; }
.ask-send:hover{ filter:brightness(1.3); }
.ask-send:disabled, .ask-mic:disabled{ opacity:.35; cursor:default; }
.ask-send:focus-visible, .ask-mic:focus-visible{ outline:1px solid #a78bfa; outline-offset:2px; }
@media (max-width:760px){ .ask{ bottom:72px; } }

.siri{
  position:fixed; left:0; right:0; bottom:0; height:55vh; z-index:4; pointer-events:none;
  opacity:0; transform:translateY(100%); filter:blur(22px);
  background:
    radial-gradient(55% 60% at 18% 100%, rgba(30,64,175,.62), transparent 72%),
    radial-gradient(55% 62% at 50% 100%, color-mix(in srgb, var(--core-a) 75%, transparent), transparent 72%),
    radial-gradient(55% 60% at 84% 100%, rgba(34,197,94,.32), transparent 72%);
}
.siri.play{ animation:siri 1.7s cubic-bezier(.2,.75,.2,1) forwards; }
@keyframes siri{
  0%{ opacity:0; transform:translateY(100%); }
  30%{ opacity:1; }
  62%{ opacity:.9; transform:translateY(8%); }
  100%{ opacity:0; transform:translateY(-6%); }
}

body.chat-open .hint-text{ opacity:0; }

.chat-btn{ right:60px; }
.chat-btn.on{ color:#fff; border-color:rgba(167,139,250,.45); background:rgba(167,139,250,.14); }
.settings-select{
  max-width:160px; font:500 11px var(--font-mono); color:#a78bfa; background:rgba(167,139,250,.10);
  border:1px solid rgba(167,139,250,.3); border-radius:20px; padding:5px 10px; outline:none; cursor:pointer;
}
.settings-select option{ background:#0b0b14; color:#fff; }

/* ═══════ V4.5.0 — tela Voice & Speech ═══════ */
.vscreen{
  position:fixed; inset:0; z-index:160; background:#000; color:#fff;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .35s ease, visibility 0s linear .35s;
}
.vscreen.open{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .35s ease, visibility 0s; }
.vs-top{
  position:relative; height:52px; display:flex; align-items:center; justify-content:center;
  padding-top:env(safe-area-inset-top, 0px);
}
.vs-top h2{ font:500 10px var(--font); letter-spacing:.34em; text-indent:.34em; text-transform:uppercase; color:rgba(255,255,255,.65); }
.vs-back{
  position:absolute; left:12px; top:calc(4px + env(safe-area-inset-top, 0px)); width:44px; height:44px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.7); background:transparent; border:1px solid transparent;
  transition:color .25s ease, background .25s ease, border-color .25s ease;
}
.vs-back:hover{ color:#fff; background:rgba(167,139,250,.10); border-color:rgba(167,139,250,.3); }
.vs-back:focus-visible, .vs-dot:focus-visible, .vs-pill:focus-visible, .vs-btn:focus-visible, .vs-zone:focus-visible, .vs-range:focus-visible{ outline:2px solid #a78bfa; outline-offset:3px; }
.vs-scroll{
  height:calc(100dvh - 52px - env(safe-area-inset-top, 0px)); display:flex; flex-direction:column; overflow-y:auto;
  padding:0 24px calc(14px + env(safe-area-inset-bottom, 0px)); max-width:520px; margin:0 auto;
  scrollbar-width:thin; scrollbar-color:rgba(167,139,250,.35) transparent;
}
/* Orb da tela Voice & Speech: réplica da Orb principal; o tamanho se ajusta ao espaço livre (a tela inteira cabe sem rolar) */
.vs-orbwrap{ flex:1 1 0; min-height:120px; display:flex; align-items:center; justify-content:center; container-type:size; }
.vs-zone{
  --orb:min(36vw, 17vh, 180px); --halo:calc(var(--orb) * 1.9);   /* reserva, se o navegador não tiver container queries */
  position:relative; width:var(--halo); height:var(--halo); flex:none;
  display:flex; align-items:center; justify-content:center; cursor:pointer; border-radius:50%; -webkit-tap-highlight-color:transparent;
}
@supports (height:1cqh){ .vs-zone{ --orb:min(46cqw, 46cqh, 230px); } }
.vs-zone.speaking .wave-ring{ animation:wave-out 2.8s ease-out infinite; }
.vs-zone.speaking .wave-ring:nth-child(2){ animation-delay:0.93s; }
.vs-zone.speaking .wave-ring:nth-child(3){ animation-delay:1.86s; }
.vs-zone:hover .halo{ opacity:0.62; filter:brightness(1.1); }
.vs-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:4px 0 2px; font-size:17px; font-weight:500; color:#fff; }
.vs-row label, .vs-row > span:first-child{ color:#fff; }
.vs-note{ font:500 10px var(--font-mono); letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.4); }
.vs-pill{
  font:500 16px var(--font); color:#fff; background:#1b1b1f; border:1px solid rgba(255,255,255,.10); border-radius:22px;
  padding:9px 16px; outline:none; cursor:pointer; max-width:60%;
}
.vs-pill option{ background:#111; color:#fff; }
.vs-dots{ display:flex; justify-content:space-between; gap:8px; padding:4px 4px 10px; }
.vs-dot{
  --c:#8b5cf6; width:42px; height:42px; border-radius:50%; border:0; cursor:pointer; background:var(--c);
  font:600 16px var(--font); color:rgba(255,255,255,.92); transition:transform .2s ease, box-shadow .25s ease, opacity .25s ease;
}
.vs-dot:nth-child(1){ --c:#5b21b6; } .vs-dot:nth-child(2){ --c:#1e40af; } .vs-dot:nth-child(3){ --c:#166534; } .vs-dot:nth-child(4){ --c:#991b1b; }   /* = cor 'a' da Orb: repouso · ouvindo · respondendo · não entendi */
.vs-dot[aria-checked="true"]{ box-shadow:0 0 0 3px #000, 0 0 0 5.5px var(--c); transform:scale(1.04); }
.vs-dot:disabled{ opacity:.28; cursor:default; }
.vs-slider{ padding:2px 0 8px; }
.vs-slider-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:16px; font-weight:500; color:rgba(255,255,255,.75); margin-bottom:8px; }
.vs-slider-head output{ font:500 12px var(--font-mono); letter-spacing:.1em; color:rgba(255,255,255,.45); }
@property --p{ syntax:'<percentage>'; inherits:false; initial-value:50%; }
.vs-range{
  touch-action:pan-y; transition:--p .1s linear;
  -webkit-appearance:none; appearance:none; display:block; width:100%; height:7px; border-radius:7px; outline:none; cursor:pointer;
  background:linear-gradient(to right, #8b5cf6 var(--p,50%), rgba(255,255,255,.16) var(--p,50%));
}
.vs-range::-webkit-slider-thumb{ -webkit-appearance:none; width:34px; height:22px; border-radius:12px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.5); transition:transform .18s ease; }
.vs-range::-moz-range-thumb{ width:34px; height:22px; border:0; border-radius:12px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.5); transition:transform .18s ease; }
.vs-range:active::-webkit-slider-thumb{ transform:scale(1.1); }
.vs-range:active::-moz-range-thumb{ transform:scale(1.1); }
.vs-range:disabled{ opacity:.35; cursor:default; }
.vs-ends{ display:flex; justify-content:space-between; margin-top:5px; font:500 9px var(--font-mono); letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.28); }
/* Hey ORION: verde = cor "respondendo" da Orb · vermelho = cor "não entendi" (tons escuros exatos) */
.vs-wake{
  --w:#991b1b; display:block; width:100%; height:46px; margin:4px 0 2px; flex:none; border-radius:26px; border:0; cursor:pointer;
  font:600 12px var(--font); letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.95); background:var(--w);
  transition:background .35s ease, transform .15s ease, opacity .25s ease;
}
.vs-wake[aria-pressed="true"]{ --w:#166534; }
.vs-wake:active{ transform:scale(.985); }
.vs-wake:disabled{ --w:#27272a; opacity:.6; cursor:default; }
.vs-wake:focus-visible{ outline:2px solid #a78bfa; outline-offset:3px; }
.vs-msg{ min-height:16px; margin:2px 0 0; font-size:11px; line-height:1.5; color:rgba(255,255,255,.45); text-align:center; }
.vs-msg.err{ color:#fca5a5; }
.vs-btn{
  display:block; width:100%; height:48px; border-radius:24px; cursor:pointer;
  font:500 11px var(--font); letter-spacing:.22em; text-transform:uppercase; color:#e9e2ff;
  background:rgba(139,92,246,.16); border:1px solid rgba(167,139,250,.38); transition:background .25s ease, opacity .25s ease;
}
.vs-btn:hover{ background:rgba(139,92,246,.28); }
.vs-btn:disabled{ opacity:.4; cursor:default; }
.vs-group{ margin-top:26px; border-top:1px solid rgba(255,255,255,.08); }
.vs-line{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:14px; font-weight:500; color:rgba(255,255,255,.82); }
.vs-desc{ padding:0 0 14px; font-size:11px; line-height:1.6; color:rgba(255,255,255,.38); border-bottom:1px solid rgba(255,255,255,.06); }
.vs-desc.warn{ color:#fca5a5; border-bottom:0; padding-top:10px; }

/* movimento reduzido: pelo sistema operacional OU pela opção "Reduce motion" (body.calm) */
@media (prefers-reduced-motion:reduce){
  .response-text .w{ animation:none; opacity:1; filter:none; }
  .orb{ transition:none; }
  .panel-ui{ transition:none; }
  .siri{ display:none; }
  .ask,.ask.open{ transition:opacity .2s ease, visibility 0s; }
  .orb,.halo,.boot-ring,.header-dot,.wave-ring{ animation:none !important; }
  .vs-dot, .vscreen{ transition:none; }
}
body.calm .response-text .w{ animation:none; opacity:1; filter:none; }
body.calm .orb{ transition:none; }
body.calm .panel-ui{ transition:none; }
body.calm .siri{ display:none; }
body.calm .ask, body.calm .ask.open{ transition:opacity .2s ease, visibility 0s; }
body.calm .orb, body.calm .halo, body.calm .boot-ring, body.calm .header-dot, body.calm .wave-ring{ animation:none !important; }
body.calm .vs-dot, body.calm .vscreen{ transition:none; }
</style>
</head>
<body>

<div class="void"></div>
<div class="orb-bleed" id="bleed"></div>

<!-- BOOT -->
<div id="boot">
  <img class="boot-word" src="../assets/orion_ai_wordmark.png" alt="ORION AI">
  <div class="boot-ring-wrap">
    <div class="boot-ring"></div>
    <div class="boot-ring"></div>
  </div>
  <p class="boot-status" id="bootStatus" data-i18n="boot.init">inicializando</p>
</div>

<!-- APP -->
<div id="app">

  <div class="header">
    <div class="header-dot"></div>
    <img class="header-logo" src="../assets/orion_ai_wordmark.png" alt="ORION AI">
    <div class="header-dot"></div>
  </div>

  <div class="stage">
    <div class="orb-zone" id="orbZone">
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="halo" id="halo"></div>
      <div class="orb" id="orb">
        <canvas class="orb-canvas" id="orbCanvas"></canvas>
        <div class="glass-hi"></div>
        <div class="glass-rim"></div>
        <div class="panel-bg"></div>
        <div class="panel-ui" id="panelUi">
          <div class="answer-scroll" id="answerScroll" aria-live="polite">
            <div class="answer-gallery" id="answerGallery" hidden></div>
            <p class="response-text" id="responseText"></p>
          </div>
          <a class="answer-source" id="answerSource" target="_blank" rel="noopener noreferrer" hidden></a>
        </div>
      </div>
    </div>
  </div>

  <div class="status">
    <span class="status-text" id="statusText"></span>
  </div>

  <div class="siri" id="siri" aria-hidden="true"></div>

  <form class="ask" id="askForm" autocomplete="off" aria-hidden="true">
    <input class="ask-input" id="askInput" type="text" tabindex="-1" maxlength="2000" enterkeyhint="send"
           placeholder="Pergunte ou dê um comando ao ORION" aria-label="Pergunta ao ORION" data-i18n-ph="ask.ph" data-i18n-label="ask.aria">
    <button class="ask-mic" id="micBtn" type="button" aria-label="Falar" title="Falar" tabindex="-1" data-i18n-aria="mic.aria">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/></svg>
    </button>
    <button class="ask-send" id="askSend" type="submit" aria-label="Enviar" tabindex="-1" data-i18n-aria="send.aria">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="hint">
    <span class="hint-text" id="hintText" data-i18n="hint.base">toque na orb para falar · ou use o botão de chat</span>
  </div>

</div>

<!-- V4.5.0 — Voice & Speech -->
<section class="vscreen" id="voiceScreen" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="vsTitle">
  <header class="vs-top">
    <button class="vs-back" id="vsBack" aria-label="Voltar às configurações" title="Voltar" data-i18n-aria="vs.back">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 id="vsTitle" data-i18n="vs.title">Voz &amp; Fala</h2>
  </header>
  <div class="vs-scroll">
    <div class="vs-orbwrap">
      <div class="vs-zone" id="vsOrb" role="button" tabindex="0" aria-label="Ouvir prévia da voz" data-i18n-aria="vs.orbAria">
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <div class="wave-ring"></div>
        <div class="halo" id="vsHalo"></div>
        <div class="orb" id="vsSphere">
          <canvas class="orb-canvas" id="vsDisc"></canvas>
          <div class="glass-hi"></div>
          <div class="glass-rim"></div>
        </div>
      </div>
    </div>

    <div class="vs-row"><span data-i18n="vs.voice">Voz</span><span class="vs-note" id="vsEngine"></span></div>
    <div class="vs-dots" id="vsDots" role="radiogroup" aria-label="Voz" data-i18n-aria="vs.voice">
      <button class="vs-dot" type="button" role="radio" aria-checked="false" data-slot="1">1</button>
      <button class="vs-dot" type="button" role="radio" aria-checked="false" data-slot="2">2</button>
      <button class="vs-dot" type="button" role="radio" aria-checked="false" data-slot="3">3</button>
      <button class="vs-dot" type="button" role="radio" aria-checked="false" data-slot="4">4</button>
    </div>

    <div class="vs-slider">
      <div class="vs-slider-head"><label for="vsPace" data-i18n="vs.pace">Ritmo</label><output id="vsPaceVal" for="vsPace"></output></div>
      <input class="vs-range" id="vsPace" type="range" min="0.8" max="1.2" step="0.01" value="1">
      <div class="vs-ends"><span data-i18n="vs.slow">Mais lenta</span><span data-i18n="vs.fast">Mais rápida</span></div>
    </div>
    <div class="vs-slider">
      <div class="vs-slider-head"><label for="vsExpr" data-i18n="vs.expr">Expressividade</label><output id="vsExprVal" for="vsExpr"></output></div>
      <input class="vs-range" id="vsExpr" type="range" min="0" max="1" step="0.01" value="0.5">
      <div class="vs-ends"><span data-i18n="vs.calm">Calma</span><span data-i18n="vs.expressive">Expressiva</span></div>
    </div>

    <button class="vs-wake" id="vsWake" type="button" aria-pressed="false">Hey ORION</button>

    <p class="vs-msg" id="vsMsg" role="status"></p>
  </div>
</section>

<button class="gear chat-btn" id="chatBtn" aria-label="Perguntar ao ORION" aria-pressed="false" title="Perguntar ao ORION ( / )" data-i18n-aria="chat.aria">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.6-.8L3 21l1.9-5.1A8.4 8.4 0 0 1 3 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5z"/></svg>
</button>
<button class="gear" id="gearBtn" aria-label="Configurações" title="Configurações (Ctrl + ,)" data-i18n-aria="gear.aria">
  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
</button>
<div class="version-tag" id="versionTag" data-i18n="version">VERSÃO V4.5.0</div>


<script type="module">
/* Login real (Firebase): sem usuário logado, volta ao index.html.
   Expõe o token do usuário para o provedor do backend. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const auth = getAuth(initializeApp({
  apiKey: "AIzaSyApS5PXcQvApRfjCsEkqqktinwXF29ViHg",
  authDomain: "orion-ai-b8d39.firebaseapp.com",
  projectId: "orion-ai-b8d39",
  storageBucket: "orion-ai-b8d39.firebasestorage.app",
  messagingSenderId: "1087684319550",
  appId: "1:1087684319550:web:d5b20c93c2e3179de5f46f",
}));

let ready;
window.ORION_AUTH_READY = new Promise(r => { ready = r; });
onAuthStateChanged(auth, user => {
  window.ORION_USER = user;
  ready();
  if (!user) location.replace('../index.html');
});
window.ORION_GET_TOKEN = async () => {
  await window.ORION_AUTH_READY;
  return auth.currentUser ? auth.currentUser.getIdToken() : '';
};
window.ORION_SIGNOUT = async () => {
  try { await signOut(auth); } catch (_) {}
  location.replace('../index.html');
};
</script>
<script defer src="js/app.js?v=4.5.0r2"></script>
