<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../standby.js" data-mount></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<meta name="theme-color" content="#000000">
<script>
/* V5.0: tema salvo neste navegador (só em orion.html): indigo (padrão) · midnight (Dark Blue) · purple (Deep Purple). Aplicado antes de pintar a tela. */
try{var s=JSON.parse(localStorage.getItem('orion_settings')||'{}');document.documentElement.dataset.theme=['indigo','midnight','purple'].indexOf(s.theme)>-1?s.theme:'indigo'}catch(e){document.documentElement.dataset.theme='indigo'}
</script>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://orion-backend-9qk5.onrender.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* ═══════ ORION AI V5.0 — Cosmic Indigo + Absolute Black (temas: Dark Blue e Deep Purple) ═══════
   A Orb mantém o desenho e a cor originais (--core-a/b/c são escritos ao vivo pelo app.js).
   O índigo da interface (botões, menus, superfícies) é mais escuro e sem brilho. */
:root{
  --font:'Sora', -apple-system, 'Helvetica Neue', sans-serif;
  --font-mono:'Space Grotesk', 'Inter', sans-serif;
  --orb:clamp(190px, 32vmin, 320px);
  --halo:calc(var(--orb) * 1.9);
  --core-a:#3A3678; --core-b:#1C1A40; --core-c:#6A63B0;
  color-scheme:dark;
  --bg:#000000; --fg:#E4E2EE; --fg2:#8B89A3; --w:228,226,238;
  --ok:#22C55E; --err:#EF4444; --danger:#EF4444;
  --r-lg:24px; --r-md:16px; --ease:cubic-bezier(.16,.9,.24,1);
  --orb-mid:rgba(0,0,0,.88); --orb-end:rgba(0,0,0,.96); --orb-inset:rgba(0,0,0,.7);
  --surface:#07070D; --surface2:#040408; --line:#1A192B;
  --active:#17153A; --active-hover:#1F1D4A;
  --acc:78,72,150; --act:7,7,14; --act-hi:23,21,58;
  --accent:#5F59A8; --accent-soft:#8E8BB4; --accent-text:#C9C7DC;
  --card:rgba(var(--act),.96); --card-solid:var(--surface);
  --panel-bg:rgba(6,6,12,.98); --ask-bg:rgba(7,7,14,.84); --track-b:#0C0C16;
  /* módulos: tamanho do painel em que a Orb se transforma */
  --mod-s:clamp(10px,3vw,40px); --mod-t:78px; --mod-b:78px; --mod-r:30px; --arc-gap:9px;
}
/* Dark Blue (azul escuro / preto) */
:root[data-theme="midnight"]{
  --surface:#06090F; --surface2:#030508; --line:#142033; --active:#10203F; --active-hover:#172B52;
  --acc:52,90,150; --act:6,9,15; --act-hi:16,30,60; --accent:#4A78B5; --accent-soft:#86A0C4; --track-b:#080C14;
}
/* Deep Purple (roxo escuro / preto) */
:root[data-theme="purple"]{
  --surface:#0A060F; --surface2:#050308; --line:#1F1531; --active:#25143F; --active-hover:#301A52;
  --acc:98,68,158; --act:10,6,15; --act-hi:34,20,62; --accent:#7656B0; --accent-soft:#A290C4; --track-b:#0C0813;
}
html,body{ width:100vw; height:100dvh; overflow:hidden; background:var(--bg); font-family:var(--font); color:var(--fg); -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; }
.void{ position:fixed; inset:0; background:var(--bg); z-index:0; }
.orb-bleed{ display:none; }
body{ transition:opacity .3s ease; }
html.theme-swap body{ opacity:0; transition-duration:.2s; }

/* ═══════ BOOT ═══════ */
#boot{ position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .67s ease; }
#boot.out{ opacity:0; pointer-events:none; }
.boot-word{ width:min(190px, 56vw); height:auto; margin-bottom:24px; filter:drop-shadow(0 0 14px rgba(119,112,184,.22)); }
.boot-ring-wrap{ position:relative; width:76px; height:76px; margin-bottom:46px; }
.boot-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(119,112,184,.18); border-top-color:rgba(119,112,184,.75); animation:bootspin 1.1s linear infinite; }
.boot-ring:nth-child(2){ inset:14px; border-top-color:rgba(119,112,184,.45); animation-duration:1.6s; animation-direction:reverse; }
@keyframes bootspin{ to{ transform:rotate(360deg); } }

/* ═══════ APP ═══════ */
#app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity .75s ease; }
#app.on{ opacity:1; }

/* canto superior esquerdo: logo + wordmark */
.header{ position:absolute; top:0; left:0; display:flex; align-items:center; gap:11px; padding:16px;   /* mesma margem no topo e à esquerda: logo + wordmark centralizados no canto */ pointer-events:none; user-select:none; z-index:3; }
.header-mark{ width:clamp(36px,5.8vmin,46px); height:auto; flex:none; }
.header-logo{ width:clamp(150px,21vmin,205px); height:auto; }
/* Desktop: o painel começa em max(232px,17vw) (arco 12px antes dele). A logo ocupa só o que sobra à esquerda, com folga de 9px. */
@media (min-width:1100px){
  .header-mark{ width:40px; }
  .header-logo{ width:min(calc(max(232px, 17vw) - 88px), 235px); }
}

/* ═══════ STAGE / ORB (desenho original) ═══════ */
.stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.orb-zone{ position:relative; width:var(--halo); height:var(--halo); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .9s cubic-bezier(.2,.7,.2,1); }
.halo{
  --arc-w:1.5px;
  position:absolute; width:84%; height:84%; border-radius:50%;   /* arco interno */
  background:conic-gradient(from 0deg,
    transparent 0%, color-mix(in srgb, var(--core-c) 70%, transparent) 20%,
    color-mix(in srgb, var(--core-a) 85%, transparent) 42%,
    color-mix(in srgb, var(--core-b) 55%, transparent) 62%,
    color-mix(in srgb, var(--core-a) 60%, transparent) 78%, transparent 94%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - var(--arc-w)), #fff calc(100% - var(--arc-w)));
  mask:radial-gradient(farthest-side, transparent calc(100% - var(--arc-w)), #fff calc(100% - var(--arc-w)));
  transition:opacity .6s ease, filter .6s ease; opacity:.8;
}
.halo.fast{ opacity:1; }
.halo.halo2{   /* arco externo: maior, mais fino e mais sutil; mesmo centro, também circular */
  --arc-w:1.25px; width:100%; height:100%; transform:none;
  background:conic-gradient(from 140deg,
    transparent 0%, color-mix(in srgb, var(--core-c) 75%, transparent) 16%,
    color-mix(in srgb, var(--core-a) 55%, transparent) 36%, transparent 48%,
    color-mix(in srgb, var(--core-c) 65%, transparent) 66%,
    color-mix(in srgb, var(--core-a) 50%, transparent) 82%, transparent 94%);
  opacity:.78;
}
.halo.halo2.fast{ opacity:.95; }
.orb-zone:hover .halo, .vs-zone:hover .halo{ opacity:.92; filter:brightness(1.08); }
.orb-zone:hover .halo.halo2{ opacity:.9; }
.wave-ring{
  position:absolute; left:50%; top:50%; border-radius:50%; width:var(--orb); height:var(--orb);
  transform:translate(-50%, calc(-50% + var(--orb-y, 0px))) scale(1);
  border:1px solid color-mix(in srgb, var(--core-c) 70%, transparent); opacity:0; pointer-events:none;
}
.orb{
  position:relative; flex:none; width:var(--orb); height:var(--orb); border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 34% 30%,
    color-mix(in srgb, var(--core-c) 12%, transparent) 0%,
    color-mix(in srgb, var(--core-a) 6%, transparent) 32%,
    var(--orb-mid) 68%, var(--orb-end) 100%);
  border:1px solid color-mix(in srgb, var(--core-a) 28%, transparent);
  box-shadow:
    0 0 60px color-mix(in srgb, var(--core-a) 30%, transparent),
    0 0 130px color-mix(in srgb, var(--core-b) 22%, transparent),
    inset 0 0 60px var(--orb-inset),
    inset 0 1px 0 rgba(var(--w),.12);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  transform:translateY(var(--orb-y,0px)) scale(var(--orb-s,1));
  transition:box-shadow .9s ease, filter .6s ease, opacity .45s ease,
    width .6s cubic-bezier(.16,.9,.24,1), height .6s cubic-bezier(.16,.9,.24,1), border-radius .6s cubic-bezier(.16,.9,.24,1);
  will-change:transform; z-index:1;
}
.orb-zone:hover .orb{
  filter:brightness(1.06);
  box-shadow:
    0 0 78px color-mix(in srgb, var(--core-a) 40%, transparent),
    0 0 150px color-mix(in srgb, var(--core-b) 28%, transparent),
    inset 0 0 60px var(--orb-inset), inset 0 1px 0 rgba(var(--w),.14);
}
.orb.st-listening{ filter:brightness(1.08); }
.orb.st-thinking{ filter:brightness(1.03); }
.orb.st-speaking{ filter:brightness(1.12); }
.orb.st-error{ filter:brightness(.62); animation:orberr .42s ease; }
@keyframes orberr{ 0%,100%{ translate:0 0; } 25%{ translate:-4px 0; } 60%{ translate:4px 0; } 85%{ translate:-1px 0; } }
.orb-canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; mix-blend-mode:screen; }
.glass-hi{ position:absolute; top:6%; left:9%; width:44%; height:38%; border-radius:50%;
  background:radial-gradient(ellipse at 38% 32%, rgba(255,255,255,.18) 0%, rgba(255,255,255,.04) 46%, transparent 74%);
  transform:rotate(-22deg); pointer-events:none; z-index:2; }
.glass-rim{ position:absolute; bottom:6%; right:8%; width:24%; height:12%; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,.06) 0%, transparent 72%); pointer-events:none; z-index:2; }
.orb-canvas, .glass-hi, .glass-rim{ transition:opacity .45s ease; }
.panel-bg{ position:absolute; inset:0; z-index:1; background:var(--panel-bg); opacity:0; transition:opacity .35s ease; pointer-events:none; }

.status{ position:absolute; left:0; right:0; top:calc(50% + var(--halo)/2 + 30px); display:flex; justify-content:center; pointer-events:none; }
.status-text{
  font-size:11px; font-weight:500; letter-spacing:.24em; text-transform:uppercase; color:rgba(var(--w),.78);
  opacity:0; transform:translateY(4px); transition:opacity .3s ease, transform .3s ease;
  text-align:center; max-width:min(520px, 90vw); line-height:1.7;
}
.status-text.show{ opacity:1; transform:translateY(0); }
.status[data-state="error"] .status-text.show{ color:#F87171; }
.status[data-state="speaking"] .status-text.show, .status[data-state="listening"] .status-text.show{ color:var(--accent-soft); }

.hint{ position:absolute; left:0; right:0; bottom:clamp(30px, 7vh, 64px); display:flex; justify-content:center; pointer-events:none; }
.hint-text{ font-size:10px; font-weight:500; letter-spacing:.32em; text-transform:uppercase; color:rgba(var(--w),.5); transition:opacity .6s ease; text-align:center; padding:0 16px; line-height:1.8; }
body.chat-open .hint-text{ opacity:0; }
.version-tag{ position:fixed; left:clamp(14px,3vw,28px); bottom:clamp(20px,3.4vh,28px); z-index:40; font:500 9px var(--font-mono); letter-spacing:.22em; text-transform:uppercase; color:rgba(var(--w),.4); user-select:none; pointer-events:none; }
@media (max-width:760px){ .hint{ bottom:84px; } }

/* ═══════ DOCK: Chat · Código/API · Multitarefa · Configurações ═══════ */
.dock{
  position:fixed; right:clamp(12px,2.4vw,24px); bottom:clamp(14px,2.6vh,22px); z-index:40; display:flex; align-items:center; gap:2px; padding:5px;
  border-radius:999px; background:rgba(7,7,14,.82); border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,.55);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.dock-sep{ width:1px; height:18px; margin:0 3px; background:var(--line); }
.dock-btn{
  width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:rgba(var(--w),.55); background:transparent; transition:color .2s ease, background .2s ease, transform .2s ease;
}
.dock-btn:hover{ color:var(--fg); background:rgba(var(--act-hi),.7); }
.dock-btn:active{ transform:scale(.94); }
.dock-btn.on{ color:var(--fg); background:var(--active); box-shadow:inset 0 0 0 1px rgba(var(--acc),.4); }
.dock-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
@media (max-width:760px){ .dock-btn{ width:38px; height:38px; } }

/* ═══════ legenda de resposta (Chat) ═══════ */
body.chat-open .orb-zone:not(.panel-open){ transform:scale(.78); }
.orb-zone.panel-open{ cursor:default; }
.orb-zone.panel-open .halo, .orb-zone.panel-open .wave-ring{ opacity:0 !important; }
.status{ transition:top .8s cubic-bezier(.16,.9,.24,1); }
.cap{ position:absolute; z-index:6; left:50%; top:calc(50% + var(--orb)/2 + 30px); width:min(560px,90vw); max-height:calc(50% - var(--orb)/2 - 110px);
  transform:translate(-50%,6px); display:flex; flex-direction:column; align-items:center; text-align:center; opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .35s ease, transform .35s ease, visibility 0s linear .35s; }
.cap.show{ opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%,0); transition:opacity .35s ease, transform .35s ease, visibility 0s; }
.answer-scroll{ flex:1 1 auto; min-height:0; width:100%; overflow-y:auto; padding:2px 6px 8px; text-align:center; scrollbar-width:thin; scrollbar-color:rgba(var(--acc),.35) transparent; }
.answer-scroll.scrolls{ -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); }
.response-text{ font-size:clamp(14px, 2.1vmin, 17px); font-weight:600; line-height:1.75; letter-spacing:.02em; color:rgba(var(--w),.94); text-shadow:0 0 22px color-mix(in srgb, var(--core-c) 38%, transparent); }
.response-text .w{ display:inline-block; opacity:0; filter:blur(5px); animation:wordin .45s ease forwards; }
@keyframes wordin{ to{ opacity:1; filter:blur(0); } }
.cap.answer-error .response-text{ font-size:13px; letter-spacing:.06em; color:#F87171; text-shadow:none; }
.answer-gallery{ display:flex; gap:10px; justify-content:center; margin:0 auto 14px; }
.answer-gallery[hidden]{ display:none; }
.answer-gallery img{ flex:1 1 0; min-width:0; height:140px; object-fit:cover; border-radius:14px; border:1px solid var(--line); opacity:0; transition:opacity .5s ease; }
.answer-gallery img.loaded{ opacity:1; }
.answer-gallery img:only-child{ flex:none; height:auto; max-height:180px; max-width:100%; object-fit:contain; }
@media (max-width:520px){ .answer-gallery img{ height:100px; } }
.cap .answer-gallery img{ height:84px; } .cap .answer-gallery img:only-child{ max-height:110px; }
.answer-source{
  flex:none; align-self:center; margin:0 0 10px; padding:7px 14px; border-radius:999px; font:500 10px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  color:var(--accent-soft); border:1px solid rgba(var(--acc),.32); background:rgba(var(--act-hi),.9); transition:background .2s ease;
}
.answer-source:hover{ background:var(--active-hover); }
.answer-source:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.answer-source[hidden]{ display:none; }

/* ═══════ campo de pergunta ═══════ */
.ask{
  position:absolute; left:50%; z-index:5; bottom:16px; width:min(660px, 90vw); height:52px; padding:0 6px;
  display:flex; align-items:center; gap:4px; border-radius:999px; background:var(--ask-bg); border:1px solid var(--line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  opacity:0; visibility:hidden; pointer-events:none; transform:translate(-50%, 70vh) scale(.92);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease, border-color .25s ease, box-shadow .25s ease, visibility 0s linear .9s;
}
.ask.open{ opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%, 0) scale(1); transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease .08s, border-color .25s ease, box-shadow .25s ease, visibility 0s; }
.ask:focus-within{ border-color:rgba(var(--acc),.6); box-shadow:0 0 0 3px rgba(var(--act-hi),.8); }
.ask-input{ flex:1; min-width:0; height:100%; padding-left:8px; background:none; border:0; outline:none; color:var(--fg); font:500 14px var(--font); letter-spacing:.03em; }
.ask-input::placeholder{ color:rgba(var(--w),.45); }
.ask-input:disabled{ opacity:.55; }
.ask-send, .ask-mic, .ask-plus{ width:38px; height:38px; border-radius:50%; border:0; cursor:pointer; flex:none; display:flex; align-items:center; justify-content:center; transition:filter .2s ease, opacity .2s ease, color .2s ease, background .2s ease; }
.ask-send{ color:var(--fg); background:var(--active); }
.ask-mic, .ask-plus{ color:rgba(var(--w),.62); background:transparent; }
.ask-mic:hover, .ask-plus:hover{ color:var(--fg); background:rgba(var(--act-hi),.8); }
.ask-send:hover{ filter:brightness(1.25); }
.ask-send:active, .ask-mic:active, .ask-plus:active{ filter:brightness(.9); }
.ask-send:disabled, .ask-mic:disabled, .ask-plus:disabled{ opacity:.35; cursor:default; }
.ask-mic.live{ color:var(--fg); background:var(--active); }
.ask-send:focus-visible, .ask-mic:focus-visible, .ask-plus:focus-visible, .attach-del:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.attach-chip{ position:absolute; left:14px; bottom:calc(100% + 10px); max-width:calc(100% - 28px); display:flex; align-items:center; gap:8px; padding:5px 6px; border-radius:18px; background:var(--ask-bg); border:1px solid var(--line); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
.attach-chip[hidden]{ display:none; }
.attach-thumb{ width:28px; height:28px; flex:none; border-radius:9px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--accent); }
.attach-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.attach-thumb svg{ width:18px; height:18px; }
.attach-name{ font:500 11px var(--font-mono); letter-spacing:.06em; color:rgba(var(--w),.85); max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.attach-del{ width:22px; height:22px; flex:none; border-radius:50%; border:0; cursor:pointer; color:rgba(var(--w),.65); background:rgba(var(--w),.08); font:600 14px/1 var(--font); transition:background .2s ease, color .2s ease; }
.attach-del:hover{ background:rgba(var(--w),.18); color:var(--fg); }
.attach-del:disabled{ opacity:.4; cursor:default; }
@media (max-width:760px){ .ask{ bottom:76px; } }
.siri{
  position:fixed; left:0; right:0; bottom:0; height:55vh; z-index:4; pointer-events:none; opacity:0; transform:translateY(100%); filter:blur(22px);
  background:
    radial-gradient(55% 60% at 18% 100%, rgba(var(--act-hi),.60), transparent 72%),
    radial-gradient(55% 62% at 50% 100%, rgba(var(--act-hi),.70), transparent 72%),
    radial-gradient(55% 60% at 84% 100%, rgba(var(--act),.70), transparent 72%);
}
.siri.play{ animation:siri 1.7s cubic-bezier(.2,.75,.2,1) forwards; }
@keyframes siri{ 0%{ opacity:0; transform:translateY(100%); } 30%{ opacity:1; } 62%{ opacity:.9; transform:translateY(8%); } 100%{ opacity:0; transform:translateY(-6%); } }

/* ═══════════════════════════════════════════════════════════════
   MÓDULOS — Orb Adaptive Interface
   Configurações, ORION Code/API e Multitarefa: a Orb se transforma num painel de cantos amplos que ocupa
   quase toda a tela, e o arco (.orb-arc) passa a acompanhar a curva do painel.
   O conteúdo (.settings-card) fica exatamente sobre a Orb e aparece depois que ela termina de se abrir.
   ═══════════════════════════════════════════════════════════════ */
@property --arc{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
@keyframes frameArc{ to{ --arc:360deg; } }

.orb.panel{ animation:none !important; filter:none !important; cursor:default; }
.orb.panel .orb-canvas, .orb.panel .glass-hi, .orb.panel .glass-rim{ opacity:0; }
.orb.panel .panel-bg{ opacity:1; }
.orb.module{
  width:calc(100vw - 2 * var(--mod-s)); height:calc(100dvh - var(--mod-t) - var(--mod-b)); border-radius:var(--mod-r);
  border-color:rgba(var(--acc),.2);
  box-shadow:0 30px 90px rgba(0,0,0,.8), inset 0 1px 0 rgba(var(--w),.04);
}
/* o arco: um contorno que acompanha o formato do painel (esfera → círculo; painel → retângulo arredondado) */
.orb-arc{
  position:absolute; left:50%; top:50%; width:var(--orb); height:var(--orb); transform:translate(-50%,-50%);
  border-radius:50%; opacity:0; pointer-events:none; z-index:0;
  transition:width .6s cubic-bezier(.16,.9,.24,1), height .6s cubic-bezier(.16,.9,.24,1), border-radius .6s cubic-bezier(.16,.9,.24,1), opacity .4s ease;
}
.orb-arc::before{
  content:""; position:absolute; inset:0; border-radius:inherit; padding:2px;
  background:conic-gradient(from var(--arc),
    transparent 0%,
    color-mix(in srgb, var(--core-a) 85%, transparent) 14%,
    color-mix(in srgb, var(--core-b) 60%, transparent) 34%,
    transparent 52%,
    color-mix(in srgb, var(--core-a) 45%, transparent) 72%,
    transparent 90%);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);

<script type="module">
/* Login real (Firebase): sem usuário logado, volta ao index.html com a mesma transição da entrada.
   Expõe o token do usuário para o provedor do backend. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const auth = getAuth(initializeApp({
  apiKey: "AIzaSyBpYSGxHqD_XbZszZiF5HbN-pIZOaveh9s",
  authDomain: "orion-ai-b8d39.firebaseapp.com",
  projectId: "orion-ai-b8d39",
  storageBucket: "orion-ai-b8d39.firebasestorage.app",
  messagingSenderId: "1087684319550",
  appId: "1:1087684319550:web:d5b20c93c2e3179de5f46f",
}));

let leaving = false;
function leave() {
  if (leaving) return;
  leaving = true;
  const o = document.createElement('div');   // mesmos círculos da tela de entrada
  o.id = 'leaveOverlay';
  o.innerHTML = '<img class="boot-word" src="../assets/orion_ai_wordmark.png" alt="ORION AI"><div class="boot-ring-wrap"><div class="boot-ring"></div><div class="boot-ring"></div></div>';
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add('on'));
  setTimeout(() => { location.replace('../index.html'); }, 1000);
}

let ready;
window.ORION_AUTH_READY = new Promise(r => { ready = r; });
onAuthStateChanged(auth, user => {
  window.ORION_USER = user;
  ready();
  if (!user) leave();
});
window.ORION_GET_TOKEN = async () => {
  await window.ORION_AUTH_READY;
  return auth.currentUser ? auth.currentUser.getIdToken() : '';
};
window.ORION_SIGNOUT = async () => {
  try { localStorage.removeItem('orion_used'); } catch (_) {}   // ao sair, a frase de boas-vindas volta na próxima entrada
  try { await signOut(auth); } catch (_) {}
  leave();
};
</script>
