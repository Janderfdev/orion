<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<link rel="icon" href="../favicon.png">
<script>
/* Durante o standby (01/10 22:10 → 02/10 10:10) esta página volta ao index.html.
   O login é verificado pelo Firebase (script no fim da página). */
(function () {
  const S = new Date('2026-10-01T22:10:00-03:00').getTime();
  const E = new Date('2026-10-02T10:10:00-03:00').getTime();
  const t = Date.now();
  if (t >= S && t < E) location.replace('../index.html');
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&family=Space+Grotesk:wght@300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --font:      'Inter', -apple-system, 'Helvetica Neue', sans-serif;
  --font-mono: 'Space Grotesk', 'Inter', sans-serif;
  --orb:  clamp(190px, 32vmin, 320px);
  --halo: calc(var(--orb) * 1.9);
  /* cor "ao vivo" da Orb — atualizada quadro a quadro por orb.js */
  --core-a: #6d28d9; --core-b: #4c1d95; --core-c: #a78bfa;
}

html,body{
  width:100vw; height:100dvh; overflow:hidden;
  background:#000; font-family:var(--font); color:#fff;
  -webkit-font-smoothing:antialiased;
}

.void{ position:fixed; inset:0; background:#000; z-index:0; }
.orb-bleed{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(circle at 50% 54%, color-mix(in srgb, var(--core-a) 10%, transparent) 0%, transparent 42%);
  transition: opacity 1.2s ease;
  opacity: var(--bleed-op, 1);
}

/* ═══════ BOOT ═══════ */
#boot{
  position:fixed; inset:0; z-index:200; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .67s ease;
}
#boot.out{ opacity:0; pointer-events:none; }
.boot-mark{
  font-family:var(--font-mono); font-size:11px; font-weight:300;
  letter-spacing:0.62em; text-transform:uppercase; color:rgba(255,255,255,0.85);
  margin-bottom:46px; text-indent:0.62em;
}
.boot-version{
  font-family:var(--font-mono); font-size:9px; font-weight:300;
  letter-spacing:0.42em; text-transform:uppercase; color:rgba(167,139,250,0.55);
  margin-bottom:46px; text-indent:0.42em;
}
.boot-ring-wrap{ position:relative; width:76px; height:76px; margin-bottom:46px; }
.boot-ring{
  position:absolute; inset:0; border-radius:50%;
  border:1px solid rgba(167,139,250,0.18);
  border-top-color:rgba(167,139,250,0.75);
  animation:bootspin 1.1s linear infinite;
}
.boot-ring:nth-child(2){ inset:14px; border-top-color:rgba(196,181,253,0.45); animation-duration:1.6s; animation-direction:reverse; }
@keyframes bootspin{ to{ transform:rotate(360deg); } }
.boot-status{
  font-size:9px; font-weight:300; letter-spacing:0.34em; text-transform:uppercase;
  color:rgba(255,255,255,0.5); transition:opacity 0.2s ease;
}

/* ═══════ APP ═══════ */
#app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity .75s ease; }
#app.on{ opacity:1; }

.header{
  position:absolute; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding-top:clamp(28px, 6vh, 56px);
  pointer-events:none; user-select:none;
}
.header-dot{
  width:3px; height:3px; border-radius:50%;
  background:var(--core-c); box-shadow:0 0 8px var(--core-c);
  animation:dotbreathe 4s ease-in-out infinite;
}
@keyframes dotbreathe{ 0%,100%{opacity:0.35;} 50%{opacity:1;} }
.header-word{
  font-family:var(--font); font-size:11px; font-weight:200;
  letter-spacing:0.74em; text-indent:0.74em; text-transform:uppercase;
  color:rgba(255,255,255,0.82);
  text-shadow:0 0 18px rgba(255,255,255,0.10);
}

/* ═══════ STAGE ═══════ */
.stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.orb-zone{
  position:relative; width:var(--halo); height:var(--halo);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}

.halo{
  position:absolute; width:100%; height:100%; border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0%, color-mix(in srgb, var(--core-a) 55%, transparent) 24%,
    color-mix(in srgb, var(--core-b) 40%, transparent) 50%,
    color-mix(in srgb, var(--core-a) 45%, transparent) 74%, transparent 92%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  animation:halospin 24s linear infinite;
  transition:opacity 0.6s ease, filter 0.6s ease;
  opacity:0.55;
}
.halo.fast{ animation-duration:11s; opacity:0.85; }
.orb-zone:hover .halo{ animation-duration:16s; opacity:0.72; filter:brightness(1.18); }
@keyframes halospin{ to{ transform:rotate(360deg); } }

/* anéis de energia — só aparecem enquanto o ORION fala */
.wave-ring{
  position:absolute; left:50%; top:50%; border-radius:50%;
  width:var(--orb); height:var(--orb);
  transform:translate(-50%,-50%) scale(1);
  border:1px solid color-mix(in srgb, var(--core-c) 70%, transparent);
  opacity:0; pointer-events:none;
}
.orb-zone.speaking .wave-ring{ animation:wave-out 2.4s ease-out infinite; }
.orb-zone.speaking .wave-ring:nth-child(2){ animation-delay:0.8s; }
.orb-zone.speaking .wave-ring:nth-child(3){ animation-delay:1.6s; }
@keyframes wave-out{
  0%{ transform:translate(-50%,-50%) scale(1); opacity:0.55; }
  100%{ transform:translate(-50%,-50%) scale(1.55); opacity:0; }
}

.orb{
  position:relative; width:var(--orb); height:var(--orb); border-radius:50%;
  overflow:hidden;
  background:radial-gradient(circle at 34% 30%,
    color-mix(in srgb, var(--core-c) 16%, transparent) 0%,
    color-mix(in srgb, var(--core-a) 8%, transparent) 32%,
    rgba(2,2,8,0.85) 68%, rgba(0,0,0,0.94) 100%);
  border:1px solid color-mix(in srgb, var(--core-a) 30%, transparent);
  box-shadow:
    0 0 60px color-mix(in srgb, var(--core-a) 42%, transparent),
    0 0 130px color-mix(in srgb, var(--core-b) 30%, transparent),
    inset 0 0 60px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.12);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  animation:orbfloat 8.5s ease-in-out infinite, orbbreathe 4.6s ease-in-out infinite;
  transition:box-shadow 0.9s ease, filter 0.6s ease, transform 0.4s ease, opacity .45s ease;
  will-change:transform;
  z-index:1;
}
.orb-zone:hover .orb{
  filter:brightness(1.14);
  box-shadow:
    0 0 78px color-mix(in srgb, var(--core-a) 55%, transparent),
    0 0 150px color-mix(in srgb, var(--core-b) 38%, transparent),
    inset 0 0 60px rgba(0,0,0,0.7),
    inset 0 1px 0 rgba(255,255,255,0.14);
}
.orb.pressed{ transform:scale(1.08) !important; transition:transform 0.15s ease; }
@keyframes orbfloat{ 0%,100%{margin-top:0;} 50%{margin-top:-14px;} }
@keyframes orbbreathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.035);} }
.orb.st-listening{ filter:brightness(1.22); animation:orbfloat 8.5s ease-in-out infinite, orbbreathe 2.6s ease-in-out infinite; }
.orb.st-thinking{ filter:brightness(1.10); animation:orbfloat 8.5s ease-in-out infinite, orbbreathe 1.3s ease-in-out infinite; }
.orb.st-speaking{ filter:brightness(1.30); animation:orbfloat 8.5s ease-in-out infinite, orbbreathe 1.8s ease-in-out infinite; }
.orb.st-error{ filter:brightness(0.62); animation:orberr 0.42s ease; }
@keyframes orberr{ 0%{transform:translateX(0);} 25%{transform:translateX(-7px);} 55%{transform:translateX(6px);} 80%{transform:translateX(-3px);} 100%{transform:translateX(0);} }

.orb-canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; mix-blend-mode:screen; }
.glass-hi{ position:absolute; top:6%; left:9%; width:44%; height:38%; border-radius:50%;
  background:radial-gradient(ellipse at 38% 32%, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.05) 46%, transparent 74%);
  transform:rotate(-22deg); pointer-events:none; z-index:2; }
.glass-rim{ position:absolute; bottom:6%; right:8%; width:24%; height:12%; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,0.08) 0%, transparent 72%); pointer-events:none; z-index:2; }

.status{
  position:absolute; left:0; right:0;
  top:calc(50% + var(--halo)/2 + 30px);
  display:flex; justify-content:center; pointer-events:none;
}
.status-text{
  font-size:10px; font-weight:300; letter-spacing:0.28em; text-transform:uppercase;
  color:rgba(255,255,255,0.55); opacity:0; transform:translateY(4px);
  transition:opacity 0.6s ease, transform 0.6s ease;
  white-space:nowrap;
}
.status-text.show{ opacity:1; transform:translateY(0); }

.hint{
  position:absolute; left:0; right:0; bottom:clamp(30px, 7vh, 64px);
  display:flex; justify-content:center; pointer-events:none;
}
.hint-text{
  font-size:9px; font-weight:200; letter-spacing:0.4em; text-transform:uppercase;
  color:rgba(255,255,255,0.14); transition:opacity 1s ease;
}

.version-tag{
  position:fixed; left:18px; bottom:16px; z-index:40;
  font-family:var(--font-mono); font-size:9px; font-weight:300;
  letter-spacing:0.22em; text-transform:uppercase;
  color:rgba(255,255,255,0.16); user-select:none; pointer-events:none;
}
.mark-tag{
  position:fixed; left:18px; bottom:4px; z-index:40;
  font-family:var(--font-mono); font-size:9px; font-weight:300;
  letter-spacing:0.22em; text-transform:uppercase;
  color:rgba(255,255,255,0.16); user-select:none; pointer-events:none;
}

/* ═══════ SETTINGS (Ctrl + ,) ═══════ */
#settingsPanel{
  position:fixed; inset:0; z-index:150;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.72); backdrop-filter:blur(6px);
  opacity:0; pointer-events:none; transition:opacity 0.35s ease;
}
#settingsPanel.open{ opacity:1; pointer-events:auto; }
.settings-card{
  width:min(330px, 88vw); padding:28px 26px;
  border:1px solid rgba(167,139,250,0.22); border-radius:14px;
  background:rgba(8,8,14,0.92);
  box-shadow:0 0 60px rgba(109,40,217,0.18);
}
.settings-title{
  font-size:10px; font-weight:300; letter-spacing:0.34em; text-transform:uppercase;
  color:rgba(255,255,255,0.6); margin-bottom:22px; text-align:center;
}
.settings-row{
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; font-weight:300; color:rgba(255,255,255,0.75);
  padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06);
}
.settings-row:last-of-type{ border-bottom:none; }
.settings-toggle{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  color:#a78bfa; background:rgba(167,139,250,0.10); border:1px solid rgba(167,139,250,0.3);
  border-radius:20px; padding:5px 12px; cursor:pointer; transition:all 0.25s ease;
}
.settings-toggle:hover{ background:rgba(167,139,250,0.18); }
.settings-hint{
  margin-top:20px; text-align:center; font-size:9px; font-weight:300;
  letter-spacing:0.2em; color:rgba(255,255,255,0.22);
}

/* botão de configurações (canto inferior direito) */
.gear{
  position:fixed; right:16px; bottom:12px; z-index:40;
  width:40px; height:40px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,0.38); background:transparent; border:1px solid transparent;
  transition:color .3s ease, border-color .3s ease, transform .5s ease, background .3s ease;
}
.gear:hover{ color:rgba(255,255,255,0.85); border-color:rgba(167,139,250,0.3); background:rgba(167,139,250,0.08); transform:rotate(60deg); }
.gear:focus-visible{ outline:1px solid #a78bfa; outline-offset:3px; }
.settings-email{ font-size:11px; font-weight:300; color:rgba(255,255,255,0.5); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.settings-out{
  width:100%; margin-top:18px; height:40px; border-radius:20px; cursor:pointer;
  font:300 11px var(--font); letter-spacing:0.22em; text-transform:uppercase;
  color:#f87171; background:rgba(248,113,113,0.07); border:1px solid rgba(248,113,113,0.30);
  transition:background .25s ease;
}
.settings-out:hover{ background:rgba(248,113,113,0.15); }
/* ═══════ V4.2.0 — interação centrada na Orb ═══════ */
.stage{ transition:transform .9s cubic-bezier(.2,.7,.2,1); }
.orb-zone{ transition:transform .9s cubic-bezier(.2,.7,.2,1); }
body.chat-open .orb-zone:not(.card-open){ transform:scale(.78); }   /* a Orb encolhe um pouco enquanto você escreve */

/* resposta: a Orb vira um quadro (vidro + brilho do estado atual) que desce até a faixa acima do campo de pergunta */
.orb-zone.card-open{ pointer-events:none; }
.orb-zone.card-open .halo, .orb-zone.card-open .wave-ring{ opacity:0 !important; }
.orb-zone.card-open .orb{ opacity:0; }
.answer-card{
  position:fixed; z-index:6; left:0; top:0; width:0; height:0;
  display:flex; flex-direction:column; overflow:hidden; border-radius:50%; cursor:pointer;
  background:radial-gradient(circle at 30% 18%, color-mix(in srgb, var(--core-c) 14%, rgba(6,6,14,.94)) 0%, rgba(5,5,12,.94) 72%);
  border:1px solid color-mix(in srgb, var(--core-a) 45%, transparent);
  box-shadow:
    0 0 60px color-mix(in srgb, var(--core-a) 38%, transparent),
    0 0 130px color-mix(in srgb, var(--core-b) 24%, transparent),
    inset 0 0 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  opacity:0; visibility:hidden; pointer-events:none;
  transition:left .8s cubic-bezier(.16,.9,.24,1), top .8s cubic-bezier(.16,.9,.24,1), width .8s cubic-bezier(.16,.9,.24,1),
             height .8s cubic-bezier(.16,.9,.24,1), border-radius .8s cubic-bezier(.16,.9,.24,1),
             opacity .35s ease, box-shadow .9s ease, visibility 0s linear .8s;
}
.answer-card.on{ opacity:1; visibility:visible; pointer-events:auto; transition-property:left, top, width, height, border-radius, opacity, box-shadow, visibility; transition-delay:0s; }
.answer-card.error.on{ animation:orberr .42s ease; }
.answer-scroll{
  flex:1; min-height:0; overflow-y:auto; padding:22px 26px; text-align:center; scrollbar-width:thin;
  scrollbar-color:rgba(167,139,250,.35) transparent; opacity:0; transition:opacity .35s ease;
}
.answer-card.filled .answer-scroll{ opacity:1; }
.answer-card.scrolls .answer-scroll{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
          mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
}
.response-text{
  font-size:clamp(14px, 2.1vmin, 17px); font-weight:300; line-height:1.75; letter-spacing:.02em;
  color:rgba(255,255,255,.92); text-shadow:0 0 22px color-mix(in srgb, var(--core-c) 38%, transparent);
}
.response-text .w{ display:inline-block; opacity:0; filter:blur(5px); animation:wordin .45s ease forwards; }
@keyframes wordin{ to{ opacity:1; filter:blur(0); } }
.answer-card.error .response-text{ font-size:13px; letter-spacing:.06em; color:#fca5a5; text-shadow:0 0 18px rgba(248,113,113,.3); }
.answer-source{
  flex:none; align-self:center; margin:0 0 14px; padding:6px 14px; border-radius:16px;
  font:300 10px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  color:color-mix(in srgb, var(--core-c) 85%, #fff); border:1px solid color-mix(in srgb, var(--core-c) 40%, transparent);
  background:color-mix(in srgb, var(--core-a) 14%, transparent); transition:background .25s ease;
}
.answer-source:hover{ background:color-mix(in srgb, var(--core-a) 30%, transparent); }
.answer-source[hidden]{ display:none; }

/* campo de pergunta: sobe de baixo da tela até a base, acima do rodapé */
.ask{
  position:absolute; left:50%; z-index:5;
  bottom:16px;
  width:min(560px, 88vw); height:48px; padding:0 6px 0 22px;
  display:flex; align-items:center; gap:8px; border-radius:26px;
  background:rgba(8,8,18,.62); border:1px solid color-mix(in srgb, var(--core-a) 38%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translate(-50%, 70vh) scale(.92);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease, border-color .4s ease, box-shadow .4s ease, visibility 0s linear .9s;
}
.ask.open{
  opacity:1; visibility:visible; pointer-events:auto;
  transform:translate(-50%, 0) scale(1);
  box-shadow:0 0 34px color-mix(in srgb, var(--core-a) 28%, transparent);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease .08s, border-color .4s ease, box-shadow .4s ease, visibility 0s;
}
.ask:focus-within{ border-color:color-mix(in srgb, var(--core-c) 75%, transparent); box-shadow:0 0 38px color-mix(in srgb, var(--core-a) 40%, transparent); }
.ask-input{ flex:1; min-width:0; height:100%; background:none; border:0; outline:none; color:#fff; font:300 14px var(--font); letter-spacing:.04em; }
.ask-input::placeholder{ color:rgba(255,255,255,.3); letter-spacing:.06em; }
.ask-input:disabled{ opacity:.5; }
.ask-send{
  width:36px; height:36px; border-radius:50%; border:0; cursor:pointer; color:#fff; flex:none;
  display:flex; align-items:center; justify-content:center;
  background:color-mix(in srgb, var(--core-a) 50%, transparent); transition:filter .3s ease, opacity .3s ease;
}
.ask-send:hover{ filter:brightness(1.3); }
.ask-send:disabled{ opacity:.35; cursor:default; }
.ask-send:focus-visible{ outline:1px solid #a78bfa; outline-offset:3px; }

@media (max-width:760px){
  .ask{ bottom:72px; }
}

/* brilho que sobe da base da tela ao abrir o chat (estilo assistente de voz) */
.siri{
  position:fixed; left:0; right:0; bottom:0; height:55vh; z-index:4; pointer-events:none;
  opacity:0; transform:translateY(100%); filter:blur(22px);
  background:
    radial-gradient(55% 60% at 18% 100%, rgba(29,78,216,.70), transparent 72%),
    radial-gradient(55% 62% at 50% 100%, color-mix(in srgb, var(--core-a) 80%, transparent), transparent 72%),
    radial-gradient(55% 60% at 84% 100%, rgba(74,222,128,.38), transparent 72%);
}
.siri.play{ animation:siri 1.7s cubic-bezier(.2,.75,.2,1) forwards; }
@keyframes siri{
  0%{ opacity:0; transform:translateY(100%); }
  30%{ opacity:1; }
  62%{ opacity:.9; transform:translateY(8%); }
  100%{ opacity:0; transform:translateY(-6%); }
}

/* botão de chat (ao lado do ⚙) */
.chat-btn{ right:60px; }
.chat-btn:hover{ transform:translateY(-2px); }
.chat-btn.on{ color:#fff; border-color:rgba(167,139,250,.45); background:rgba(167,139,250,.14); }
.settings-select{
  max-width:160px; font:300 11px var(--font-mono); color:#a78bfa; background:rgba(167,139,250,.10);
  border:1px solid rgba(167,139,250,.3); border-radius:20px; padding:5px 10px; outline:none; cursor:pointer;
}
.settings-select option{ background:#0b0b14; color:#fff; }
@media (prefers-reduced-motion:reduce){ .response-text .w{ animation:none; opacity:1; filter:none; } .siri{ display:none; } .ask,.ask.open{ transition:opacity .2s ease, visibility 0s; } .answer-card{ transition:opacity .2s ease; } }
@media (prefers-reduced-motion:reduce){
  .orb,.halo,.boot-ring,.header-dot,.wave-ring{ animation:none !important; }
}
</style>
</head>
<body>

<div class="void"></div>
<div class="orb-bleed" id="bleed"></div>

<!-- BOOT -->
<div id="boot">
  <p class="boot-mark">ORION AI</p>
  <div class="boot-ring-wrap">
    <div class="boot-ring"></div>
    <div class="boot-ring"></div>
  </div>
  <p class="boot-status" id="bootStatus">inicializando</p>
</div>

<!-- APP -->
<div id="app">

  <div class="header">
    <div class="header-dot"></div>
    <span class="header-word">ORION AI</span>
    <div class="header-dot"></div>
  </div>

  <div class="stage">
    <div class="orb-zone" id="orbZone">
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="halo" id="halo"></div>
      <div class="orb" id="orb">
        <canvas class="orb-canvas" id="orbCanvas"></canvas>
        <div class="glass-hi"></div>
        <div class="glass-rim"></div>
      </div>
    </div>
  </div>

  <div class="status">
    <span class="status-text" id="statusText"></span>
  </div>

  <div class="answer-card" id="answerCard" role="status" aria-live="polite" title="Toque para fechar">
