<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --font:      'Sora', -apple-system, 'Helvetica Neue', sans-serif;
  --font-mono: 'Space Grotesk', 'Inter', sans-serif;
  --orb:  clamp(190px, 32vmin, 320px);
  --halo: calc(var(--orb) * 1.9);
  --panel-w: min(550px, 90vw);
  --panel-h: clamp(280px, 58vh, 400px);
  /* cor "ao vivo" da Orb — atualizada quadro a quadro por orb.js (a constelação V10 lê estas mesmas variáveis) */
  --core-a: #5b21b6; --core-b: #2e1065; --core-c: #8b5cf6;
}

html,body{
  width:100vw; height:100dvh; overflow:hidden;
  background:#000; font-family:var(--font); color:#fff;
  -webkit-font-smoothing:antialiased;
}

.void{ position:fixed; inset:0; background:#000; z-index:0; }
.orb-bleed{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: radial-gradient(circle at 50% 54%, color-mix(in srgb, var(--core-a) 10%, transparent) 0%, transparent 42%);
  transition: opacity 1.2s ease;
  opacity: var(--bleed-op, 1);
}

/* ═══════ BOOT ═══════ */
#boot{
  position:fixed; inset:0; z-index:200; background:#000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .67s ease;
}
#boot.out{ opacity:0; pointer-events:none; }
.boot-mark{
  font-family:var(--font-mono); font-size:11px; font-weight:500;
  letter-spacing:0.62em; text-transform:uppercase; color:rgba(255,255,255,0.85);
  margin-bottom:46px; text-indent:0.62em;
}
.boot-word{ width:min(190px, 56vw); height:auto; margin-bottom:24px; filter:drop-shadow(0 0 14px rgba(120,100,255,.28)); }
.boot-version{
  font-family:var(--font-mono); font-size:9px; font-weight:500;
  letter-spacing:0.42em; text-transform:uppercase; color:rgba(167,139,250,0.55);
  margin-bottom:46px; text-indent:0.42em;
}
.boot-ring-wrap{ position:relative; width:76px; height:76px; margin-bottom:46px; }
.boot-ring{
  position:absolute; inset:0; border-radius:50%;
  border:1px solid rgba(167,139,250,0.18);
  border-top-color:rgba(167,139,250,0.75);
  animation:bootspin 1.1s linear infinite;
}
.boot-ring:nth-child(2){ inset:14px; border-top-color:rgba(196,181,253,0.45); animation-duration:1.6s; animation-direction:reverse; }
@keyframes bootspin{ to{ transform:rotate(360deg); } }
.boot-status{
  font-size:9px; font-weight:500; letter-spacing:0.34em; text-transform:uppercase;
  color:rgba(255,255,255,0.5); transition:opacity 0.2s ease;
}

/* ═══════ APP ═══════ */
#app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity .75s ease; }
#app.on{ opacity:1; }

/* V10 — a constelação vive solta na tela (fora da Orb), com a paleta viva da Orb */
#universe{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }

.header{
  position:absolute; top:0; left:0; right:0;
  display:flex; align-items:center; justify-content:center; gap:14px;
  padding-top:clamp(28px, 6vh, 56px);
  pointer-events:none; user-select:none;
}
.header-dot{
  width:3px; height:3px; border-radius:50%;
  background:var(--core-c); box-shadow:0 0 8px var(--core-c);
  animation:dotbreathe 4s ease-in-out infinite;
}
@keyframes dotbreathe{ 0%,100%{opacity:0.35;} 50%{opacity:1;} }
.header-logo{ width:min(150px, 44vw); height:auto; filter:drop-shadow(0 0 12px rgba(120,100,255,.25)); }
.header-word{
  font-family:var(--font); font-size:11px; font-weight:500;
  letter-spacing:0.74em; text-indent:0.74em; text-transform:uppercase;
  color:rgba(255,255,255,0.82);
  text-shadow:0 0 18px rgba(255,255,255,0.10);
}

/* ═══════ STAGE ═══════ */
.stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.orb-zone{
  position:relative; width:var(--halo); height:var(--halo);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}

.halo{
  position:absolute; width:100%; height:100%; border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0%, color-mix(in srgb, var(--core-a) 55%, transparent) 24%,
    color-mix(in srgb, var(--core-b) 40%, transparent) 50%,
    color-mix(in srgb, var(--core-a) 45%, transparent) 74%, transparent 92%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  animation:halospin 28s linear infinite;
  transition:opacity 0.6s ease, filter 0.6s ease;
  opacity:0.45;
}
.halo.fast{ animation-duration:14s; opacity:0.75; }
.orb-zone:hover .halo{ animation-duration:20s; opacity:0.62; filter:brightness(1.1); }
@keyframes halospin{ to{ transform:rotate(360deg); } }

/* anéis de energia — só aparecem enquanto o ORION fala */
.wave-ring{
  position:absolute; left:50%; top:50%; border-radius:50%;
  width:var(--orb); height:var(--orb);
  transform:translate(-50%,-50%) scale(1);
  border:1px solid color-mix(in srgb, var(--core-c) 70%, transparent);
  opacity:0; pointer-events:none;
}
.orb-zone.speaking .wave-ring{ animation:wave-out 2.8s ease-out infinite; }
.orb-zone.speaking .wave-ring:nth-child(2){ animation-delay:0.93s; }
.orb-zone.speaking .wave-ring:nth-child(3){ animation-delay:1.86s; }
@keyframes wave-out{
  0%{ transform:translate(-50%,-50%) scale(1); opacity:0.45; }
  100%{ transform:translate(-50%,-50%) scale(1.55); opacity:0; }
}

/* V10 — o elemento .orb deixa de ser uma esfera de vidro: fica invisível e só aparece como painel de resposta */
.orb{
  position:relative; flex:none; width:var(--orb); height:var(--orb); border-radius:50%;
  overflow:hidden;
  background:transparent;
  border:1px solid transparent;
  box-shadow:none;
  animation:orbfloat 10s ease-in-out infinite, orbbreathe 6s ease-in-out infinite;
  transition:box-shadow 0.9s ease, filter 0.6s ease, transform 0.4s ease, opacity .45s ease, border-color .45s ease,
    width .55s cubic-bezier(.16,.9,.24,1), height .55s cubic-bezier(.16,.9,.24,1), border-radius .55s cubic-bezier(.16,.9,.24,1);
  will-change:transform;
  z-index:1;
}
.orb.pressed{ transform:scale(1.08) !important; transition:transform 0.15s ease; }
@keyframes orbfloat{ 0%,100%{margin-top:0;} 50%{margin-top:-14px;} }
@keyframes orbbreathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.035);} }
.orb.st-listening{ filter:brightness(1.08); animation:orbfloat 10s ease-in-out infinite, orbbreathe 3.4s ease-in-out infinite; }
.orb.st-thinking{ filter:brightness(1.03); animation:orbfloat 10s ease-in-out infinite, orbbreathe 2.2s ease-in-out infinite; }
.orb.st-speaking{ filter:brightness(1.12); animation:orbfloat 10s ease-in-out infinite, orbbreathe 2.6s ease-in-out infinite; }
.orb.st-error{ filter:brightness(0.62); animation:orberr 0.42s ease; }
@keyframes orberr{ 0%{transform:translateX(0);} 25%{transform:translateX(-7px);} 55%{transform:translateX(6px);} 80%{transform:translateX(-3px);} 100%{transform:translateX(0);} }

/* o canvas antigo da Orb continua no DOM (o app.js depende dele), mas fica invisível */
.orb-canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; mix-blend-mode:screen; }
.glass-hi{ position:absolute; top:6%; left:9%; width:44%; height:38%; border-radius:50%;
  background:radial-gradient(ellipse at 38% 32%, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 46%, transparent 74%);
  transform:rotate(-22deg); pointer-events:none; z-index:2; }
.glass-rim{ position:absolute; bottom:6%; right:8%; width:24%; height:12%; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,0.06) 0%, transparent 72%); pointer-events:none; z-index:2; }
.orb-canvas, .glass-hi, .glass-rim{ opacity:0 !important; }

.status{
  position:absolute; left:0; right:0;
  top:calc(50% + var(--halo)/2 + 30px);
  display:flex; justify-content:center; pointer-events:none;
}
.status-text{
  font-size:10px; font-weight:500; letter-spacing:0.28em; text-transform:uppercase;
  color:rgba(255,255,255,0.55); opacity:0; transform:translateY(4px);
  transition:opacity 0.6s ease, transform 0.6s ease;
  white-space:normal; text-align:center; max-width:min(520px, 90vw); line-height:1.7;
}
.status-text.show{ opacity:1; transform:translateY(0); }

.hint{
  position:absolute; left:0; right:0; bottom:clamp(30px, 7vh, 64px);
  display:flex; justify-content:center; pointer-events:none;
}
.hint-text{
  font-size:9px; font-weight:500; letter-spacing:0.4em; text-transform:uppercase;
  color:rgba(255,255,255,0.14); transition:opacity 1s ease;
}

.version-tag{
  position:fixed; left:18px; bottom:16px; z-index:40;
  font-family:var(--font-mono); font-size:9px; font-weight:500;
  letter-spacing:0.22em; text-transform:uppercase;
  color:rgba(255,255,255,0.16); user-select:none; pointer-events:none;
}
.mark-tag{
  position:fixed; left:18px; bottom:4px; z-index:40;
  font-family:var(--font-mono); font-size:9px; font-weight:500;
  letter-spacing:0.22em; text-transform:uppercase;
  color:rgba(255,255,255,0.16); user-select:none; pointer-events:none;
}

/* ═══════ SETTINGS (Ctrl + ,) ═══════ */
#settingsPanel{
  position:fixed; inset:0; z-index:150;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.72); backdrop-filter:blur(6px);
  opacity:0; pointer-events:none; transition:opacity 0.35s ease;
}
#settingsPanel.open{ opacity:1; pointer-events:auto; }
.settings-card{
  width:min(330px, 88vw); padding:28px 26px;
  border:1px solid rgba(167,139,250,0.22); border-radius:14px;
  background:rgba(8,8,14,0.92);
  box-shadow:0 0 60px rgba(91,33,182,0.18);
}
.settings-title{
  font-size:10px; font-weight:500; letter-spacing:0.34em; text-transform:uppercase;
  color:rgba(255,255,255,0.6); margin-bottom:22px; text-align:center;
}
.settings-row{
  display:flex; align-items:center; justify-content:space-between;
  font-size:12px; font-weight:500; color:rgba(255,255,255,0.75);
  padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06);
}
.settings-row:last-of-type{ border-bottom:none; }
.settings-toggle{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  color:#a78bfa; background:rgba(167,139,250,0.10); border:1px solid rgba(167,139,250,0.3);
  border-radius:20px; padding:5px 12px; cursor:pointer; transition:all 0.25s ease;
}
.settings-toggle:hover{ background:rgba(167,139,250,0.18); }
.settings-hint{
  margin-top:20px; text-align:center; font-size:9px; font-weight:500;
  letter-spacing:0.2em; color:rgba(255,255,255,0.22);
}

/* botão de configurações (canto inferior direito) */
.gear{
  position:fixed; right:16px; bottom:12px; z-index:40;
  width:40px; height:40px; border-radius:50%; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:rgba(255,255,255,0.38); background:transparent; border:1px solid transparent;
  transition:color .3s ease, border-color .3s ease, transform .3s ease, background .3s ease;
}
.gear:hover{ color:rgba(255,255,255,0.85); border-color:rgba(167,139,250,0.3); background:rgba(167,139,250,0.08); transform:translateY(-2px); }
.gear:focus-visible{ outline:1px solid #a78bfa; outline-offset:3px; }
.settings-email{ font-size:11px; font-weight:500; color:rgba(255,255,255,0.5); max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.settings-out{
  width:100%; margin-top:18px; height:40px; border-radius:20px; cursor:pointer;
  font:500 11px var(--font); letter-spacing:0.22em; text-transform:uppercase;
  color:#f87171; background:rgba(248,113,113,0.07); border:1px solid rgba(248,113,113,0.30);
  transition:background .25s ease;
}
.settings-out:hover{ background:rgba(248,113,113,0.15); }

/* ═══════ Resposta: a Orb (agora invisível) vira o painel no lugar ═══════
   O anel em volta some, o painel cresce no centro e a resposta aparece nele. */
.orb-zone{ transition:transform .9s cubic-bezier(.2,.7,.2,1); }
body.chat-open .orb-zone:not(.panel-open){ transform:scale(.78); }   /* com o campo de pergunta aberto, a constelação diminui um pouco */
.orb-zone.panel-open{ cursor:default; }
.orb-zone.panel-open .halo, .orb-zone.panel-open .wave-ring{ opacity:0 !important; }
.status{ transition:top .8s cubic-bezier(.16,.9,.24,1); }
body.panel-on .status{ top:calc(50% + var(--panel-h)/2 + 18px); }   /* "Processando…" fica logo abaixo do painel */

.orb.panel{
  width:var(--panel-w); height:var(--panel-h); border-radius:28px; animation:none !important; filter:none !important; cursor:default;
  border-color:color-mix(in srgb, var(--core-c) 45%, transparent);
  box-shadow:
    0 0 60px color-mix(in srgb, var(--core-a) 30%, transparent),
    0 0 130px color-mix(in srgb, var(--core-b) 22%, transparent),
    inset 0 0 60px rgba(0,0,0,0.7);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
}
.orb-canvas, .glass-hi, .glass-rim{ transition:opacity .45s ease; }
.panel-bg{ position:absolute; inset:0; z-index:1; background:rgba(7,7,15,.94); opacity:0; transition:opacity .35s ease; pointer-events:none; }
.orb.panel .panel-bg{ opacity:1; }

.panel-ui{
  position:absolute; inset:0; z-index:3; display:flex; flex-direction:column;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .25s ease, visibility 0s linear .25s;
}
.orb.panel .panel-ui{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .3s ease .3s, visibility 0s linear .3s; }

.answer-scroll{
  flex:1; min-height:0; overflow-y:auto; padding:26px 28px 10px; text-align:center;
  scrollbar-width:thin; scrollbar-color:rgba(167,139,250,.35) transparent;
}
.answer-scroll.scrolls{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
          mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
}
.response-text{
  font-size:clamp(14px, 2.1vmin, 17px); font-weight:600; line-height:1.75; letter-spacing:.02em;
  color:rgba(255,255,255,.92); text-shadow:0 0 22px color-mix(in srgb, var(--core-c) 38%, transparent);
}
.response-text .w{ display:inline-block; opacity:0; filter:blur(5px); animation:wordin .45s ease forwards; }
@keyframes wordin{ to{ opacity:1; filter:blur(0); } }
.orb.answer-error .response-text{ font-size:13px; letter-spacing:.06em; color:#fca5a5; text-shadow:0 0 18px rgba(248,113,113,.3); }

/* galeria de imagens da pesquisa (até 3) */
.answer-gallery{ display:flex; gap:10px; justify-content:center; margin:0 auto 14px; }
.answer-gallery[hidden]{ display:none; }
.answer-gallery img{
  flex:1 1 0; min-width:0; height:170px; object-fit:cover; border-radius:14px;
  border:1px solid color-mix(in srgb, var(--core-c) 30%, transparent);
  box-shadow:0 0 24px color-mix(in srgb, var(--core-a) 25%, transparent);
  opacity:0; transition:opacity .5s ease;
}
.answer-gallery img.loaded{ opacity:1; }
.answer-gallery img:only-child{ flex:none; height:auto; max-height:220px; max-width:100%; object-fit:contain; }
@media (max-width:520px){ .answer-gallery img{ height:120px; } }

.answer-source{
  flex:none; align-self:center; margin:0 0 8px; padding:6px 14px; border-radius:16px;
  font:500 10px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  color:color-mix(in srgb, var(--core-c) 85%, #fff); border:1px solid color-mix(in srgb, var(--core-c) 40%, transparent);
  background:color-mix(in srgb, var(--core-a) 14%, transparent); transition:background .25s ease;
}
.answer-source:hover{ background:color-mix(in srgb, var(--core-a) 30%, transparent); }
.answer-source[hidden]{ display:none; }

/* campo de pergunta: sobe da base da tela (botão de chat) */
.ask{
  position:absolute; left:50%; z-index:5; bottom:16px;
  width:min(560px, 88vw); height:48px; padding:0 6px 0 22px;
  display:flex; align-items:center; gap:4px; border-radius:26px;
  background:rgba(8,8,18,.62); border:1px solid color-mix(in srgb, var(--core-a) 38%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translate(-50%, 70vh) scale(.92);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease, border-color .4s ease, box-shadow .4s ease, visibility 0s linear .9s;
}
.ask.open{
  opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%, 0) scale(1);
  box-shadow:0 0 34px color-mix(in srgb, var(--core-a) 28%, transparent);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease .08s, border-color .4s ease, box-shadow .4s ease, visibility 0s;
}
.ask:focus-within{ border-color:color-mix(in srgb, var(--core-c) 75%, transparent); box-shadow:0 0 38px color-mix(in srgb, var(--core-a) 40%, transparent); }
.ask-input{ flex:1; min-width:0; height:100%; background:none; border:0; outline:none; color:#fff; font:500 14px var(--font); letter-spacing:.04em; }
.ask-input::placeholder{ color:rgba(255,255,255,.3); letter-spacing:.06em; }
.ask-input:disabled{ opacity:.55; }
.ask-send, .ask-mic{
  width:36px; height:36px; border-radius:50%; border:0; cursor:pointer; flex:none;
  display:flex; align-items:center; justify-content:center; transition:filter .3s ease, opacity .3s ease, color .3s ease;
}
.ask-send{ color:#fff; background:color-mix(in srgb, var(--core-a) 50%, transparent); }
.ask-mic{ color:rgba(255,255,255,.55); background:transparent; }
.ask-mic:hover{ color:#fff; }
.ask-send:hover{ filter:brightness(1.3); }
.ask-send:disabled, .ask-mic:disabled{ opacity:.35; cursor:default; }
.ask-send:focus-visible, .ask-mic:focus-visible{ outline:1px solid #a78bfa; outline-offset:2px; }
@media (max-width:760px){ .ask{ bottom:72px; } }

/* brilho que sobe da base da tela ao abrir o campo de pergunta */
.siri{
  position:fixed; left:0; right:0; bottom:0; height:55vh; z-index:4; pointer-events:none;
  opacity:0; transform:translateY(100%); filter:blur(22px);
  background:
    radial-gradient(55% 60% at 18% 100%, rgba(30,64,175,.62), transparent 72%),
    radial-gradient(55% 62% at 50% 100%, color-mix(in srgb, var(--core-a) 75%, transparent), transparent 72%),
    radial-gradient(55% 60% at 84% 100%, rgba(34,197,94,.32), transparent 72%);
}
.siri.play{ animation:siri 1.7s cubic-bezier(.2,.75,.2,1) forwards; }
@keyframes siri{
  0%{ opacity:0; transform:translateY(100%); }
  30%{ opacity:1; }
  62%{ opacity:.9; transform:translateY(8%); }
  100%{ opacity:0; transform:translateY(-6%); }
}

/* a dica fica sempre visível; só some enquanto o campo de pergunta ocupa o lugar dela */
body.chat-open .hint-text{ opacity:0; }

/* botão de chat (ao lado do ⚙) */
.chat-btn{ right:60px; }
.chat-btn.on{ color:#fff; border-color:rgba(167,139,250,.45); background:rgba(167,139,250,.14); }
.settings-select{
  max-width:160px; font:500 11px var(--font-mono); color:#a78bfa; background:rgba(167,139,250,.10);
  border:1px solid rgba(167,139,250,.3); border-radius:20px; padding:5px 10px; outline:none; cursor:pointer;
}
.settings-select option{ background:#0b0b14; color:#fff; }
@media (prefers-reduced-motion:reduce){
  .response-text .w{ animation:none; opacity:1; filter:none; }
  .orb{ transition:none; }
  .panel-ui{ transition:none; }
  .siri{ display:none; }
  .ask,.ask.open{ transition:opacity .2s ease, visibility 0s; }
  .orb,.halo,.boot-ring,.header-dot,.wave-ring{ animation:none !important; }
}
</style>
</head>
<body>

<div class="void"></div>
<div class="orb-bleed" id="bleed"></div>

<!-- BOOT -->
<div id="boot">
  <img class="boot-word" src="../assets/orion_ai_wordmark.png" alt="ORION AI">
  <div class="boot-ring-wrap">
    <div class="boot-ring"></div>
    <div class="boot-ring"></div>
  </div>
  <p class="boot-status" id="bootStatus">inicializando</p>
</div>

<!-- APP -->
<div id="app">

  <!-- V10: universo/constelação em tela cheia, fora da Orb -->
  <canvas id="universe" aria-hidden="true"></canvas>

  <div class="header">
    <div class="header-dot"></div>
    <img class="header-logo" src="../assets/orion_ai_wordmark.png" alt="ORION AI">
    <div class="header-dot"></div>
  </div>

  <div class="stage">
    <div class="orb-zone" id="orbZone">
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>
      <div class="wave-ring"></div>

<!-- ═══════ V10 — CONSTELAÇÃO 3D (fora da Orb) ═══════
     Rede de estrelas em 3D, no visual da V10. Não depende do app.js: lê o estado pelas classes da Orb
     (st-listening/thinking/speaking/error, .speaking, .panel, body.chat-open) e a cor pelas variáveis
     --core-a/b/c, as mesmas que a Orb atualiza ao vivo. -->
<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('universe'), ctx = cv.getContext('2d'), orbEl = $('orb'), zone = $('orbZone'), cs = getComputedStyle(document.documentElement);
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const PD = {
    standby:   { speed: .5, spin: .12,  radius: .85, turb: .04, wave: 0,  dir: -1, sag: 0,  size: 1,    gain: 1,    voice: 0, gal: 0, link: .5 },
    listening: { speed: .8, spin: .25,  radius: .55, turb: .05, wave: .8, dir: -1, sag: 0,  size: 1.15, gain: 1.15, voice: 0, gal: 0, link: .7 },
    thinking:  { speed: 1.3, spin: .9,  radius: .95, turb: .04, wave: 0,  dir: 1,  sag: 0,  size: .95,  gain: 1.1,  voice: 0, gal: 1, link: 1 },
    speaking:  { speed: 1,  spin: .2,   radius: .9,  turb: .08, wave: 1,  dir: 1,  sag: 0,  size: 1.2,  gain: 1.25, voice: 1, gal: 0, link: .55 },
    error:     { speed: 2,  spin: -.3,  radius: 1.05, turb: .5, wave: 0,  dir: 1,  sag: .5, size: .9,   gain: .55,  voice: 0, gal: 0, link: 0 },
  };
  const BRIGHT = { standby: 1, listening: 1.18, thinking: 1.05, speaking: 1.3, error: .62 };
  const PERIOD = { standby: 6, listening: 3.4, thinking: 2.2, speaking: 2.6, error: 6 };   // respiração igual à da Orb
  const S = { ...PD.standby }; let ST = PD.standby, name = 'standby', W = 0, H = 0, dpr = 1, last = 0, fr = 0;
  let tt = 0, yaw = 0, kick = 0, mx = 0, my = 0, ox = 0, oy = 0, hovered = false, bright = 1, per = 6, bph = 0, fph = 0, zoom = 1, dim = 1, shake = 0;
  const N = 280, NL = 110, CAM = 3.4, TAU = 6.2832;
  const STAR = Array.from({ length: N }, (_, i) => {
    const u = Math.random() * 2 - 1, th = Math.random() * TAU, q = Math.sqrt(1 - u * u), r = .2 + .8 * Math.cbrt(Math.random());
    const gr = .04 + Math.sqrt(Math.random()) * .96, ga = (i % 3) * 2.094 + gr * 4.5 + (Math.random() - .5) * .6;
    return { sx: q * Math.cos(th) * r, sy: u * r, sz: q * Math.sin(th) * r, gx: Math.cos(ga) * gr, gy: (Math.random() - .5) * .07 * (1 - gr * .5), gz: Math.sin(ga) * gr,
      ph: Math.random() * TAU, s0: .6 + Math.random() * 1.2, hi: i < NL, x: 0, y: 0, z: 0, px: 0, py: 0, pd: 1, da: 1 };
  });
  const BG = Array.from({ length: 110 }, () => { const u = Math.random() * 2 - 1, th = Math.random() * TAU, q = Math.sqrt(1 - u * u), r = 1.3 + Math.random() * .8;
    return { x: q * Math.cos(th) * r, y: u * r, z: q * Math.sin(th) * r, ph: Math.random() * TAU, s0: .4 + Math.random() * .7 }; });

  // cor: lida ao vivo das variáveis da Orb
  const parse = v => { v = (v || '').trim(); let m = /^#([0-9a-f]{6})$/i.exec(v);
    if (m) { const n = parseInt(m[1], 16); return { r: n >> 16, g: n >> 8 & 255, b: n & 255 }; }
    if ((m = /^#([0-9a-f])([0-9a-f])([0-9a-f])$/i.exec(v))) return { r: parseInt(m[1] + m[1], 16), g: parseInt(m[2] + m[2], 16), b: parseInt(m[3] + m[3], 16) };
    if ((m = /rgba?\(([^)]+)\)/.exec(v))) { const p = m[1].split(/[ ,\/]+/).map(Number); return { r: p[0], g: p[1], b: p[2] }; }
    return null; };
  const dflt = { a: { r: 91, g: 33, b: 182 }, b: { r: 46, g: 16, b: 101 }, c: { r: 139, g: 92, b: 246 } };
  const now = { a: { ...dflt.a }, b: { ...dflt.b }, c: { ...dflt.c } }, tgt = { a: { ...dflt.a }, b: { ...dflt.b }, c: { ...dflt.c } };
  const lerpC = (f, t, k) => ({ r: f.r + (t.r - f.r) * k, g: f.g + (t.g - f.g) * k, b: f.b + (t.b - f.b) * k });
  const rgba = (o, a) => `rgba(${Math.round(o.r)},${Math.round(o.g)},${Math.round(o.b)},${Math.max(0, Math.min(1, a))})`;
  const white = { r: 255, g: 255, b: 255 };
  const readState = () => { const c = orbEl.classList;
    return c.contains('st-error') ? 'error' : (c.contains('st-speaking') || zone.classList.contains('speaking')) ? 'speaking' : c.contains('st-thinking') ? 'thinking' : c.contains('st-listening') ? 'listening' : 'standby'; };

  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); W = window.innerWidth; H = window.innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

  function draw(ts) {
    requestAnimationFrame(draw);
    if (!W) return;
    const dt = Math.min(.05, (ts - last) / 1000 || .016) * (RM ? .25 : 1), f = dt * 60; last = ts; fr++;
    const sm = c => 1 - Math.pow(1 - c, f);
    const nn = readState();
    if (nn !== name) { name = nn; ST = PD[nn]; kick = Math.max(kick, .35); if (nn === 'error') shake = .42; }
    if (fr % 3 === 0) ['a', 'b', 'c'].forEach(k => { const p = parse(cs.getPropertyValue('--core-' + k)); if (p && isFinite(p.r + p.g + p.b)) tgt[k] = p; });
    for (const k in ST) S[k] += (ST[k] - S[k]) * sm(.035);
    bright += (BRIGHT[name] - bright) * sm(.045);
    ['a', 'b', 'c'].forEach(k => { now[k] = lerpC(now[k], tgt[k], sm(.25)); });
    per += (PERIOD[name] - per) * sm(.05); bph += dt * TAU / per; fph += dt * TAU / 10; shake = Math.max(0, shake - dt);
    const panelOn = orbEl.classList.contains('panel'), chatOn = document.body.classList.contains('chat-open');
    zoom += ((chatOn && !panelOn ? .78 : 1) - zoom) * (1 - Math.exp(-dt * 3.2));   // acompanha o scale da zona
    dim += ((panelOn ? .4 : 1) - dim) * (1 - Math.exp(-dt * 3.5));                 // com o painel aberto, a constelação recua
    tt += S.speed * .017 * f; yaw += S.spin * .017 * f; kick *= Math.pow(.94, f); ox += (mx - ox) * sm(.05); oy += (my - oy) * sm(.05);

    ctx.clearRect(0, 0, W, H);
    const orbPx = Math.max(190, Math.min(320, Math.min(W, H) * .32));
    const br = 1 + .035 * (.5 - .5 * Math.cos(bph));                                  // respiração da Orb
    const b = bright * (hovered ? 1.08 : 1) * dim, U = orbPx * 1.02 * zoom * br, sc = U / 260;
    const cx = W / 2 + (shake > 0 ? Math.sin((1 - shake / .42) * 12.6) * 7 * (shake / .42) : 0), cy = H / 2 - 7 * (.5 - .5 * Math.cos(fph)) * zoom;
    const env = .5 + .5 * Math.sin(tt * 6.5) * Math.sin(tt * 2.1 + 1.3);
    const ya = yaw + ox * .9, pa = .28 + oy * .6, cyw = Math.cos(ya), syw = Math.sin(ya), cpi = Math.cos(pa), spi = Math.sin(pa);

    // brilho suave atrás da constelação (o "glow" da Orb, sem a esfera de vidro)
    const gr = U * 1.5, g = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
    g.addColorStop(0, rgba(now.a, .17 * b)); g.addColorStop(.55, rgba(now.b, .07 * b)); g.addColorStop(1, rgba(now.b, 0));
    ctx.fillStyle = g; ctx.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);

    // fundo distante (paralaxe)
    const UB = Math.max(W, H) * .42, by = ya * .5, cby = Math.cos(by), sby = Math.sin(by);
    BG.forEach(s => {
      const x1 = s.x * cby + s.z * sby, z1 = -s.x * sby + s.z * cby, y2 = s.y * cpi - z1 * spi, z2 = s.y * spi + z1 * cpi, pd = CAM / (CAM + z2);
      ctx.fillStyle = rgba(lerpC(now.c, white, .5), (.16 + .2 * (.5 + .5 * Math.sin(tt * 1.3 + s.ph))) * b);
      ctx.beginPath(); ctx.arc(W / 2 + x1 * UB * pd, H / 2 + y2 * UB * pd, s.s0 * pd * (UB / 340), 0, TAU); ctx.fill();
    });

    // estrelas: esfera ↔ galáxia, com onda, voz, turbulência, queda e câmera 3D
    STAR.forEach(s => {
      let x = s.sx + (s.gx - s.sx) * S.gal, y = s.sy + (s.gy - s.sy) * S.gal, z = s.sz + (s.gz - s.sz) * S.gal;
      const r0 = Math.hypot(x, y, z) || 1e-6, k = S.radius * (1 + .05 * Math.sin(tt * .9 + s.ph)) * (1 + .16 * S.voice * env);
      const disp = S.wave * .09 * Math.sin(9 * r0 - S.dir * tt * 4) + kick * .2, tb = S.turb * .15;
      x = x * k + x / r0 * disp + tb * (Math.sin(tt * 2.3 + s.ph * 3) + Math.sin(tt * 3.7 + s.ph)) + .02 * Math.sin(tt * .6 + s.ph * 2);
      y = y * k + y / r0 * disp + tb * (Math.cos(tt * 2.1 + s.ph * 2) + Math.sin(tt * 4.1 + s.ph * 3)) + S.sag * (.25 + .3 * r0) + .02 * Math.cos(tt * .5 + s.ph);
      z = z * k + z / r0 * disp + tb * (Math.sin(tt * 1.9 + s.ph * 4) + Math.cos(tt * 3.3 + s.ph));
      const d = Math.hypot(x, y, z); if (d > 1.05) { x *= 1.05 / d; y *= 1.05 / d; z *= 1.05 / d; }
      const x1 = x * cyw + z * syw, z1 = -x * syw + z * cyw, y2 = y * cpi - z1 * spi, z2 = y * spi + z1 * cpi;
      s.x = x1; s.y = y2; s.z = z2; s.pd = CAM / (CAM + z2); s.px = cx + x1 * U * s.pd; s.py = cy + y2 * U * s.pd; s.da = Math.max(.15, Math.min(1, .6 - .4 * z2));
    });

    // linhas entre estrelas próximas (rede neural)
    if (S.link > .02) {
      const th = .34, th2 = th * th; ctx.lineWidth = .8;
      for (let i = 0; i < NL; i++) for (let j = i + 1; j < NL; j++) {
        const p = STAR[i], q = STAR[j], dx = p.x - q.x, dy = p.y - q.y, dz = p.z - q.z, d2 = dx * dx + dy * dy + dz * dz;
        if (d2 < th2) { ctx.strokeStyle = rgba(now.c, (1 - Math.sqrt(d2) / th) * .4 * S.link * b * (p.da + q.da) / 2); ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(q.px, q.py); ctx.stroke(); }
      }
    }

    // estrelas, de trás para frente
    STAR.slice().sort((p, q) => q.z - p.z).forEach(s => {
      const tw = .55 + .45 * Math.sin(tt * 2.2 + s.ph), rr = s.s0 * sc * s.pd * S.size * (s.hi ? 1.5 : 1), al = .85 * s.da * tw * b * S.gain;
      if (s.hi) { ctx.fillStyle = rgba(now.c, al * .12); ctx.beginPath(); ctx.arc(s.px, s.py, rr * 3.2, 0, TAU); ctx.fill(); }
      ctx.fillStyle = rgba(s.hi ? lerpC(now.c, white, .5) : now.c, al);
      ctx.beginPath(); ctx.arc(s.px, s.py, rr, 0, TAU); ctx.fill();
    });
  }

  resize(); window.addEventListener('resize', resize);
  const aim = (x, y) => { mx = x / W - .5; my = y / H - .5; };
  window.addEventListener('mousemove', e => aim(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) aim(t.clientX, t.clientY); }, { passive: true });
  zone.addEventListener('mouseenter', () => { hovered = true; }); zone.addEventListener('mouseleave', () => { hovered = false; });
  zone.addEventListener('pointerdown', () => { kick = 1; });
  requestAnimationFrame(draw);
})();
</script>
