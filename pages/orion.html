<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../standby.js" data-mount></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ORION AI</title>
<meta name="theme-color" content="#090808">
<script>try{var s=JSON.parse(localStorage.getItem('orion_settings')||'{}');document.documentElement.dataset.theme=s.theme==='nebulosa'?'nebulosa':'preto'}catch(e){document.documentElement.dataset.theme='preto'}</script>
<link rel="icon" href="../favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

/* ═══════ ORION AI V5.0.2 — preto + azul escuro. A Orb mantém o desenho original (só o roxo virou azul escuro). ═══════ */
:root{
  --font:'Sora', -apple-system, 'Helvetica Neue', sans-serif;
  --font-mono:'Space Grotesk', 'Inter', sans-serif;
  --orb:clamp(190px, 32vmin, 320px);
  --halo:calc(var(--orb) * 1.9);
  --panel-w:min(550px, 90vw);
  --panel-h:clamp(280px, 58vh, 400px);
  /* cor "ao vivo" da Orb — atualizada quadro a quadro por app.js (ORB) */
  --core-a:#1E3A8A; --core-b:#0F1F52; --core-c:#2A5BC4;

  color-scheme:dark;
  --bg:#090808; --surface:#101123; --surface2:#131313; --active:#1B1D40; --line:#26283F;
  --fg:#F5F7FA; --fg2:#929BAA; --w:245,247,250;
  --acc:94,143,224; --act:16,17,35; --act-hi:27,29,64;
  --accent:#6B9AE8; --accent-soft:#9DB8E8; --accent-text:#DCE8FB;
  --ok:#22C55E; --err:#EF4444; --danger:#EF4444;
  --scrim:rgba(9,8,8,.78); --card:rgba(16,17,35,.96); --card-solid:#101123; --panel-bg:rgba(16,17,35,.94); --ask-bg:rgba(16,17,35,.78);
  --chip:#131313; --bar:#101123; --track-b:#131313;
  --orb-mid:rgba(3,6,14,.88); --orb-end:rgba(2,4,10,.95); --orb-inset:rgba(0,0,0,.7);
  --r-lg:24px; --r-md:16px; --ease:cubic-bezier(.16,.9,.24,1);
}
html,body{ width:100vw; height:100dvh; overflow:hidden; background:var(--bg); font-family:var(--font); color:var(--fg); -webkit-font-smoothing:antialiased; }
button{ font-family:inherit; }
.void{ position:fixed; inset:0; background:var(--bg-grad, var(--bg)); z-index:0; }
.orb-bleed{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(circle at 50% 54%, color-mix(in srgb, var(--core-a) 10%, transparent) 0%, transparent 42%);
  transition:opacity 1.2s ease; opacity:var(--bleed-op, 1);
}

/* ═══════ temas: PRETO (padrão) e NEBULOSA (o mesmo preto, com estrelas e nuvens azul-escuras) ═══════ */
.stars{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:0; transition:opacity .6s ease; }
.stars::before, .stars::after{ content:""; position:absolute; inset:-6%; }
body{ transition:opacity .3s ease; }
html.theme-swap body{ opacity:0; transition-duration:.2s; }

    radial-gradient(circle 1.0px at 28.6% 29.9%, rgba(200,215,240,0.48), rgba(200,215,240,0)),

    radial-gradient(circle 0.8px at 44.2% 35.9%, rgba(200,215,240,0.81), rgba(200,215,240,0)),
    radial-gradient(circle 1.0px at 15.2% 91.4%, rgba(200,215,240,0.71), rgba(200,215,240,0)),
    radial-gradient(circle 1.2px at 52.3% 12.3%, rgba(255,255,255,0.62), rgba(255,255,255,0)),
    radial-gradient(circle 1.3px at 78.4% 6.5%, rgba(191,219,254,0.74), rgba(191,219,254,0)),

    radial-gradient(circle 1.0px at 10.8% 34.8%, rgba(200,215,240,0.47), rgba(200,215,240,0)),
    radial-gradient(circle 1.1px at 31.0% 77.9%, rgba(191,219,254,0.75), rgba(191,219,254,0)),
    radial-gradient(circle 0.9px at 46.5% 51.2%, rgba(255,255,255,0.7), rgba(255,255,255,0)),
    radial-gradient(circle 0.9px at 76.2% 55.1%, rgba(191,219,254,0.83), rgba(191,219,254,0)),

    radial-gradient(circle 1.2px at 19.3% 93.2%, rgba(191,219,254,0.6), rgba(191,219,254,0)),
    radial-gradient(circle 1.1px at 23.8% 21.0%, rgba(255,255,255,0.81), rgba(255,255,255,0)),

    radial-gradient(circle 1.1px at 47.8% 24.9%, rgba(191,219,254,0.61), rgba(191,219,254,0)),
    radial-gradient(circle 0.8px at 49.1% 32.4%, rgba(191,219,254,0.65), rgba(191,219,254,0)),
    radial-gradient(circle 1.2px at 66.3% 50.9%, rgba(191,219,254,0.8), rgba(191,219,254,0)),
    radial-gradient(circle 1.2px at 97.6% 68.0%, rgba(200,215,240,0.84), rgba(200,215,240,0)),
    radial-gradient(circle 1.0px at 61.1% 68.7%, rgba(255,255,255,0.55), rgba(255,255,255,0)),
    radial-gradient(circle 1.0px at 14.1% 40.7%, rgba(191,219,254,0.49), rgba(191,219,254,0)),
    radial-gradient(circle 0.9px at 54.4% 69.7%, rgba(255,255,255,0.46), rgba(255,255,255,0)),
    radial-gradient(circle 1.3px at 57.7% 52.0%, rgba(191,219,254,0.82), rgba(191,219,254,0)),
    radial-gradient(circle 0.8px at 28.9% 53.8%, rgba(200,215,240,0.49), rgba(200,215,240,0)),
    radial-gradient(circle 1.1px at 75.6% 37.4%, rgba(200,215,240,0.72), rgba(200,215,240,0)),
    radial-gradient(circle 1.0px at 20.3% 3.8%, rgba(255,255,255,0.55), rgba(255,255,255,0));
}
:root[data-theme="nebulosa"] .stars::before{
  background:
    radial-gradient(48% 40% at 14% 20%, rgba(27,29,64,.26), transparent 70%),
    radial-gradient(44% 40% at 86% 74%, rgba(38,40,63,.30), transparent 70%),
    radial-gradient(36% 30% at 62% 8%, rgba(16,17,35,.30), transparent 70%);
  animation:nebDrift 70s ease-in-out infinite alternate;
}
:root[data-theme="nebulosa"] .stars::after{ background-image:
    radial-gradient(circle 1.6px at 89.2% 93.5%, rgba(255,255,255,0.85), rgba(255,255,255,0)),
    radial-gradient(circle 1.3px at 9.1% 75.0%, rgba(255,255,255,0.95), rgba(255,255,255,0)),
    radial-gradient(circle 1.7px at 14.5% 81.2%, rgba(200,215,240,0.98), rgba(200,215,240,0)),
    radial-gradient(circle 1.2px at 11.9% 73.3%, rgba(200,215,240,0.81), rgba(200,215,240,0)),
    radial-gradient(circle 1.7px at 91.7% 69.0%, rgba(200,215,240,0.91), rgba(200,215,240,0)),
    radial-gradient(circle 1.4px at 34.3% 96.2%, rgba(200,215,240,0.75), rgba(200,215,240,0)),
    radial-gradient(circle 1.4px at 48.3% 31.3%, rgba(191,219,254,0.85), rgba(191,219,254,0)),
    radial-gradient(circle 1.7px at 23.2% 52.7%, rgba(200,215,240,0.88), rgba(200,215,240,0)),
    radial-gradient(circle 1.3px at 35.5% 32.0%, rgba(255,255,255,0.8), rgba(255,255,255,0)),
    radial-gradient(circle 1.6px at 48.9% 42.5%, rgba(255,255,255,0.74), rgba(255,255,255,0)),
    radial-gradient(circle 1.2px at 46.3% 6.9%, rgba(255,255,255,0.74), rgba(255,255,255,0)),
    radial-gradient(circle 1.6px at 91.3% 13.4%, rgba(255,255,255,0.92), rgba(255,255,255,0)),
    radial-gradient(circle 1.5px at 70.1% 80.0%, rgba(191,219,254,0.98), rgba(191,219,254,0)),
    radial-gradient(circle 1.3px at 5.9% 19.4%, rgba(191,219,254,0.74), rgba(191,219,254,0)),
    radial-gradient(circle 1.8px at 13.9% 75.8%, rgba(191,219,254,0.97), rgba(191,219,254,0)),

  animation:twinkle 6s ease-in-out infinite alternate;

@keyframes nebDrift{ from{ transform:translate3d(-2%,-1%,0) scale(1); } to{ transform:translate3d(2%,1.5%,0) scale(1.07); } }
@keyframes twinkle{ from{ opacity:.25; } to{ opacity:1; } }

/* ═══════ BOOT ═══════ */
#boot{ position:fixed; inset:0; z-index:200; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity .67s ease; }
#boot.out{ opacity:0; pointer-events:none; }
.boot-word{ width:min(190px, 56vw); height:auto; margin-bottom:24px; filter:drop-shadow(0 0 14px rgba(var(--acc),.22)); }
.boot-ring-wrap{ position:relative; width:76px; height:76px; margin-bottom:46px; }
.boot-ring{ position:absolute; inset:0; border-radius:50%; border:1px solid rgba(var(--acc),.18); border-top-color:rgba(var(--acc),.75); animation:bootspin 1.1s linear infinite; }
.boot-ring:nth-child(2){ inset:14px; border-top-color:rgba(var(--acc),.45); animation-duration:1.6s; animation-direction:reverse; }
@keyframes bootspin{ to{ transform:rotate(360deg); } }

/* ═══════ APP ═══════ */
#app{ position:fixed; inset:0; z-index:2; opacity:0; transition:opacity .75s ease; }
#app.on{ opacity:1; }
.header{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:center; padding-top:clamp(28px, 6vh, 56px); pointer-events:none; user-select:none; }
.header-logo{ width:min(220px, 62vw); height:auto; filter:drop-shadow(0 0 12px rgba(var(--acc),.2)); }

/* ═══════ STAGE / ORB (desenho original) ═══════ */
.stage{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.orb-zone{ position:relative; width:var(--halo); height:var(--halo); display:flex; align-items:center; justify-content:center; cursor:pointer; }

/* arco principal (o original) */
.halo{
  position:absolute; width:100%; height:100%; border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0%, color-mix(in srgb, var(--core-a) 55%, transparent) 24%,
    color-mix(in srgb, var(--core-b) 40%, transparent) 50%,
    color-mix(in srgb, var(--core-a) 45%, transparent) 74%, transparent 92%);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 1px), #fff calc(100% - 1px));
  transition:opacity .6s ease, filter .6s ease; opacity:.45;
}
.halo.fast{ opacity:.75; }
/* segundo arco: fino, mais sutil, raio menor, inclinado (a rotação vem do app.js) */
.halo.halo2{
  width:86%; height:86%;
  background:conic-gradient(from 130deg,
    transparent 0%, color-mix(in srgb, var(--core-a) 50%, transparent) 16%,
    transparent 40%, color-mix(in srgb, var(--core-b) 55%, transparent) 63%,
    color-mix(in srgb, var(--core-a) 36%, transparent) 78%, transparent 90%);
  opacity:.34; transform:rotate(-24deg) scaleY(.8);
}
.halo.halo2.fast{ opacity:.58; }
.orb-zone:hover .halo, .vs-zone:hover .halo{ opacity:.62; filter:brightness(1.1); }
.orb-zone:hover .halo.halo2, .vs-zone:hover .halo.halo2{ opacity:.48; }

.wave-ring{
  position:absolute; left:50%; top:50%; border-radius:50%; width:var(--orb); height:var(--orb);
  transform:translate(-50%, calc(-50% + var(--orb-y, 0px))) scale(1);
  border:1px solid color-mix(in srgb, var(--core-c) 70%, transparent); opacity:0; pointer-events:none;
}
.orb{
  position:relative; flex:none; width:var(--orb); height:var(--orb); border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 34% 30%,
    color-mix(in srgb, var(--core-c) 12%, transparent) 0%,
    color-mix(in srgb, var(--core-a) 6%, transparent) 32%,
    var(--orb-mid) 68%, var(--orb-end) 100%);
  border:1px solid color-mix(in srgb, var(--core-a) 28%, transparent);
  box-shadow:
    0 0 60px color-mix(in srgb, var(--core-a) 30%, transparent),
    0 0 130px color-mix(in srgb, var(--core-b) 22%, transparent),
    inset 0 0 60px var(--orb-inset),
    inset 0 1px 0 rgba(var(--w),.12);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  transform:translateY(var(--orb-y,0px)) scale(var(--orb-s,1));
  transition:box-shadow .9s ease, filter .6s ease, opacity .45s ease,
    width .55s cubic-bezier(.16,.9,.24,1), height .55s cubic-bezier(.16,.9,.24,1), border-radius .55s cubic-bezier(.16,.9,.24,1);
  will-change:transform; z-index:1;
}
.orb-zone:hover .orb{
  filter:brightness(1.06);
  box-shadow:
    0 0 78px color-mix(in srgb, var(--core-a) 40%, transparent),
    0 0 150px color-mix(in srgb, var(--core-b) 28%, transparent),
    inset 0 0 60px var(--orb-inset), inset 0 1px 0 rgba(var(--w),.14);
}
.orb.st-listening{ filter:brightness(1.08); }
.orb.st-thinking{ filter:brightness(1.03); }
.orb.st-speaking{ filter:brightness(1.12); }
.orb.st-error{ filter:brightness(.62); animation:orberr .42s ease; }
@keyframes orberr{ 0%,100%{ translate:0 0; } 25%{ translate:-4px 0; } 60%{ translate:4px 0; } 85%{ translate:-1px 0; } }
.orb-canvas{ position:absolute; inset:0; width:100%; height:100%; border-radius:50%; mix-blend-mode:screen; }
.glass-hi{ position:absolute; top:6%; left:9%; width:44%; height:38%; border-radius:50%;
  background:radial-gradient(ellipse at 38% 32%, rgba(255,255,255,.18) 0%, rgba(255,255,255,.04) 46%, transparent 74%);
  transform:rotate(-22deg); pointer-events:none; z-index:2; }
.glass-rim{ position:absolute; bottom:6%; right:8%; width:24%; height:12%; border-radius:50%;
  background:radial-gradient(ellipse, rgba(255,255,255,.06) 0%, transparent 72%); pointer-events:none; z-index:2; }

.status{ position:absolute; left:0; right:0; top:calc(50% + var(--halo)/2 + 30px); display:flex; justify-content:center; pointer-events:none; }
.status-text{
  font-size:11px; font-weight:500; letter-spacing:.24em; text-transform:uppercase; color:rgba(var(--w),.78);
  opacity:0; transform:translateY(4px); transition:opacity .3s ease, transform .3s ease;
  text-align:center; max-width:min(520px, 90vw); line-height:1.7;
}
.status-text.show{ opacity:1; transform:translateY(0); }
.status[data-state="error"] .status-text.show{ color:#F87171; }
.status[data-state="speaking"] .status-text.show{ color:#86EFAC; }
.status[data-state="listening"] .status-text.show{ color:var(--accent-soft); }

.hint{ position:absolute; left:0; right:0; bottom:clamp(30px, 7vh, 64px); display:flex; justify-content:center; pointer-events:none; }
.hint-text{ font-size:10px; font-weight:500; letter-spacing:.32em; text-transform:uppercase; color:rgba(var(--w),.5); transition:opacity .6s ease; text-align:center; padding:0 16px; line-height:1.8; }
body.chat-open .hint-text{ opacity:0; }
.version-tag{ position:fixed; left:20px; bottom:26px; z-index:40; font:500 9px var(--font-mono); letter-spacing:.22em; text-transform:uppercase; color:rgba(var(--w),.42); user-select:none; pointer-events:none; }

/* ═══════ DOCK (chat · código · configurações): um só grupo, canto inferior direito ═══════ */
.dock{
  position:fixed; right:16px; bottom:14px; z-index:40; display:flex; align-items:center; gap:2px; padding:4px;
  border-radius:999px; background:rgba(16,17,35,.72); border:1px solid var(--line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.dock-sep{ width:1px; height:18px; margin:0 3px; background:var(--line); }
.dock-btn{
  width:40px; height:40px; border-radius:50%; border:0; cursor:pointer; display:flex; align-items:center; justify-content:center;
  color:rgba(var(--w),.66); background:transparent; transition:color .2s ease, background .2s ease, transform .2s ease;
}
.dock-btn:hover{ color:var(--fg); background:rgba(var(--act),1); }
.dock-btn:active{ transform:scale(.94); }
.dock-btn.on{ color:var(--fg); background:var(--active); }
.dock-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

/* ═══════ painel de resposta: a própria Orb vira o painel ═══════ */
.orb-zone{ transition:transform .9s cubic-bezier(.2,.7,.2,1); }
body.chat-open .orb-zone:not(.panel-open){ transform:scale(.78); }
.orb-zone.panel-open{ cursor:default; }
.orb-zone.panel-open .halo, .orb-zone.panel-open .wave-ring{ opacity:0 !important; }
.status{ transition:top .8s cubic-bezier(.16,.9,.24,1); }
body.panel-on .status{ top:calc(50% + var(--panel-h)/2 + 18px); }
.orb.panel{ width:var(--panel-w); height:var(--panel-h); border-radius:28px; animation:none !important; filter:none !important; cursor:default; border-color:color-mix(in srgb, var(--core-c) 45%, transparent); }
.orb-canvas, .glass-hi, .glass-rim{ transition:opacity .45s ease; }
.orb.panel .orb-canvas, .orb.panel .glass-hi, .orb.panel .glass-rim{ opacity:0; }
.panel-bg{ position:absolute; inset:0; z-index:1; background:var(--panel-bg); opacity:0; transition:opacity .35s ease; pointer-events:none; }
.orb.panel .panel-bg{ opacity:1; }
.panel-ui{ position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; opacity:0; visibility:hidden; pointer-events:none; transition:opacity .25s ease, visibility 0s linear .25s; }
.orb.panel .panel-ui{ opacity:1; visibility:visible; pointer-events:auto; transition:opacity .3s ease .3s, visibility 0s linear .3s; }
.answer-scroll{ flex:1; min-height:0; overflow-y:auto; padding:26px 28px 10px; text-align:center; scrollbar-width:thin; scrollbar-color:rgba(var(--acc),.35) transparent; }
.answer-scroll.scrolls{ -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); mask-image:linear-gradient(to bottom, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%); }
.response-text{ font-size:clamp(14px, 2.1vmin, 17px); font-weight:600; line-height:1.75; letter-spacing:.02em; color:rgba(var(--w),.94); text-shadow:0 0 22px color-mix(in srgb, var(--core-c) 38%, transparent); }
.response-text .w{ display:inline-block; opacity:0; filter:blur(5px); animation:wordin .45s ease forwards; }
@keyframes wordin{ to{ opacity:1; filter:blur(0); } }
.orb.answer-error .response-text{ font-size:13px; letter-spacing:.06em; color:#F87171; text-shadow:none; }
.answer-gallery{ display:flex; gap:10px; justify-content:center; margin:0 auto 14px; }
.answer-gallery[hidden]{ display:none; }
.answer-gallery img{ flex:1 1 0; min-width:0; height:140px; object-fit:cover; border-radius:14px; border:1px solid var(--line); opacity:0; transition:opacity .5s ease; }
.answer-gallery img.loaded{ opacity:1; }
.answer-gallery img:only-child{ flex:none; height:auto; max-height:180px; max-width:100%; object-fit:contain; }
@media (max-width:520px){ .answer-gallery img{ height:100px; } }
.answer-source{
  flex:none; align-self:center; margin:0 0 10px; padding:7px 14px; border-radius:999px; font:500 10px var(--font-mono); letter-spacing:.14em; text-transform:uppercase; text-decoration:none;
  color:var(--accent-soft); border:1px solid rgba(var(--acc),.35); background:rgba(var(--act-hi),1); transition:background .2s ease;
}
.answer-source:hover{ background:rgba(var(--act-hi),1); }
.answer-source:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.answer-source[hidden]{ display:none; }

/* ═══════ campo de pergunta ═══════ */
.ask{
  position:absolute; left:50%; z-index:5; bottom:16px; width:min(560px, 88vw); height:52px; padding:0 6px;
  display:flex; align-items:center; gap:4px; border-radius:999px; background:var(--ask-bg); border:1px solid var(--line);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  opacity:0; visibility:hidden; pointer-events:none; transform:translate(-50%, 70vh) scale(.92);
  transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease, border-color .25s ease, box-shadow .25s ease, visibility 0s linear .9s;
}
.ask.open{ opacity:1; visibility:visible; pointer-events:auto; transform:translate(-50%, 0) scale(1); transition:transform .9s cubic-bezier(.16,.9,.24,1.06), opacity .5s ease .08s, border-color .25s ease, box-shadow .25s ease, visibility 0s; }

<script type="module">
/* Login real (Firebase): sem usuário logado, volta ao index.html com a mesma transição da entrada.
   Expõe o token do usuário para o provedor do backend. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const auth = getAuth(initializeApp({
  apiKey: "AIzaSyBpYSGxHqD_XbZszZiF5HbN-pIZOaveh9s",
  authDomain: "orion-ai-b8d39.firebaseapp.com",
  projectId: "orion-ai-b8d39",
  storageBucket: "orion-ai-b8d39.firebasestorage.app",
  messagingSenderId: "1087684319550",
  appId: "1:1087684319550:web:d5b20c93c2e3179de5f46f",
}));

let leaving = false;
function leave() {
  if (leaving) return;
  leaving = true;
  const o = document.createElement('div');   // mesmos círculos da tela de entrada
  o.id = 'leaveOverlay';
  o.innerHTML = '<img class="boot-word" src="../assets/orion_ai_wordmark.png" alt="ORION AI"><div class="boot-ring-wrap"><div class="boot-ring"></div><div class="boot-ring"></div></div>';
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add('on'));
  setTimeout(() => { location.replace('../index.html'); }, 1000);
}

let ready;
window.ORION_AUTH_READY = new Promise(r => { ready = r; });
onAuthStateChanged(auth, user => {
  window.ORION_USER = user;
  ready();
  if (!user) leave();
});
window.ORION_GET_TOKEN = async () => {
  await window.ORION_AUTH_READY;
  return auth.currentUser ? auth.currentUser.getIdToken() : '';
};
window.ORION_SIGNOUT = async () => {
  try { await signOut(auth); } catch (_) {}
  leave();
};
</script>
